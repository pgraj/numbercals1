<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>Angle \u03b8 (degrees)
      <span class="nc-field"><input id="sc-ang" type="number" value="30" step="any"></span></label>
    <label>Known side
      <span class="nc-field"><select id="sc-known"><option value="hyp" selected>Hypotenuse</option><option value="adj">Adjacent</option><option value="opp">Opposite</option></select></span></label>
    <label>Its length
      <span class="nc-field"><input id="sc-val" type="number" value="10" step="any"></span></label>
    <label>Find
      <span class="nc-field"><select id="sc-want"><option value="opp" selected>Opposite</option><option value="adj">Adjacent</option><option value="hyp">Hypotenuse</option></select></span></label>
  </div>

  <div class="viz-out" id="sc-out"></div>

  <canvas id="sc-diagram" width="640" height="320"
          style="display:block;width:100%;height:auto;max-width:520px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="sc-cap" style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="sc-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const P = "sc";
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      if(el.type==="range") return;
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$(P+"-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function buildBody(){
    return { angle_deg:$("sc-ang").value, known_type:$("sc-known").value, known_val:$("sc-val").value, want_type:$("sc-want").value };
  }

  async function update(){
    
    const body = buildBody();
    let data;
    try { const r=await fetch("/api/compute/"+slug,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $(P+"-out").textContent="compute error"; return; }
    try { if(window.NCSteps) window.NCSteps.render(data.steps||[]); } catch(e){}
    if (data.disclaimer) $(P+"-disc").textContent="\u26a0 "+data.disclaimer;
    if (data.error){ $(P+"-out").innerHTML="<b>"+data.error+"</b>"; try{window.__ncExplain([]);}catch(e){} drawDiagram(null); last=null; mountLearn(null); return; }
    $(P+"-out").innerHTML = '<b>'+ ({opp:"Opposite",adj:"Adjacent",hyp:"Hypotenuse"}[data.want_type]) +' = '+data.result+'</b>  (using '+data.ratio+')';
    try{ window.__ncExplain(data.explanation);}catch(e){}
    last=data; drawDiagram(data); mountLearn(data);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({ slug:slug, panel:panel, data:data, drawFrame:(data?drawFrame:undefined) });
  }

  function fmt(x){ if(x===null||x===undefined) return ""; return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*10000)/10000).toString(); }


  function drawDiagram(d){
    const cv=$(P+"-diagram"); if(!cv) return; const ctx=cv.getContext("2d"); const s=window.NCSkin||{};
    const ink=s.ink||"#222", accent=s.accent||"#b50", yes=s.yes||"#3a7", soft=s.inkSoft||"#777", rule=s.rule||"#ccc";
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H); const cap=$(P+"-cap");
    if(!d){ if(cap) cap.textContent=""; return; }
    drawSCT(ctx,d,s,ink,accent,yes,soft,rule,d.angle);
    if(cap) cap.textContent="The "+({opp:"opposite",adj:"adjacent",hyp:"hypotenuse"}[d.want_type])+" side is found from \u03b8 and the known side.";
  }
  function drawSCT(ctx,d,s,ink,accent,yes,soft,rule,ang){
    // Build a right triangle from angle + a nominal hypotenuse for display.
    const th=ang*Math.PI/180;
    const Hpx=170;
    const adj=Hpx*Math.cos(th), opp=Hpx*Math.sin(th);
    const Bx=130, By=250;          // right angle
    const Cx=Bx+adj, Cy=By;        // adjacent
    const Ax=Bx, Ay=By-opp;        // opposite
    function seg(x1,y1,x2,y2,col,w){ ctx.strokeStyle=col; ctx.lineWidth=w||2; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
    const want=d.want_type, known=d.known_type;
    const colFor = c => c===want? yes : (c===known? accent : ink);
    const wFor = c => (c===want||c===known)?3:2;
    seg(Ax,Ay,Bx,By, colFor("opp"), wFor("opp"));
    seg(Bx,By,Cx,Cy, colFor("adj"), wFor("adj"));
    seg(Ax,Ay,Cx,Cy, colFor("hyp"), wFor("hyp"));
    ctx.strokeStyle=soft; ctx.lineWidth=1; ctx.strokeRect(Bx,By-12,12,12);
    ctx.strokeStyle=accent; ctx.beginPath(); ctx.arc(Cx,Cy,26,Math.PI, Math.PI-th, true); ctx.stroke();
    ctx.fillStyle=ink; ctx.font="13px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillStyle=accent; ctx.font="bold 14px "+(s.sans||"sans-serif"); ctx.fillText("\u03b8="+fmt(ang)+"\u00b0", Cx-44, Cy-8);
    // annotate known + result values
    ctx.font="12px "+(s.sans||"sans-serif");
    ctx.fillStyle=accent; ctx.textAlign="center";
    const nm={opp:"opp",adj:"adj",hyp:"hyp"};
    ctx.fillText(nm[known]+"="+fmt(d.known_val), labelPos(known,Ax,Ay,Bx,By,Cx,Cy).x, labelPos(known,Ax,Ay,Bx,By,Cx,Cy).y);
    if(d.value!==undefined){ ctx.fillStyle=yes; ctx.fillText(nm[want]+"="+fmt(d.value), labelPos(want,Ax,Ay,Bx,By,Cx,Cy).x, labelPos(want,Ax,Ay,Bx,By,Cx,Cy).y+(want===known?14:0)); }
  }
  function labelPos(which,Ax,Ay,Bx,By,Cx,Cy){
    if(which==="opp") return {x:Bx-20,y:(Ay+By)/2};
    if(which==="adj") return {x:(Bx+Cx)/2,y:By+18};
    return {x:(Ax+Cx)/2+24,y:(Ay+Cy)/2-8};
  }


  function drawFrame(ctx,t,d){ if(!d) return; const s=window.NCSkin||{};
    const ink=s.ink||"#222", accent=s.accent||"#b50", yes=s.yes||"#3a7", soft=s.inkSoft||"#777", rule=s.rule||"#ccc";
    ctx.clearRect(0,0,640,320);
    // sweep the angle around its value to show sides responding
    const a = d.angle * (0.5 + 0.5*Math.sin(t*Math.PI*2)*0.4 + 0.1);
    const ang = Math.max(5, Math.min(85, d.angle*(0.6+0.4*Math.sin(t*2*Math.PI))));
    drawSCT(ctx,d,s,ink,accent,yes,soft,rule,ang);
  }

  ["sc-ang","sc-known","sc-val","sc-want"].forEach(id=>{ const el=$(id); el.addEventListener("input",update); el.addEventListener("change",update); });
  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawDiagram(last); });
  styleFields();  update();
})();
</script>
