<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label><span style="display:block;white-space:nowrap">Mode</span>
      <span class="nc-field" style="display:block"><select id="rd-mode" style="width:200px">
        <option value="convert" selected>Convert degrees ↔ radians</option>
        <option value="arc">Arc length (s = rθ)</option>
        <option value="sector">Sector area (½r²θ)</option>
      </select></span></label>
  </div>

  {# Convert-mode inputs #}
  <div class="viz-inputs" id="rd-convert-row">
    <label><span style="display:block;white-space:nowrap">Direction</span>
      <span class="nc-field" style="display:block"><select id="rd-dir"><option value="deg2rad" selected>Degrees → radians</option><option value="rad2deg">Radians → degrees</option></select></span></label>
    <label style="margin-left:15px"><span style="display:block;white-space:nowrap">Value</span>
      <span class="nc-field" style="display:block"><input id="rd-val" type="number" value="180" step="any"></span></label>
  </div>

  {# Arc/Sector-mode inputs (radius + angle + angle-unit toggle) #}
  <div id="rd-rt-wrap" style="display:none">
    <div style="margin-bottom:10px">{% include "_angle_unit.html" %}</div>
    <div class="viz-inputs">
      <label><span style="display:block;white-space:nowrap">Radius r</span>
        <span class="nc-field" style="display:block"><input id="rd-radius" type="number" value="5" step="any"></span></label>
      <label style="margin-left:15px"><span style="display:block;white-space:nowrap">Angle θ
          <span id="rd-unit-lbl" style="opacity:.7">(rad)</span></span>
        <span class="nc-field" style="display:block"><input id="rd-angle" type="number" value="2" step="any"></span></label>
    </div>
  </div>

  <div class="viz-out" id="rd-out"></div>

  <canvas id="rd-diagram" width="680" height="420"
          style="display:block;width:100%;height:auto;max-width:600px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="rd-cap" style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="rd-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script src="/static/ncangle.js"></script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const P = "rd";
  function unit(){ return (window.NCAngle ? NCAngle.current() : "rad"); }
  function curMode(){ return $("rd-mode").value; }
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      if(el.type==="range") return;
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$(P+"-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function buildBody(){
    const m = curMode();
    if(m==="convert") return { mode:"convert", value:$("rd-val").value, direction:$("rd-dir").value };
    return { mode:m, radius:$("rd-radius").value, angle:$("rd-angle").value, angle_unit:unit() };
  }

  async function update(){
    
    const body = buildBody();
    let data;
    try { const r=await fetch("/api/compute/"+slug,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $(P+"-out").textContent="compute error"; return; }
    try { if(window.NCSteps) window.NCSteps.render(data.steps||[]); } catch(e){}
    if (data.disclaimer) $(P+"-disc").textContent="\u26a0 "+data.disclaimer;
    if (data.error){ $(P+"-out").innerHTML="<b>"+data.error+"</b>"; try{window.__ncExplain([]);}catch(e){} drawDiagram(null); last=null; mountLearn(null); return; }
    $(P+"-out").innerHTML = '<b>'+data.result+'</b>'+(data.result_decimal!==undefined?('  \u2248 '+fmt(data.result_decimal)):'');
    try{ window.__ncExplain(data.explanation);}catch(e){}
    last=data; drawDiagram(data); mountLearn(data);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({ slug:slug, panel:panel, data:data, drawFrame:(data?drawFrame:undefined) });
  }

  function fmt(x){ if(x===null||x===undefined) return ""; return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*10000)/10000).toString(); }

  // Shared auto-fit: given natural-coordinate points [{x,y},...] and the canvas,
  // return a mapper m(p)->{x,y} that centres and scales them to fill the box
  // (minus margin) so NOTHING ever clips, whatever the inputs. Y is flipped so
  // positive-y is up in natural coords. Returns {map, scale}.
  function fitPts(pts, W, H, margin){
    margin = margin || 48;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    pts.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
    const spanX=Math.max(1e-6,maxX-minX), spanY=Math.max(1e-6,maxY-minY);
    const sc=Math.min((W-2*margin)/spanX, (H-2*margin)/spanY);
    const cxN=(minX+maxX)/2, cyN=(minY+maxY)/2;
    const map=(p)=>({ x: W/2 + (p.x-cxN)*sc, y: H/2 - (p.y-cyN)*sc });
    return { map, scale:sc };
  }


  function drawDiagram(d){
    const cv=$(P+"-diagram"); if(!cv) return; const ctx=cv.getContext("2d"); const s=window.NCSkin||{};
    const ink=s.ink||"#222", accent=s.accent||"#b50", yes=s.yes||"#3a7", soft=s.inkSoft||"#777", rule=s.rule||"#ccc";
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H); const cap=$(P+"-cap");
    if(!d){ if(cap) cap.textContent=""; return; }
    const m = d.mode || "convert";
    if(m==="convert"){
      drawArc(ctx,d,s,ink,accent,yes,soft,rule,1);
      if(cap) cap.textContent="The same angle shown as degrees and as radians (arc length on a unit circle).";
    } else {
      drawRT(ctx,d,s,ink,accent,yes,soft,rule,1);
      if(cap) cap.textContent = (m==="arc")
        ? "The bold arc is s = rθ; the radius and angle set its length."
        : "The shaded wedge is the sector; its area is ½r²θ.";
    }
  }
  // Arc-length / sector diagram: a circle of radius r (auto-scaled), the angle
  // swept anticlockwise, with the arc (arc mode) or wedge (sector mode) marked.
  function drawRT(ctx,d,s,ink,accent,yes,soft,rule,grow){
    const _cv=$(P+"-diagram"), W=_cv.width, H=_cv.height;
    const cx=W/2, cy=H/2+10;
    const r = d.radius||1, theta=(d.radians||0)*grow;
    const Rpx = Math.min(W,H)*0.34;             // fixed display radius; r shown via label
    // full circle (faint)
    ctx.strokeStyle=rule; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,Rpx,0,Math.PI*2); ctx.stroke();
    // axes
    ctx.beginPath(); ctx.moveTo(cx-Rpx-12,cy); ctx.lineTo(cx+Rpx+12,cy); ctx.moveTo(cx,cy-Rpx-12); ctx.lineTo(cx,cy+Rpx+12); ctx.stroke();
    const mode = d.mode;
    // sector fill
    if(mode==="sector"){
      ctx.fillStyle=(accent)+"33";
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,Rpx,0,-theta,true); ctx.closePath(); ctx.fill();
    }
    // two radii
    ctx.strokeStyle=ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Rpx,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(-theta)*Rpx, cy+Math.sin(-theta)*Rpx); ctx.stroke();
    // the arc (bold for arc mode, thinner for sector)
    ctx.strokeStyle=accent; ctx.lineWidth=(mode==="arc")?5:3;
    ctx.beginPath(); ctx.arc(cx,cy,Rpx,0,-theta,true); ctx.stroke();
    // radius label
    ctx.fillStyle=ink; ctx.font="13px "+(s.mono||"monospace"); ctx.textAlign="center";
    ctx.fillText("r = "+fmt(r), cx+Rpx/2, cy-8);
    // angle label near centre
    ctx.fillStyle=accent; ctx.font="bold 14px "+(s.sans||"sans-serif");
    const aLbl = (d.angle_unit==="rad") ? (fmt(d.radians)+" rad") : (fmt(d.angle_deg)+"\u00b0");
    ctx.fillText("θ = "+aLbl, cx+30, cy+ (theta>Math.PI?28:-22));
    // result label
    ctx.fillStyle=yes; ctx.font="bold 15px "+(s.sans||"sans-serif");
    const res = (mode==="arc") ? ("s = "+fmt(d.arc_length)) : ("A = "+fmt(d.sector_area));
    ctx.fillText(res, cx, cy+Rpx+30);
  }
  function drawArc(ctx,d,s,ink,accent,yes,soft,rule,grow){
    const _cv=$(P+"-diagram"), W=_cv.width, H=_cv.height;
    const cx=W/2, cy=H/2+10, R=120;
    const deg = (d.degrees!==undefined && d.degrees!==null)? d.degrees : 0;
    ctx.strokeStyle=rule; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-R-10,cy); ctx.lineTo(cx+R+10,cy); ctx.moveTo(cx,cy-R-10); ctx.lineTo(cx,cy+R+10); ctx.stroke();
    const a = (deg%360)*Math.PI/180 * grow;
    // sweep arc
    ctx.strokeStyle=accent; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(cx,cy,R,0,-a,true); ctx.stroke();
    // radius line to current angle
    ctx.strokeStyle=ink; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(-a)*R, cy+Math.sin(-a)*R); ctx.stroke();
    // labels
    ctx.fillStyle=ink; ctx.font="bold 15px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText(fmt(deg)+"\u00b0", cx, cy-R-20);
    ctx.fillStyle=accent; ctx.font="14px "+(s.mono||"monospace");
    ctx.fillText((d.radians!==undefined?fmt(d.radians):"")+" rad", cx, cy+R+28);
  }


  function drawFrame(ctx,t,d){ if(!d) return; const s=window.NCSkin||{};
    const cv=$(P+"-diagram"); ctx.clearRect(0,0,cv.width,cv.height);
    const ink=s.ink||"#222", accent=s.accent||"#b50", yes=s.yes||"#3a7", soft=s.inkSoft||"#777", rule=s.rule||"#ccc";
    const grow=(t<0.7? t/0.7:1);
    if((d.mode||"convert")==="convert") drawArc(ctx,d,s,ink,accent,yes,soft,rule,grow);
    else drawRT(ctx,d,s,ink,accent,yes,soft,rule,grow); }

  function applyMode(){
    const m = curMode();
    $("rd-convert-row").style.display = (m==="convert") ? "" : "none";
    $("rd-rt-wrap").style.display     = (m==="convert") ? "none" : "";
    syncUnitLabel();
  }
  function syncUnitLabel(){
    const el=$("rd-unit-lbl"); if(el) el.textContent = (unit()==="rad") ? "(rad)" : "(deg)";
  }

  ["rd-val","rd-dir","rd-radius","rd-angle"].forEach(id=>{ const el=$(id); if(el){ el.addEventListener("input",update); el.addEventListener("change",update);} });
  $("rd-mode").addEventListener("change", ()=>{ applyMode(); update(); });

  if(window.NCAngle){
    NCAngle.onChange(function(newUnit){
      // Convert the angle field value between units (arc/sector only).
      const el=$("rd-angle");
      if(el){ const v=parseFloat(el.value);
        if(!isNaN(v)){ el.value = (newUnit==="rad") ? +(v*Math.PI/180).toFixed(4) : +(v*180/Math.PI).toFixed(4); }
      }
      syncUnitLabel(); update();
    });
  }

  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawDiagram(last); });
  styleFields(); applyMode(); update();
})();
</script>
