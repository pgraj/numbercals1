<div class="viz-panel" data-slug="{{ calc.slug }}">

  <div class="viz-inputs" style="align-items:flex-start;gap:40px;flex-wrap:wrap">
    <label>
      <span style="display:block;white-space:nowrap">Law</span>
      <span class="nc-field" style="display:block">
        <select id="nl-law" style="width:230px">
          <option value="first">First law &mdash; inertia</option>
          <option value="second" selected>Second law &mdash; F = ma</option>
          <option value="third">Third law &mdash; action&ndash;reaction</option>
        </select>
      </span>
    </label>
    <label id="nl-l-solve">
      <span style="display:block;white-space:nowrap">Solve for</span>
      <span class="nc-field" style="display:block">
        <select id="nl-solve" style="width:150px">
          <option value="force" selected>Force</option>
          <option value="mass">Mass</option>
          <option value="acceleration">Acceleration</option>
        </select>
      </span>
    </label>
    <label id="nl-l-mass">
      <span style="display:block;white-space:nowrap">Mass m (kg)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="nl-mass" value="2" step="any" style="width:120px">
      </span>
    </label>
    <label id="nl-l-acc">
      <span style="display:block;white-space:nowrap">Acceleration a (m/s&sup2;)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="nl-acc" value="5" step="any" style="width:120px">
      </span>
    </label>
    <label id="nl-l-force" style="display:none">
      <span style="display:block;white-space:nowrap">Force F (N)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="nl-force" value="10" step="any" style="width:120px">
      </span>
    </label>
  </div>

  <canvas id="nl-canvas" width="640" height="320"
          style="display:block;width:100%;height:auto;max-width:560px;margin:8px auto 0"></canvas>
  <p class="viz-caption" id="nl-cap"
     style="font-size:.9rem;margin-top:.5rem;opacity:.85;text-align:center"></p>

  <div class="viz-out" id="viz-out" style="margin-top:10px"></div>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="nl-disc"
     style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<div class="nc-learn3" id="nl-learn3" role="group" aria-label="Answer detail"
     style="display:inline-flex;border-radius:8px;overflow:hidden;margin:12px 0 6px">
  <button type="button" data-mode="direct" class="active" aria-pressed="true">Direct answer</button>
  <button type="button" data-mode="steps" aria-pressed="false">Step-by-step working</button>
  <button type="button" data-mode="anim" aria-pressed="false">Animation</button>
</div>

<div id="nl-anim-controls" style="display:none;margin:2px 0 6px">
  <button type="button" id="nl-play" style="cursor:pointer;border-radius:6px;padding:4px 12px">&#9654; Play</button>
  <p id="nl-anim-note" style="font-size:.82rem;margin:6px 0 0;opacity:.8;max-width:560px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $("nl-canvas"), ctx = cv.getContext("2d");
  const SLUG = "{{ calc.slug }}";
  let last = null;

  function S(){ return window.NCSkin || {}; }
  function fmt(x){
    if(x===null||x===undefined||isNaN(x)) return "";
    if(Math.abs(x-Math.round(x))<1e-9) return String(Math.round(x));
    return (Math.round(x*10000)/10000).toString();
  }

  function styleFields(){
    const panel = document.querySelector('.viz-panel[data-slug="'+SLUG+'"]');
    if(!panel||!window.NCSkin) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const n=$("nl-anim-note"); if(n) n.style.color=NCSkin.inkSoft;
    const d=$("nl-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function curLaw(){ return $("nl-law").value; }

  function syncFields(){
    const law=curLaw();
    const second = (law==="second");
    // 2nd-law numeric inputs only for the second law
    $("nl-l-solve").style.display = second ? "" : "none";
    if(second){
      const sf=$("nl-solve").value;
      $("nl-l-mass").style.display  = (sf==="force"||sf==="acceleration") ? "" : "none";
      $("nl-l-acc").style.display   = (sf==="force"||sf==="mass") ? "" : "none";
      $("nl-l-force").style.display = (sf==="mass"||sf==="acceleration") ? "" : "none";
    } else {
      $("nl-l-mass").style.display="none";
      $("nl-l-acc").style.display="none";
      $("nl-l-force").style.display="none";
    }
  }

  async function update(){
    const law=curLaw();
    const body={ law:law };
    if(law==="second"){
      body.solve_for=$("nl-solve").value;
      body.mass=parseFloat($("nl-mass").value);
      body.acceleration=parseFloat($("nl-acc").value);
      body.force=parseFloat($("nl-force").value);
    }
    let data;
    try{
      const r=await fetch("/api/compute/"+SLUG,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      data=await r.json();
    }catch(e){ $("viz-out").textContent="compute error"; return; }
    try{ if(window.NCSteps) NCSteps.render(data.steps||[]); }catch(e){}
    if(data.disclaimer) $("nl-disc").textContent="\u26A0 "+data.disclaimer;
    if(data.error){
      $("viz-out").innerHTML="<b>"+data.error+"</b>";
      last=null; ctx.clearRect(0,0,cv.width,cv.height); return;
    }
    $("viz-out").innerHTML=`<div style="line-height:1.7"><b>${data.result}</b></div>`;
    try{ if(window.__ncExplain) __ncExplain(data.explanation); }catch(e){}
    last=data; draw(last, 1);
  }

  function box3(x,y,sz,fill,stroke){
    ctx.fillStyle=fill; ctx.strokeStyle=stroke; ctx.lineWidth=1.5;
    ctx.fillRect(x-sz/2,y-sz,sz,sz); ctx.strokeRect(x-sz/2,y-sz,sz,sz);
  }
  function arrow(x1,y1,x2,y2,col){
    ctx.strokeStyle=col; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    const a=Math.atan2(y2-y1,x2-x1);
    ctx.beginPath();
    ctx.moveTo(x2,y2);
    ctx.lineTo(x2-12*Math.cos(a-0.4),y2-12*Math.sin(a-0.4));
    ctx.lineTo(x2-12*Math.cos(a+0.4),y2-12*Math.sin(a+0.4));
    ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  }

  // draw(d, sweep): second law shows F=ma with the box accelerating; first/third conceptual.
  function draw(d, sweep){
    if(!window.NCSkin || !d){ ctx.clearRect(0,0,cv.width,cv.height); return; }
    if(typeof sweep!=="number") sweep=1;
    const sk=S();
    const W=cv.width,H=cv.height;
    const ink=sk.ink||"#222", soft=sk.inkSoft||"#888", acc=sk.accent||"#b34a23",
          yes=sk.yes||"#2f7a52", rule=sk.rule||"#ddd";
    ctx.clearRect(0,0,W,H);
    const baseY=H*0.58;
    const law=d.law||"second";

    // ground
    ctx.strokeStyle=rule; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(40,baseY+30); ctx.lineTo(W-40,baseY+30); ctx.stroke();

    if(law==="first"){
      // constant-velocity box gliding; no net force (two cancelling arrows)
      const x=80+ (W-200)*Math.max(0,Math.min(1,sweep));
      box3(x,baseY,40,sk.paper2||"#eee",ink);
      // equal/opposite arrows cancel
      arrow(x-20,baseY-20,x-70,baseY-20,soft);
      arrow(x+20,baseY-20,x+70,baseY-20,soft);
      ctx.fillStyle=acc; ctx.font="14px "+(sk.mono||"monospace"); ctx.textAlign="left";
      ctx.fillText("\u2211F = 0", 14, 24);
      ctx.fillStyle=ink; ctx.fillText("velocity constant", 14, 44);
      ctx.fillStyle=soft; ctx.textAlign="center";
      ctx.fillText("no net force \u2014 the body keeps its motion (inertia)", W/2, H-16);
      $("nl-cap").textContent="first law: with zero net force, motion does not change";
      return;
    }

    if(law==="third"){
      // two bodies pushing apart: equal & opposite
      const cx=W/2;
      const spread=20+30*Math.max(0,Math.min(1,sweep));
      box3(cx-spread-20,baseY,44,sk.paper2||"#eee",ink);
      box3(cx+spread+20,baseY,44,sk.paper2||"#eee",ink);
      // arrows pointing away from the contact midline
      arrow(cx-spread-20,baseY-22,cx-spread-90,baseY-22,acc);
      arrow(cx+spread+20,baseY-22,cx+spread+90,baseY-22,yes);
      ctx.fillStyle=acc; ctx.font="13px "+(sk.mono||"monospace"); ctx.textAlign="center";
      ctx.fillText("F (A on B)", cx-spread-55, baseY-30);
      ctx.fillStyle=yes;
      ctx.fillText("F (B on A)", cx+spread+55, baseY-30);
      ctx.fillStyle=ink; ctx.font="14px "+(sk.mono||"monospace"); ctx.textAlign="left";
      ctx.fillText("F(A\u2192B) = \u2212 F(B\u2192A)", 14, 24);
      ctx.fillStyle=soft; ctx.textAlign="center";
      ctx.fillText("equal in size, opposite in direction \u2014 on two different bodies", W/2, H-16);
      $("nl-cap").textContent="third law: forces act in equal and opposite pairs";
      return;
    }

    // second law: F = ma. Box accelerates left->right; force arrow scaled by F.
    const frac=Math.max(0,Math.min(1,sweep));
    // accelerated position: ease-in (x ~ t^2) to suggest acceleration
    const x=90 + (W-260)*(frac*frac);
    const m=(typeof d.mass==="number")?d.mass:1;
    const F=(typeof d.force==="number")?d.force:0;
    const a=(typeof d.acceleration==="number")?d.acceleration:0;
    const sz=Math.max(24,Math.min(56,20+m*6));
    box3(x,baseY,sz,sk.paper2||"#eee",ink);
    ctx.fillStyle=ink; ctx.font="13px "+(sk.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText(fmt(m)+" kg", x, baseY-sz/2+4);
    // force arrow
    const flen=Math.max(24,Math.min(150,Math.abs(F)*8));
    arrow(x+sz/2,baseY-sz/2,x+sz/2+flen,baseY-sz/2,acc);
    ctx.fillStyle=acc; ctx.textAlign="left";
    ctx.fillText("F = "+fmt(F)+" N", x+sz/2+8, baseY-sz/2-10);
    // acceleration indicator
    ctx.fillStyle=yes; ctx.textAlign="center";
    ctx.fillText("a = "+fmt(a)+" m/s\u00B2", x, baseY+22);

    // top-left readout
    ctx.fillStyle=acc; ctx.font="14px "+(sk.mono||"monospace"); ctx.textAlign="left";
    ctx.fillText("F = m a", 14, 24);
    ctx.fillStyle=ink;
    ctx.fillText("F = "+fmt(F)+" N", 14, 44);
    ctx.fillStyle=soft;
    ctx.fillText("m = "+fmt(m)+" kg, a = "+fmt(a)+" m/s\u00B2", 14, 62);

    $("nl-cap").textContent="second law: a net force produces acceleration F = m a";
  }

  let mode="direct", raf=null, playing=false, animStart=null;
  const DURATION=2800;
  function animNote(){
    const law=curLaw();
    if(law==="first") return "With no net force the body glides at constant velocity \u2014 "+
      "the two forces cancel, so nothing about its motion changes.";
    if(law==="third") return "The two bodies push on each other with equal and opposite forces. "+
      "Because the forces act on different bodies, they do not cancel.";
    return "A net force accelerates the mass: the box speeds up as it moves, faster for a larger "+
      "force or a smaller mass, following F = m a.";
  }

  function stepsPanel(){ return document.getElementById("nc-steps"); }
  function styleToggle(){
    if(!window.NCSkin) return;
    const seg=$("nl-learn3"); seg.style.border="1px solid "+NCSkin.rule;
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.classList.contains("active");
      b.style.cursor="pointer"; b.style.border="none"; b.style.padding="6px 14px";
      b.style.font="13px "+(NCSkin.sans||"sans-serif");
      b.style.background = on ? NCSkin.accent : (NCSkin.paper2||"transparent");
      b.style.color = on ? (NCSkin.paper||"#fff") : NCSkin.ink;
    });
    const pb=$("nl-play");
    if(pb){ pb.style.border="1px solid "+NCSkin.rule; pb.style.background=NCSkin.paper2||"transparent"; pb.style.color=NCSkin.ink; }
  }
  function stopPlay(){
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    playing=false; animStart=null;
    const pb=$("nl-play"); if(pb) pb.textContent="\u25B6 Play";
    if(last) draw(last,1);
  }
  function startPlay(){
    if(raf||!last) return; playing=true;
    const pb=$("nl-play"); if(pb) pb.textContent="\u23F8 Pause";
    function frame(ts){
      if(animStart===null) animStart=ts;
      let t=(ts-animStart)/DURATION; if(t>=1) t=1;
      draw(last,t);
      if(t<1){ raf=requestAnimationFrame(frame); }
      else { raf=null; playing=false; const b=$("nl-play"); if(b)b.textContent="\u25B6 Play"; }
    }
    raf=requestAnimationFrame(frame);
  }
  function togglePlay(){ if(playing) stopPlay(); else startPlay(); }

  function setMode(m){
    mode=m; stopPlay();
    const seg=$("nl-learn3");
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.getAttribute("data-mode")===m;
      b.classList.toggle("active",on); b.setAttribute("aria-pressed",String(on));
    });
    const sp=stepsPanel(), animCtl=$("nl-anim-controls");
    if(sp) sp.style.display=(m==="steps")?"":"none";
    if(m==="steps" && sp){ sp.hidden=false; sp.style.display="";
      const wbtn=document.getElementById("nc-steps-working"); if(wbtn) wbtn.click(); }
    animCtl.style.display=(m==="anim")?"":"none";
    if(m==="anim") $("nl-anim-note").textContent=animNote();
    draw(last,1); styleToggle();
  }

  $("nl-learn3").querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>setMode(b.getAttribute("data-mode")));
  });
  $("nl-play").addEventListener("click", togglePlay);

  $("nl-law").addEventListener("change", ()=>{ syncFields(); if(mode==="anim") setMode("anim"); update(); });
  $("nl-solve").addEventListener("change", ()=>{ syncFields(); if(mode==="anim") setMode("anim"); update(); });
  ["nl-mass","nl-acc","nl-force"].forEach(id=>{
    const el=$(id); if(el) el.addEventListener("input", ()=>{ if(mode==="anim") setMode("anim"); update(); });
  });

  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", styleToggle);
  window.addEventListener("nc-theme-change", ()=>{ if(last) draw(last,1); });

  syncFields(); styleFields();
  update().then(()=>{
    const innerToggle=document.querySelector("#nc-steps .nc-steps-toggle");
    if(innerToggle) innerToggle.style.display="none";
    setMode("direct");
  });
})();
</script>
