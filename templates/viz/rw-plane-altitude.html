<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>Ground distance (m)
      <span class="nc-field"><input id="pl-d" type="number" value="12000" step="any" min="1"></span></label>
    <label>Angle of elevation (°)
      <span class="nc-field"><input id="pl-a" type="number" value="7" step="any" min="1" max="89"></span></label>
    <label>Drag the angle
      <span class="nc-field"><input id="pl-range" type="range" value="7" min="2" max="80" step="1" style="width:200px"></span></label>
  </div>

  <div class="viz-out" id="pl-out"></div>

  <canvas id="pl-diagram" width="680" height="420"
          style="display:block;width:100%;height:auto;max-width:600px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="pl-cap" style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="pl-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const P = "pl";
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      if(el.type==="range") return;
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$(P+"-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function buildBody(){
    return { distance:$("pl-d").value, angle_deg:$("pl-a").value };
  }

  async function update(){
    const body = buildBody();
    let data;
    try { const r=await fetch("/api/compute/"+slug,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $(P+"-out").textContent="compute error"; return; }
    try { if(window.NCSteps) window.NCSteps.render(data.steps||[]); } catch(e){}
    if (data.disclaimer) $(P+"-disc").textContent="\u26a0 "+data.disclaimer;
    if (data.error){ $(P+"-out").innerHTML="<b>"+data.error+"</b>"; try{window.__ncExplain([]);}catch(e){} drawScene(null); last=null; mountLearn(null); return; }
    $(P+"-out").innerHTML = "<b>Altitude \u2248 "+data.result+" m</b>  \u00b7  slant range "+fmt(data.slant)+" m";
    try{ window.__ncExplain(data.explanation);}catch(e){}
    last=data; drawScene(data); mountLearn(data);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({ slug:slug, panel:panel, data:data, drawFrame:(data?drawFrame:undefined) });
  }
  function fmt(x){ if(x===null||x===undefined) return ""; return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*10000)/10000).toString(); }

  function drawScene(d){ drawAt(d,1); }
  function drawAt(d, sweep){
    const cv=$(P+"-diagram"); if(!cv) return; const ctx=cv.getContext("2d"); const s=window.NCSkin||{};
    const ink=s.ink||"#222", accent=s.accent||"#b5651d", yes=s.yes||"#3a7d44", soft=s.inkSoft||"#777", rule=s.rule||"#ccc";
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H); const cap=$(P+"-cap");
    if(!d){ if(cap) cap.textContent=""; return; }
    const dist=d.distance, ang=d.angle_deg, alt=d.altitude;
    const groundY=H-50, obsX=70, planeX=W-90, span=planeX-obsX, budget=groundY-50;
    const vscale=Math.min(budget/Math.max(alt,1), span/Math.max(dist,1));
    const planeY=groundY - alt*vscale;
    const planeYs=groundY - alt*sweep*vscale;
    // ground
    ctx.strokeStyle=soft; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(40,groundY); ctx.lineTo(W-40,groundY); ctx.stroke();
    // observer (radar dish)
    ctx.strokeStyle=ink; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(obsX,groundY); ctx.lineTo(obsX,groundY-18); ctx.stroke();
    ctx.beginPath(); ctx.arc(obsX,groundY-22,7,Math.PI,0); ctx.stroke();
    ctx.fillStyle=soft; ctx.font="12px "+(s.sans||"sans-serif"); ctx.textAlign="center"; ctx.fillText("radar", obsX, groundY+16);
    // base of plane (point under aircraft)
    ctx.strokeStyle=rule; ctx.setLineDash([4,4]); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(obsX,groundY); ctx.lineTo(planeX,groundY); ctx.stroke(); ctx.setLineDash([]);
    // altitude line
    ctx.strokeStyle=accent; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(planeX,groundY); ctx.lineTo(planeX,planeYs); ctx.stroke(); ctx.setLineDash([]);
    // slant (line of sight)
    ctx.strokeStyle=accent; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(obsX,groundY); ctx.lineTo(planeX,planeYs); ctx.stroke();
    // plane glyph (fuselage as a scaled circle, no ctx.ellipse dependency)
    ctx.fillStyle=ink;
    ctx.save(); ctx.translate(planeX,planeYs); ctx.scale(2.2,1); ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.moveTo(planeX-2,planeYs); ctx.lineTo(planeX-10,planeYs-7); ctx.lineTo(planeX+2,planeYs); ctx.fill();
    // angle arc
    ctx.strokeStyle=yes; ctx.lineWidth=2; const a1=-Math.atan2(groundY-planeYs, planeX-obsX);
    ctx.beginPath(); ctx.arc(obsX,groundY,34,0,a1,true); ctx.stroke();
    ctx.fillStyle=yes; ctx.font="bold 13px "+(s.mono||"monospace"); ctx.textAlign="left"; ctx.fillText(fmt(ang*sweep)+"\u00b0", obsX+40, groundY-12);
    // labels
    ctx.fillStyle=soft; ctx.font="12px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText("ground distance = "+fmt(dist)+" m", (obsX+planeX)/2, groundY+16);
    ctx.fillStyle=accent; ctx.save(); ctx.translate(planeX+16,(groundY+planeYs)/2); ctx.rotate(-Math.PI/2); ctx.textAlign="center"; ctx.fillText("alt "+fmt(alt*sweep)+" m",0,0); ctx.restore();
    ctx.fillStyle=ink; ctx.font="bold 14px "+(s.mono||"monospace"); ctx.textAlign="left"; ctx.fillText("altitude \u2248 "+fmt(alt)+" m", 16, 26);
    if(cap) cap.textContent="The aircraft sits at the top of a right triangle: ground distance (adjacent), altitude (opposite), elevation angle between them.";
  }

  function drawFrame(ctx,t,d){ if(!d) return; drawAt(d,(t<0.75? t/0.75 : 1)); }

  ["pl-d","pl-a"].forEach(id=>{ const el=$(id); el.addEventListener("input",update); el.addEventListener("change",update); });
  (function(){ const rng=$("pl-range"), num=$("pl-a"); rng.addEventListener("input",()=>{num.value=rng.value;update();}); num.addEventListener("input",()=>{const v=parseFloat(num.value);if(!isNaN(v)&&v>=2&&v<=80)rng.value=v;}); })();
  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawScene(last); });
  styleFields(); update();
})();
</script>
