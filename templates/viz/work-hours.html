<div class="viz-panel" data-slug="{{ calc.slug }}">

  <div class="viz-inputs" style="align-items:flex-start;gap:28px;flex-wrap:wrap">
    <label id="wh-l-start">
      <span style="display:block;white-space:nowrap">Start time (HH:MM)</span>
      <span class="nc-field" style="display:block">
        <input type="text" id="wh-start" value="09:00" step="any" style="width:120px">
      </span>
    </label>
    <label id="wh-l-end">
      <span style="display:block;white-space:nowrap">End time (HH:MM)</span>
      <span class="nc-field" style="display:block">
        <input type="text" id="wh-end" value="17:00" step="any" style="width:120px">
      </span>
    </label>
    <label id="wh-l-break_minutes">
      <span style="display:block;white-space:nowrap">Break (minutes)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="wh-break_minutes" value="30" step="any" style="width:120px">
      </span>
    </label>
  </div>

  <canvas id="wh-canvas" width="640" height="300"
          style="display:block;width:100%;height:auto;max-width:560px;margin:8px auto 0"></canvas>
  <p class="viz-caption" id="wh-cap" style="font-size:.9rem;margin-top:.5rem;opacity:.85;text-align:center"></p>

  <p class="viz-law" id="wh-law" style="font-size:.86rem;margin-top:.4rem;line-height:1.5;text-align:center"></p>

  <div class="viz-out" id="viz-out" style="margin-top:10px"></div>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="wh-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<div class="nc-learn3" id="wh-learn3" role="group" aria-label="Answer detail"
     style="display:inline-flex;border-radius:8px;overflow:hidden;margin:12px 0 6px">
  <button type="button" data-mode="direct" class="active" aria-pressed="true">Direct answer</button>
  <button type="button" data-mode="steps" aria-pressed="false">Step-by-step working</button>
  <button type="button" data-mode="anim" aria-pressed="false">Animation</button>
</div>

<div id="wh-anim-controls" style="display:none;margin:2px 0 6px">
  <button type="button" id="wh-play" style="cursor:pointer;border-radius:6px;padding:4px 12px">&#9654; Play</button>
  <p id="wh-anim-note" style="font-size:.82rem;margin:6px 0 0;opacity:.8;max-width:560px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $("wh-canvas"), ctx = cv.getContext("2d");
  const SLUG = "{{ calc.slug }}";
  let last = null;

  function S(){ return window.NCSkin || {}; }
  function fmt(x){
    if(x===null||x===undefined||isNaN(x)) return "";
    if(Math.abs(x)>=1e6 || (x!==0 && Math.abs(x)<1e-3)) return x.toPrecision(4);
    if(Math.abs(x-Math.round(x))<1e-9) return String(Math.round(x));
    return (Math.round(x*10000)/10000).toString();
  }

  function renderLaw(d){
    const el=$("wh-law"); if(!el) return;
    if(!d || !d.law_statement){ el.innerHTML=""; return; }
    const sk=window.NCSkin||{};
    let html='<b>What this means:</b> '+d.law_statement;
    if(d.law_source_url && d.law_source_name){
      html+=' <a href="'+d.law_source_url+'" target="_blank" rel="noopener">'+d.law_source_name+'</a>';
    }
    el.innerHTML=html;
    el.style.color=sk.inkSoft||"";
    el.querySelectorAll("b").forEach(b=>{ b.style.color=sk.ink||""; });
    el.querySelectorAll("a").forEach(a=>{ a.style.color=sk.accent||""; });
  }

  function styleFields(){
    const panel = document.querySelector('.viz-panel[data-slug="'+SLUG+'"]');
    if(!panel||!window.NCSkin) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const n=$("wh-anim-note"); if(n) n.style.color=NCSkin.inkSoft;
    const d=$("wh-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function syncFields(){}

  async function update(){
    const body={ start:$("wh-start").value, end:$("wh-end").value, break_minutes:parseFloat($("wh-break_minutes").value) };
    let data;
    try{
      const r=await fetch("/api/compute/"+SLUG,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      data=await r.json();
    }catch(e){ $("viz-out").textContent="compute error"; return; }
    try{ if(window.NCSteps) NCSteps.render(data.steps||[]); }catch(e){}
    if(data.disclaimer) $("wh-disc").textContent="\u26A0 "+data.disclaimer;
    renderLaw(data);
    if(data.error){
      $("viz-out").innerHTML="<b>"+data.error+"</b>";
      last=null; ctx.clearRect(0,0,cv.width,cv.height); return;
    }
    $("viz-out").innerHTML=`<div style="line-height:1.7"><b>${data.result}</b></div>`;
    try{ if(window.__ncExplain) __ncExplain(data.explanation); }catch(e){}
    last=data; draw(last, 1);
  }

  function draw(d, sweep){
    if(!window.NCSkin || !d){ ctx.clearRect(0,0,cv.width,cv.height); return; }
    if(typeof sweep!=="number") sweep=1;
    const sk=S();
    const W=cv.width,H=cv.height;
    const ink=sk.ink||"#222", soft=sk.inkSoft||"#888", acc=sk.accent||"#b34a23",
          yes=sk.yes||"#2f7a52", rule=sk.rule||"#ddd";
    ctx.clearRect(0,0,W,H);
    const frac=Math.max(0,Math.min(1,sweep));
    // simple framed result panel
    ctx.fillStyle=sk.paper2||"#eee"; ctx.strokeStyle=ink; ctx.lineWidth=1.5;
    const bx=W*0.5-200, by=H*0.5-50, bw=400, bh=100;
    ctx.fillRect(bx,by,bw,bh); ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle=acc; ctx.font="30px "+(sk.serif||"serif"); ctx.textAlign="center";
    ctx.fillText("\u23F1", W*0.5, by-14);
    ctx.fillStyle=ink; ctx.font="bold 17px "+(sk.sans||"sans-serif"); ctx.textAlign="center";
    const txt=(d.result||"");
    // wrap long result
    const words=txt.split(" "); let line="",yy=by+44;
    for(const w of words){ const test=line?line+" "+w:w; if(test.length>34){ ctx.fillText(line,W*0.5,yy); line=w; yy+=24; } else line=test; }
    if(line) ctx.fillText(line,W*0.5,yy);
    $("wh-cap").textContent="hours worked = (end \u2212 start) \u2212 break; overnight shifts add 24 h";

  }

  let mode="direct", raf=null, playing=false, animStart=null;
  const DURATION=1200;
  const ANIM_NOTE="The shift length minus your break gives the hours worked. A shift ending earlier on the clock than it starts has run past midnight.";

  function stepsPanel(){ return document.getElementById("nc-steps"); }
  function styleToggle(){
    if(!window.NCSkin) return;
    const seg=$("wh-learn3"); seg.style.border="1px solid "+NCSkin.rule;
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.classList.contains("active");
      b.style.cursor="pointer"; b.style.border="none"; b.style.padding="6px 14px";
      b.style.font="13px "+(NCSkin.sans||"sans-serif");
      b.style.background = on ? NCSkin.accent : (NCSkin.paper2||"transparent");
      b.style.color = on ? (NCSkin.paper||"#fff") : NCSkin.ink;
    });
    const pb=$("wh-play");
    if(pb){ pb.style.border="1px solid "+NCSkin.rule; pb.style.background=NCSkin.paper2||"transparent"; pb.style.color=NCSkin.ink; }
  }
  function stopPlay(){
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    playing=false; animStart=null;
    const pb=$("wh-play"); if(pb) pb.textContent="\u25B6 Play";
    if(last) draw(last,1);
  }
  function startPlay(){
    if(raf||!last) return; playing=true;
    const pb=$("wh-play"); if(pb) pb.textContent="\u23F8 Pause";
    function frame(ts){
      if(animStart===null) animStart=ts;
      let t=(ts-animStart)/DURATION; if(t>=1) t=1;
      draw(last,t);
      if(t<1){ raf=requestAnimationFrame(frame); }
      else { raf=null; playing=false; const b=$("wh-play"); if(b)b.textContent="\u25B6 Play"; }
    }
    raf=requestAnimationFrame(frame);
  }
  function togglePlay(){ if(playing) stopPlay(); else startPlay(); }

  function setMode(m){
    mode=m; stopPlay();
    const seg=$("wh-learn3");
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.getAttribute("data-mode")===m;
      b.classList.toggle("active",on); b.setAttribute("aria-pressed",String(on));
    });
    const sp=stepsPanel(), animCtl=$("wh-anim-controls");
    if(sp) sp.style.display=(m==="steps")?"":"none";
    if(m==="steps" && sp){ sp.hidden=false; sp.style.display="";
      const wbtn=document.getElementById("nc-steps-working"); if(wbtn) wbtn.click(); }
    animCtl.style.display=(m==="anim")?"":"none";
    if(m==="anim") $("wh-anim-note").textContent=ANIM_NOTE;
    draw(last,1); styleToggle();
  }

  $("wh-learn3").querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>setMode(b.getAttribute("data-mode")));
  });
  $("wh-play").addEventListener("click", togglePlay);

  ["wh-start","wh-end","wh-break_minutes"].forEach(id=>{ const el=$(id); if(el) el.addEventListener("input", ()=>{ if(mode==="anim") setMode("anim"); update(); }); });

  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", styleToggle);
  window.addEventListener("nc-theme-change", ()=>{ if(last) renderLaw(last); });
  window.addEventListener("nc-theme-change", ()=>{ if(last) draw(last,1); });


  styleFields();
  update().then(()=>{
    const innerToggle=document.querySelector("#nc-steps .nc-steps-toggle");
    if(innerToggle) innerToggle.style.display="none";
    setMode("direct");
  });
})();
</script>
