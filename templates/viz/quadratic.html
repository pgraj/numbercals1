{# Quadratic parabola. Marks real roots (x-axis crossings) and the vertex.
   Also feeds the step-by-step panel via window.NCSteps.render(data.steps). #}
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>a<input id="in-a" type="number" value="1" step="0.5"></label>
    <label>b<input id="in-b" type="number" value="-3" step="0.5"></label>
    <label>c<input id="in-c" type="number" value="2" step="0.5"></label>
  </div>
  <div class="viz-out" id="viz-out"></div>
  <canvas id="quad-chart" width="640" height="380" style="margin-top:14px;max-width:100%"></canvas>
  <p class="viz-caption" id="quad-caption" style="font-size:.9rem;line-height:1.5;margin-top:.5rem;opacity:.85"></p>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $("quad-chart"), ctx = cv.getContext("2d");

  async function update(){
    const body = { a:+$("in-a").value, b:+$("in-b").value, c:+$("in-c").value };
    let data;
    try {
      const r = await fetch("/api/compute/{{ calc.slug }}", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(body)});
      data = await r.json();
    } catch(e){ $("viz-out").textContent = "compute error"; return; }

    // feed the step-by-step panel (no-op if NCSteps absent)
    if (window.NCSteps) window.NCSteps.render(data.steps || []);

    if (data.error){
      $("viz-out").innerHTML = "<b>"+data.error+"</b>";
      $("quad-caption").textContent=""; ctx.clearRect(0,0,cv.width,cv.height);
      return;
    }
    $("viz-out").innerHTML = `Roots: <b>${data.root1}</b>, <b>${data.root2}</b> &nbsp;(${data.nature})`;
    $("quad-caption").innerHTML =
      `The curve is a parabola. Its real roots are where it crosses the x-axis; ` +
      `the lowest/highest point is the vertex at (${data.vertex.x}, ${data.vertex.y}). ` +
      `When the discriminant is negative the curve never touches the x-axis, so the ` +
      `roots are complex.`;
    draw(data);
  }

  function draw(d){
    ctx.clearRect(0,0,cv.width,cv.height);
    const pad=44, W=cv.width-2*pad, H=cv.height-2*pad;
    const pts=d.series; if(!pts||!pts.length) return;
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    const xMin=Math.min(...xs), xMax=Math.max(...xs);
    let yMin=Math.min(...ys,0), yMax=Math.max(...ys,0);
    if(yMin===yMax){ yMin-=1; yMax+=1; }
    const X=x=>pad+((x-xMin)/(xMax-xMin))*W;
    const Y=y=>pad+H-((y-yMin)/(yMax-yMin))*H;

    // axes
    ctx.strokeStyle=NCSkin.rule; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad,Y(0)); ctx.lineTo(pad+W,Y(0)); ctx.stroke();
    if(xMin<0 && xMax>0){ ctx.beginPath(); ctx.moveTo(X(0),pad); ctx.lineTo(X(0),pad+H); ctx.stroke(); }

    // parabola
    ctx.strokeStyle=NCSkin.accent; ctx.lineWidth=2.5; ctx.beginPath();
    pts.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));
    ctx.stroke();

    // real roots on the x-axis (only when numeric)
    [d.root1, d.root2].forEach(r=>{
      if(typeof r === "number"){
        ctx.fillStyle=NCSkin.yes;
        ctx.beginPath(); ctx.arc(X(r),Y(0),6,0,2*Math.PI); ctx.fill();
        ctx.fillStyle=NCSkin.ink; ctx.font="12px "+(NCSkin.mono||"monospace");
        ctx.fillText("x="+r, X(r)+8, Y(0)-8);
      }
    });

    // vertex
    if(d.vertex){
      ctx.fillStyle=NCSkin.inkSoft;
      ctx.beginPath(); ctx.arc(X(d.vertex.x),Y(d.vertex.y),4,0,2*Math.PI); ctx.fill();
      ctx.fillText("vertex", X(d.vertex.x)+8, Y(d.vertex.y)+4);
    }
  }

  ["in-a","in-b","in-c"].forEach(id=>$(id).addEventListener("input", update));
  window.addEventListener("nc-theme-change", update);
  update();
})();
</script>
