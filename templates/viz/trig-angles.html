<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>Angle (degrees)
      <span class="nc-field"><input id="ta-deg" type="number" value="135" step="any" min="0" max="360"></span>
    </label>
    <label>Drag
      <span class="nc-field"><input id="ta-range" type="range" value="135" min="0" max="360" step="1" style="width:180px"></span>
    </label>
  </div>

  <div class="viz-out" id="ta-out"></div>

  <canvas id="ta-diagram" width="640" height="320"
          style="display:block;width:100%;height:auto;max-width:520px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="ta-cap" style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="ta-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      if(el.type==="range") return;
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$("ta-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  async function update(){
    const body = { angle_deg: $("ta-deg").value };
    let data;
    try { const r=await fetch("/api/compute/"+slug,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $("ta-out").textContent="compute error"; return; }
    try { if(window.NCSteps) window.NCSteps.render(data.steps||[]); } catch(e){}
    if (data.disclaimer) $("ta-disc").textContent="⚠ "+data.disclaimer;
    if (data.error){ $("ta-out").innerHTML="<b>"+data.error+"</b>"; window.__ncExplain([]); drawDial(null); last=null; mountLearn(null); return; }
    $("ta-out").innerHTML="<b>"+data.result+"</b>";
    window.__ncExplain(data.explanation);
    last=data; drawDial(data); mountLearn(data);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({ slug:slug, panel:panel, data:data, drawFrame:(data?drawFrame:undefined) });
  }

  function colorFor(kind, s){
    if(kind==="right") return s.yes||"#3a7d44";
    if(kind==="acute") return s.accent||"#b5651d";
    if(kind==="obtuse"||kind==="straight") return s.accent||"#b5651d";
    return s.inkSoft||"#777"; // reflex etc.
  }

  function drawDial(d){
    drawDialAt(d, d? d.angle : 0);
  }
  function drawDialAt(d, ang){
    const cv=$("ta-diagram"); if(!cv) return;
    const ctx=cv.getContext("2d"); const s=window.NCSkin||{};
    const ink=s.ink||"#222", soft=s.inkSoft||"#777", rule=s.rule||"#ccc";
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
    const cap=$("ta-cap");
    const cx=W/2, cy=H/2+20, R=120;
    // protractor circle + ticks
    ctx.strokeStyle=rule; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle=soft; ctx.font="10px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    for(let a=0;a<360;a+=30){
      const rad=-a*Math.PI/180; const x1=cx+Math.cos(rad)*R, y1=cy+Math.sin(rad)*R;
      const x2=cx+Math.cos(rad)*(R-7), y2=cy+Math.sin(rad)*(R-7);
      ctx.strokeStyle=rule; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      const lx=cx+Math.cos(rad)*(R+13), ly=cy+Math.sin(rad)*(R+13);
      ctx.fillText(a+"°", lx, ly+3);
    }
    if(!d){ if(cap) cap.textContent=""; return; }
    const kind=d.kind, col=colorFor(kind,s);
    // baseline (0°) ray
    ctx.strokeStyle=ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R,cy); ctx.stroke();
    // swept arc
    ctx.strokeStyle=col; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(cx,cy,38,0,-ang*Math.PI/180,true); ctx.stroke();
    // moving ray
    const rad=-ang*Math.PI/180;
    ctx.strokeStyle=col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(rad)*R, cy+Math.sin(rad)*R); ctx.stroke();
    // labels
    ctx.fillStyle=ink; ctx.font="bold 16px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText(fmt(ang)+"°", cx, cy-R-22);
    ctx.fillStyle=col; ctx.font="14px "+(s.sans||"sans-serif");
    ctx.fillText(kind.toUpperCase(), cx, cy+R+34);
    if(cap) cap.textContent="The dial sweeps from 0° (right) anticlockwise to your angle; the type updates live.";
  }

  /* Animation: sweep from 0 to the entered angle and back. */
  function drawFrame(ctx, t, d){
    if(!d) return;
    // ping-pong 0..angle..0
    const phase = t < 0.5 ? (t/0.5) : (1-(t-0.5)/0.5);
    drawDialAt(d, d.angle * phase);
  }

  function fmt(x){ return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*100)/100).toString(); }

  function syncFromDeg(){ $("ta-range").value = Math.max(0,Math.min(360, Math.round(+$("ta-deg").value||0))); }
  function syncFromRange(){ $("ta-deg").value = $("ta-range").value; }

  $("ta-deg").addEventListener("input", ()=>{ syncFromDeg(); update(); });
  $("ta-range").addEventListener("input", ()=>{ syncFromRange(); update(); });
  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawDial(last); });
  styleFields(); syncFromDeg(); update();
})();
</script>
