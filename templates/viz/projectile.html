{# Custom interactive viz for projectile motion. #}
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>Velocity v (m/s)<input id="in-v" type="number" value="25" step="1"></label>
    <label>Angle θ (deg)<input id="in-theta" type="number" value="45" step="1"></label>
    <label>Gravity g (m/s²)<input id="in-g" type="number" value="9.81" step="0.01"></label>
  </div>
  <div class="viz-out" id="viz-out"></div>
  <canvas id="traj" width="640" height="320" style="margin-top:14px"></canvas>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const cv=$("traj"), ctx=cv.getContext("2d");
  async function update(){
    const v=+$("in-v").value, theta=+$("in-theta").value, g=+$("in-g").value;
    let data;
    try{
      const r=await fetch("/api/compute/{{ calc.slug }}",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({v:v,theta_deg:theta,g:g})});
      data=await r.json();
      if (window.NCSteps) window.NCSteps.render(data.steps || []);
    }catch(e){ $("viz-out").textContent="compute error"; return; }
    $("viz-out").innerHTML=
      `Range <b>${data.range.toFixed(2)} m</b> · `+
      `Peak height <b>${data.height.toFixed(2)} m</b> · `+
      `Flight time <b>${data.time.toFixed(2)} s</b>`;
    draw(v,theta*Math.PI/180,g,data.range,data.height);
  }
  function draw(v,th,g,range,hmax){
    ctx.clearRect(0,0,cv.width,cv.height);
    const padL=40,padB=30,W=cv.width-padL-10,H=cv.height-padB-10;
    const sx=W/(range||1), sy=H/(hmax||1);
    const s=Math.min(sx,sy*1.0);
    ctx.strokeStyle=NCSkin.rule; ctx.beginPath();
    ctx.moveTo(padL,cv.height-padB); ctx.lineTo(cv.width-10,cv.height-padB);
    ctx.moveTo(padL,cv.height-padB); ctx.lineTo(padL,10); ctx.stroke();
    ctx.strokeStyle=NCSkin.accent; ctx.lineWidth=2; ctx.beginPath();
    const T=2*v*Math.sin(th)/g;
    for(let i=0;i<=120;i++){
      const t=T*i/120, x=v*Math.cos(th)*t, y=v*Math.sin(th)*t-0.5*g*t*t;
      const px=padL+x*s, py=(cv.height-padB)-y*s;
      i?ctx.lineTo(px,py):ctx.moveTo(px,py);
    }
    ctx.stroke();
  }
  ["in-v","in-theta","in-g"].forEach(id=>$(id).addEventListener("input",update));
  window.addEventListener("nc-theme-change", update);
  update();
})();
</script>
