<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>Horizontal travel (m)
      <span class="nc-field"><input id="bt-h" type="number" value="3" step="any" min="0.1"></span></label>
    <label>Vertical drop (m)
      <span class="nc-field"><input id="bt-v" type="number" value="1.2" step="any" min="0.1"></span></label>
    <label>Drag the drop
      <span class="nc-field"><input id="bt-range" type="range" value="1.2" min="0.1" max="6" step="0.1" style="width:200px"></span></label>
  </div>

  <div class="viz-out" id="bt-out"></div>

  <canvas id="bt-diagram" width="680" height="420"
          style="display:block;width:100%;height:auto;max-width:600px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="bt-cap" style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="bt-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const P = "bt";
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      if(el.type==="range") return;
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$(P+"-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function buildBody(){
    return { horizontal:$("bt-h").value, vertical_drop:$("bt-v").value };
  }

  async function update(){
    const body = buildBody();
    let data;
    try { const r=await fetch("/api/compute/"+slug,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $(P+"-out").textContent="compute error"; return; }
    try { if(window.NCSteps) window.NCSteps.render(data.steps||[]); } catch(e){}
    if (data.disclaimer) $(P+"-disc").textContent="\u26a0 "+data.disclaimer;
    if (data.error){ $(P+"-out").innerHTML="<b>"+data.error+"</b>"; try{window.__ncExplain([]);}catch(e){} drawScene(null); last=null; mountLearn(null); return; }
    $(P+"-out").innerHTML = "<b>Impact angle \u2248 "+data.result+"\u00b0</b>  \u00b7  path "+fmt(data.path_length)+" m";
    try{ window.__ncExplain(data.explanation);}catch(e){}
    last=data; drawScene(data); mountLearn(data);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({ slug:slug, panel:panel, data:data, drawFrame:(data?drawFrame:undefined) });
  }
  function fmt(x){ if(x===null||x===undefined) return ""; return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*10000)/10000).toString(); }

  function drawScene(d){ drawAt(d,1); }
  function drawAt(d, sweep){
    const cv=$(P+"-diagram"); if(!cv) return; const ctx=cv.getContext("2d"); const s=window.NCSkin||{};
    const ink=s.ink||"#222", accent=s.accent||"#b5651d", yes=s.yes||"#3a7d44", soft=s.inkSoft||"#777", rule=s.rule||"#ccc";
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H); const cap=$(P+"-cap");
    if(!d){ if(cap) cap.textContent=""; return; }
    const hor=d.horizontal, drop=d.vertical_drop, ang=d.impact_angle, path=d.path_length;
    // entry top-left, impact bottom-right; fit the right triangle
    const m=70, x0=m, y0=70, budget=H-y0-70, span=W-2*m;
    const sc=Math.min(span/Math.max(hor,1), budget/Math.max(drop,1));
    const ex=x0, ey=y0;                       // entry (start)
    const ix=x0+hor*sc, iy=y0+drop*sc;        // impact
    // floor / surface at impact level
    ctx.strokeStyle=soft; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(40,iy); ctx.lineTo(W-40,iy); ctx.stroke();
    // horizontal travel line (reference)
    ctx.strokeStyle=rule; ctx.setLineDash([4,4]); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ix,ey); ctx.stroke(); ctx.setLineDash([]);
    // vertical drop
    ctx.strokeStyle=yes; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(ix,ey); ctx.lineTo(ix,iy); ctx.stroke(); ctx.setLineDash([]);
    // trajectory (sweeps from entry toward impact)
    const tx=ex+(ix-ex)*sweep, ty=ey+(iy-ey)*sweep;
    ctx.strokeStyle=accent; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(tx,ty); ctx.stroke();
    // projectile head
    ctx.fillStyle=ink; ctx.beginPath(); ctx.arc(tx,ty,5,0,Math.PI*2); ctx.fill();
    // entry marker
    ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(ex,ey,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=soft; ctx.font="12px "+(s.sans||"sans-serif"); ctx.textAlign="left"; ctx.fillText("entry", ex+6, ey-6);
    ctx.textAlign="right"; ctx.fillText("impact", ix-6, iy-6);
    // impact angle arc (at impact, between trajectory and floor)
    ctx.strokeStyle=accent; ctx.lineWidth=2; const aa=Math.atan2(ey-iy, ex-ix), bb=Math.PI;
    ctx.beginPath(); ctx.arc(ix,iy,26, Math.PI, aa, true); ctx.stroke();
    ctx.fillStyle=accent; ctx.font="bold 13px "+(s.mono||"monospace"); ctx.textAlign="right"; ctx.fillText(fmt(ang)+"\u00b0", ix-30, iy-8);
    // labels
    ctx.fillStyle=soft; ctx.font="12px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText("horizontal "+fmt(hor)+" m", (ex+ix)/2, ey-8);
    ctx.fillStyle=yes; ctx.save(); ctx.translate(ix+14,(ey+iy)/2); ctx.rotate(-Math.PI/2); ctx.fillText("drop "+fmt(drop)+" m",0,0); ctx.restore();
    ctx.fillStyle=ink; ctx.font="bold 14px "+(s.mono||"monospace"); ctx.textAlign="left"; ctx.fillText("impact angle \u2248 "+fmt(ang)+"\u00b0", 16, 26);
    if(cap) cap.textContent="From two marks, the drop (opposite) and horizontal travel (adjacent) give the impact angle via inverse tangent.";
  }

  function drawFrame(ctx,t,d){ if(!d) return; drawAt(d,(t<0.75? t/0.75 : 1)); }

  ["bt-h","bt-v"].forEach(id=>{ const el=$(id); el.addEventListener("input",update); el.addEventListener("change",update); });
  (function(){ const rng=$("bt-range"), num=$("bt-v"); rng.addEventListener("input",()=>{num.value=rng.value;update();}); num.addEventListener("input",()=>{const v=parseFloat(num.value);if(!isNaN(v)&&v>=0.1&&v<=6)rng.value=v;}); })();
  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawScene(last); });
  styleFields(); update();
})();
</script>
