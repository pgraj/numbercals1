<div class="viz-panel" data-slug="{{ calc.slug }}">

  <div style="margin-bottom:10px">{% include "_angle_unit.html" %}</div>

  <div class="viz-inputs" style="align-items:flex-start;gap:36px">
    <label><span style="display:block;white-space:nowrap">Mode</span>
      <span class="nc-field" style="display:block"><select id="cx-mode">
        <option value="to_rect" selected>Polar → rectangular</option>
        <option value="to_polar">Rectangular → polar</option></select></span></label>
    <span id="cx-pol-row" style="display:contents">
      <label><span style="display:block;white-space:nowrap">r</span><span class="nc-field" style="display:block"><input id="cx-r" type="number" value="5" step="any"></span></label>
      <label><span style="display:block;white-space:nowrap">θ <span class="cx-au" style="opacity:.7">(deg)</span></span><span class="nc-field" style="display:block"><input id="cx-theta" type="number" value="53.13" step="any"></span></label>
    </span>
    <span id="cx-rect-row" style="display:none">
      <label><span style="display:block;white-space:nowrap">x</span><span class="nc-field" style="display:block"><input id="cx-x" type="number" value="3" step="any"></span></label>
      <label><span style="display:block;white-space:nowrap">y</span><span class="nc-field" style="display:block"><input id="cx-y" type="number" value="4" step="any"></span></label>
    </span>
  </div>

  <canvas id="cx-canvas" width="640" height="400"
          style="display:block;width:100%;height:auto;max-width:560px;margin:8px auto 0"></canvas>
  <p class="viz-caption" id="cx-cap" style="font-size:.9rem;margin-top:.5rem;opacity:.85;text-align:center"></p>

  <div class="viz-out" id="viz-out" style="margin-top:10px"></div>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="cx-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<div class="nc-learn3" id="cx-learn3" role="group" aria-label="Answer detail"
     style="display:inline-flex;border-radius:8px;overflow:hidden;margin:12px 0 6px">
  <button type="button" data-mode="direct" class="active" aria-pressed="true">Direct answer</button>
  <button type="button" data-mode="steps" aria-pressed="false">Step-by-step working</button>
  <button type="button" data-mode="anim" aria-pressed="false">Animation</button>
</div>

<div id="cx-anim-controls" style="display:none;margin:2px 0 6px">
  <button type="button" id="cx-play" style="cursor:pointer;border-radius:6px;padding:4px 12px">&#9654; Play</button>
  <p id="cx-anim-note" style="font-size:.82rem;margin:6px 0 0;opacity:.8;max-width:560px"></p>
</div>

<script src="/static/ncangle.js"></script>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $("cx-canvas"), ctx = cv.getContext("2d");
  const SLUG = "{{ calc.slug }}";
  let last = null;
  function unit(){ return (window.NCAngle ? NCAngle.current() : "deg"); }
  function S(){ return window.NCSkin || {}; }
  function fmt(x){ if(x===null||x===undefined) return ""; return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*10000)/10000).toString(); }
  function angLbl(deg){ return (unit()==="rad") ? (fmt(deg*Math.PI/180)+" rad") : (fmt(deg)+"°"); }


  function initInputs(){ showRows(); syncU(); }
  function syncU(){ document.querySelectorAll(".cx-au").forEach(e=>e.textContent=unit()==="rad"?"(rad)":"(deg)"); }
  function showRows(){ const m=$("cx-mode").value; $("cx-pol-row").style.display=m==="to_rect"?"contents":"none"; $("cx-rect-row").style.display=m==="to_polar"?"contents":"none"; }
  function onUnitChange(){ const e=$("cx-theta"); if(e){const v=parseFloat(e.value); if(!isNaN(v)){ e.value=(unit()==="rad")?+(v*Math.PI/180).toFixed(4):+(v*180/Math.PI).toFixed(4);}} syncU(); }
  function buildBody(){ return { mode:$("cx-mode").value, angle_unit:unit(), r:$("cx-r").value, theta:$("cx-theta").value, x:$("cx-x").value, y:$("cx-y").value }; }
  function wireInputs(u){ ["cx-mode","cx-r","cx-theta","cx-x","cx-y"].forEach(id=>{ const e=$(id); if(e){e.addEventListener("input",u);e.addEventListener("change",u);} }); $("cx-mode").addEventListener("change",showRows); }
  function renderOut(d){ $("viz-out").innerHTML=`<div style="line-height:1.7"><b>${d.result}</b></div>`; }
  function draw(d,t){ if(!d){ctx.clearRect(0,0,cv.width,cv.height);return;} const sk=S();
    const W=cv.width,H=cv.height,cx=W/2,cyc=H/2+6; ctx.clearRect(0,0,W,H);
    const ink=(S().ink||'#222'),acc=(S().accent||'#b34a23'),yes=(S().yes||'#2f7a52'),soft=(S().inkSoft||'#888'),rule=(S().rule||'#ddd');
    const rr=d.r||Math.hypot(d.x,d.y); const maxR=Math.max(rr,1)*1.2; const R=Math.min(W,H)*0.34; const sc=R/maxR;
    for(let k=1;k<=3;k++){ ctx.strokeStyle=rule; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cyc,R*k/3,0,Math.PI*2); ctx.stroke(); }
    for(let dg=0;dg<360;dg+=30){ const a=dg*Math.PI/180; ctx.strokeStyle=rule; ctx.beginPath(); ctx.moveTo(cx,cyc); ctx.lineTo(cx+R*Math.cos(a),cyc-R*Math.sin(a)); ctx.stroke(); }
    ctx.strokeStyle=soft; ctx.beginPath(); ctx.moveTo(cx-R-8,cyc);ctx.lineTo(cx+R+8,cyc);ctx.moveTo(cx,cyc-R-8);ctx.lineTo(cx,cyc+R+8); ctx.stroke();
    const ang=(d.theta_deg||0)*Math.PI/180; const g=(t!==undefined?t:1);
    const PXf=cx+rr*sc*Math.cos(ang), PYf=cyc-rr*sc*Math.sin(ang);
    if(d.mode==="to_polar"){
      // RECT -> POLAR: build x leg then y leg (animate), then resultant
      const x=d.x, y=d.y; const ex=cx+x*sc, ey=cyc;
      const gx2 = (t!==undefined? t*2:2);
      // x-component leg (horizontal)
      ctx.strokeStyle=yes; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx,cyc); ctx.lineTo(cx+x*sc*Math.min(1,gx2),cyc); ctx.stroke();
      if(gx2>=1){ ctx.strokeStyle=yes; ctx.beginPath(); ctx.moveTo(ex,cyc); ctx.lineTo(ex,cyc-y*sc*Math.min(1,gx2-1)); ctx.stroke(); }
      ctx.fillStyle=yes; ctx.font="12px "+(S().mono||'monospace'); ctx.textAlign="center"; ctx.fillText("x="+fmt(x), (cx+ex)/2, cyc+16);
      ctx.textAlign="left"; ctx.fillText("y="+fmt(y), ex+6, (cyc+PYf)/2);
      // resultant
      if(gx2>=2){ ctx.strokeStyle=acc; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(cx,cyc); ctx.lineTo(PXf,PYf); ctx.stroke();
        ctx.strokeStyle=acc; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(cx,cyc,26,0,-ang,true); ctx.stroke(); }
    } else {
      // POLAR -> RECT: grow the r-ray, then drop x,y component legs (dashed)
      const PX=cx+(rr*g)*sc*Math.cos(ang), PY=cyc-(rr*g)*sc*Math.sin(ang);
      ctx.strokeStyle=acc; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(cx,cyc); ctx.lineTo(PX,PY); ctx.stroke();
      ctx.strokeStyle=acc; ctx.lineWidth=1.3; ctx.beginPath(); ctx.arc(cx,cyc,26,0,-ang*g,true); ctx.stroke();
      if(g>=1){ ctx.strokeStyle=yes; ctx.setLineDash([4,3]); ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(PXf,PYf); ctx.lineTo(PXf,cyc); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(PXf,cyc); ctx.lineTo(cx,cyc); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle=yes; ctx.font="12px "+(S().mono||'monospace'); ctx.textAlign="center"; ctx.fillText("x="+fmt(d.x),(cx+PXf)/2,cyc+16);
        ctx.textAlign="left"; ctx.fillText("y="+fmt(d.y), PXf+6,(cyc+PYf)/2); }
    }
    // the point + its coordinates labelled ON the grid
    ctx.fillStyle=yes; ctx.beginPath(); ctx.arc(PXf,PYf,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=ink; ctx.font="12px "+(S().mono||'monospace'); ctx.textAlign=PXf>=cx?"left":"right";
    ctx.fillText("("+fmt(d.x)+", "+fmt(d.y)+")", PXf+(PXf>=cx?8:-8), PYf-8);
    ctx.fillText("r="+fmt(rr)+" ∠"+angLbl(d.theta_deg), PXf+(PXf>=cx?8:-8), PYf+12);
    ctx.textAlign="left"; ctx.fillStyle=ink; ctx.font="bold 12px "+(S().mono||'monospace');
    ctx.fillText((d.mode==="to_polar"?"(x,y) → (r,θ)":"(r,θ) → (x,y)"), 12, 18);
    $("cx-cap").textContent=(d.mode==="to_polar")?"Rectangular → polar: the x and y legs build first, then the resultant r-ray and angle.":"Polar → rectangular: the r-ray sweeps out, then drops to its x and y components.";
  }


  function styleFields(){
    const panel=document.querySelector('.viz-panel[data-slug="'+SLUG+'"]');
    if(!panel||!window.NCSkin) return;
    const bg=NCSkin.paper2||"transparent";
    panel.querySelectorAll("input, select").forEach(el=>{ el.style.background=bg; el.style.color=NCSkin.ink; el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px"; });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const n=$("cx-anim-note"); if(n) n.style.color=NCSkin.inkSoft;
    const d=$("cx-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  async function update(){
    const body = buildBody();
    let data;
    try{ const r=await fetch("/api/compute/"+SLUG,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $("viz-out").textContent="compute error"; return; }
    try{ if(window.NCSteps) NCSteps.render(data.steps||[]); }catch(e){}
    if(data.disclaimer) $("cx-disc").textContent="⚠ "+data.disclaimer;
    if(data.error){ $("viz-out").innerHTML="<b>"+data.error+"</b>"; try{window.__ncExplain([]);}catch(e){} last=null; draw(null); return; }
    renderOut(data);
    try{ if(window.__ncExplain) __ncExplain(data.explanation); }catch(e){}
    last=data; draw(last);
  }

  let mode="direct", raf=null, playing=false, animStart=null;
  const DURATION=4200;
  const ANIM_NOTE="In trigonometry a positive angle is measured anticlockwise from the positive x-axis (the initial side), so rotation runs anticlockwise as the angle grows. A clockwise turn would be a negative angle.";
  function stepsPanel(){ return document.getElementById("nc-steps"); }
  function styleToggle(){
    if(!window.NCSkin) return;
    const seg=$("cx-learn3"); seg.style.border="1px solid "+NCSkin.rule;
    seg.querySelectorAll("button").forEach(b=>{ const on=b.classList.contains("active");
      b.style.cursor="pointer"; b.style.border="none"; b.style.padding="6px 14px"; b.style.font="13px "+(NCSkin.sans||"sans-serif");
      b.style.background=on?NCSkin.accent:(NCSkin.paper2||"transparent"); b.style.color=on?(NCSkin.paper||"#fff"):NCSkin.ink; });
    const pb=$("cx-play"); if(pb){ pb.style.border="1px solid "+NCSkin.rule; pb.style.background=NCSkin.paper2||"transparent"; pb.style.color=NCSkin.ink; }
  }
  function stopPlay(){ if(raf){cancelAnimationFrame(raf);raf=null;} playing=false; animStart=null; const pb=$("cx-play"); if(pb)pb.innerHTML="&#9654; Play"; if(last) draw(last); }
  function startPlay(){
    if(raf||!last) return; playing=true; const pb=$("cx-play"); if(pb)pb.innerHTML="&#10073;&#10073; Pause";
    function frame(ts){ if(animStart===null)animStart=ts; let t=(ts-animStart)/DURATION; if(t>=1)t=1;
      draw(last, t); if(t<1){raf=requestAnimationFrame(frame);} else {raf=null;playing=false;const b=$("cx-play");if(b)b.innerHTML="&#9654; Play";} }
    raf=requestAnimationFrame(frame);
  }
  function togglePlay(){ if(playing) stopPlay(); else startPlay(); }
  function setMode(m){
    mode=m; stopPlay();
    const seg=$("cx-learn3");
    seg.querySelectorAll("button").forEach(b=>{ const on=b.getAttribute("data-mode")===m; b.classList.toggle("active",on); b.setAttribute("aria-pressed",String(on)); });
    const sp=stepsPanel(), animCtl=$("cx-anim-controls");
    if(sp) sp.style.display=(m==="steps")?"":"none";
    if(m==="steps"&&sp){ sp.hidden=false; sp.style.display=""; const w=document.getElementById("nc-steps-working"); if(w)w.click(); }
    animCtl.style.display=(m==="anim")?"":"none";
    if(m==="anim") $("cx-anim-note").textContent=ANIM_NOTE;
    draw(last); styleToggle();
  }
  $("cx-learn3").querySelectorAll("button").forEach(b=>{ b.addEventListener("click",()=>setMode(b.getAttribute("data-mode"))); });
  $("cx-play").addEventListener("click",togglePlay);

  wireInputs(update);
  if(window.NCAngle){ NCAngle.onChange(function(){ onUnitChange(); update(); }); }
  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", styleToggle);
  window.addEventListener("nc-theme-change", ()=>{ if(last) draw(last); });

  initInputs(); styleFields();
  update().then(()=>{ const it=document.querySelector("#nc-steps .nc-steps-toggle"); if(it) it.style.display="none"; setMode("direct"); });
})();
</script>
