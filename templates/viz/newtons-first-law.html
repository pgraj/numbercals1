<div class="viz-panel" data-slug="{{ calc.slug }}">

  <div class="viz-inputs" style="align-items:flex-start;gap:40px;flex-wrap:wrap">
    <label>
      <span style="display:block;white-space:nowrap">The body starts</span>
      <span class="nc-field" style="display:block">
        <select id="n1-state" style="width:150px">
          <option value="moving" selected>Moving</option>
          <option value="rest">At rest</option>
        </select>
      </span>
    </label>
    <label>
      <span style="display:block;white-space:nowrap">Net force</span>
      <span class="nc-field" style="display:block">
        <select id="n1-force" style="width:150px">
          <option value="off" selected>No net force</option>
          <option value="on">A net force acts</option>
        </select>
      </span>
    </label>
  </div>

  <canvas id="n1-canvas" width="640" height="300"
          style="display:block;width:100%;height:auto;max-width:560px;margin:8px auto 0"></canvas>
  <p class="viz-caption" id="n1-cap"
     style="font-size:.9rem;margin-top:.5rem;opacity:.85;text-align:center"></p>

  <p class="viz-law" id="n1-law"
     style="font-size:.86rem;margin-top:.4rem;line-height:1.5;text-align:center"></p>

  <div class="viz-out" id="viz-out" style="margin-top:10px"></div>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="n1-disc"
     style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<div class="nc-learn3" id="n1-learn3" role="group" aria-label="Answer detail"
     style="display:inline-flex;border-radius:8px;overflow:hidden;margin:12px 0 6px">
  <button type="button" data-mode="direct" class="active" aria-pressed="true">Direct answer</button>
  <button type="button" data-mode="steps" aria-pressed="false">Step-by-step working</button>
  <button type="button" data-mode="anim" aria-pressed="false">Animation</button>
</div>

<div id="n1-anim-controls" style="display:none;margin:2px 0 6px">
  <button type="button" id="n1-play" style="cursor:pointer;border-radius:6px;padding:4px 12px">&#9654; Play</button>
  <p id="n1-anim-note" style="font-size:.82rem;margin:6px 0 0;opacity:.8;max-width:560px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $("n1-canvas"), ctx = cv.getContext("2d");
  const SLUG = "{{ calc.slug }}";
  let last = null;

  function S(){ return window.NCSkin || {}; }

  function renderLaw(d){
    const el=$("n1-law"); if(!el) return;
    if(!d || !d.law_statement){ el.innerHTML=""; return; }
    const sk=window.NCSkin||{};
    let html='<b>What this law states:</b> '+d.law_statement;
    if(d.law_source_url && d.law_source_name){
      html+=' <a href="'+d.law_source_url+'" target="_blank" rel="noopener">'+d.law_source_name+'</a>';
    }
    el.innerHTML=html;
    el.style.color=sk.inkSoft||"";
    el.querySelectorAll("b").forEach(b=>{ b.style.color=sk.ink||""; });
    el.querySelectorAll("a").forEach(a=>{ a.style.color=sk.accent||""; });
  }

  function styleFields(){
    const panel = document.querySelector('.viz-panel[data-slug="'+SLUG+'"]');
    if(!panel||!window.NCSkin) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const n=$("n1-anim-note"); if(n) n.style.color=NCSkin.inkSoft;
    const d=$("n1-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  async function update(){
    const body={ initial_state:$("n1-state").value, net_force:$("n1-force").value };
    let data;
    try{
      const r=await fetch("/api/compute/"+SLUG,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      data=await r.json();
    }catch(e){ $("viz-out").textContent="compute error"; return; }
    try{ if(window.NCSteps) NCSteps.render(data.steps||[]); }catch(e){}
    if(data.disclaimer) $("n1-disc").textContent="\u26A0 "+data.disclaimer;
    renderLaw(data);
    if(data.error){
      $("viz-out").innerHTML="<b>"+data.error+"</b>";
      last=null; ctx.clearRect(0,0,cv.width,cv.height); return;
    }
    $("viz-out").innerHTML=`<div style="line-height:1.7"><b>${data.result}</b></div>`;
    try{ if(window.__ncExplain) __ncExplain(data.explanation); }catch(e){}
    last=data; draw(last, 1);
  }

  function arrow(x1,y,x2,col){
    ctx.strokeStyle=col; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); ctx.stroke();
    const dir=(x2>=x1)?1:-1;
    ctx.beginPath();
    ctx.moveTo(x2,y);
    ctx.lineTo(x2-dir*12,y-6);
    ctx.lineTo(x2-dir*12,y+6);
    ctx.closePath(); ctx.fillStyle=col; ctx.fill();
  }

  // draw(d, sweep): moving box glides if no force / constant; if force acts it changes.
  function draw(d, sweep){
    if(!window.NCSkin || !d){ ctx.clearRect(0,0,cv.width,cv.height); return; }
    if(typeof sweep!=="number") sweep=1;
    const sk=S();
    const W=cv.width,H=cv.height;
    const ink=sk.ink||"#222", soft=sk.inkSoft||"#888", acc=sk.accent||"#b34a23",
          yes=sk.yes||"#2f7a52", rule=sk.rule||"#ddd";
    ctx.clearRect(0,0,W,H);
    const baseY=H*0.55;
    const moving=(d.initial_state==="moving");
    const force=!!d.force_on;
    const frac=Math.max(0,Math.min(1,sweep));

    // ground
    ctx.strokeStyle=rule; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(40,baseY+30); ctx.lineTo(W-40,baseY+30); ctx.stroke();

    // position: rest+noforce stays; moving+noforce glides steadily;
    // force present -> accelerates (ease-in) if moving-with-force or rest-with-force
    let x;
    if(!moving && !force){ x=W*0.5; }                        // stays put
    else if(moving && !force){ x=90+(W-260)*frac; }          // constant glide
    else if(moving && force){ x=90+(W-260)*(0.4*frac+0.6*frac*frac); } // speeds up
    else { x=120+(W-320)*(frac*frac); }                      // rest -> starts moving

    const sz=42;
    ctx.fillStyle=sk.paper2||"#eee"; ctx.strokeStyle=ink; ctx.lineWidth=1.5;
    ctx.fillRect(x-sz/2,baseY-sz,sz,sz); ctx.strokeRect(x-sz/2,baseY-sz,sz,sz);

    // arrows
    if(force){
      arrow(x+sz/2,baseY-sz/2,x+sz/2+70,acc);
      ctx.fillStyle=acc; ctx.font="13px "+(sk.mono||"monospace"); ctx.textAlign="left";
      ctx.fillText("net force", x+sz/2+10, baseY-sz/2-10);
    } else {
      // two cancelling arrows to show zero net force
      arrow(x-sz/2,baseY-sz/2,x-sz/2-50,soft);
      arrow(x+sz/2,baseY-sz/2,x+sz/2+50,soft);
      ctx.fillStyle=soft; ctx.font="13px "+(sk.mono||"monospace"); ctx.textAlign="center";
      ctx.fillText("forces balance \u2192 net force = 0", x, baseY-sz-8);
    }

    // velocity hint for moving cases
    if(moving || force){
      ctx.fillStyle=yes; ctx.font="13px "+(sk.sans||"sans-serif"); ctx.textAlign="center";
      ctx.fillText("\u2192 moving", x, baseY+22);
    } else {
      ctx.fillStyle=soft; ctx.font="13px "+(sk.sans||"sans-serif"); ctx.textAlign="center";
      ctx.fillText("at rest", x, baseY+22);
    }

    // top-left readout
    ctx.fillStyle=acc; ctx.font="14px "+(sk.mono||"monospace"); ctx.textAlign="left";
    ctx.fillText(force ? "\u2211F \u2260 0" : "\u2211F = 0", 14, 24);
    ctx.fillStyle=ink;
    ctx.fillText(d.verdict||"", 14, 44);

    $("n1-cap").textContent = force
      ? "a net force is acting, so the motion changes"
      : "no net force, so the motion does not change (inertia)";
  }

  let mode="direct", raf=null, playing=false, animStart=null;
  const DURATION=2800;
  function animNote(){
    if(!last) return "";
    return last.force_on
      ? "With a net force acting, the body's motion changes \u2014 watch it speed up or start moving."
      : "With no net force, nothing about the motion changes \u2014 it stays at rest or glides steadily.";
  }

  function stepsPanel(){ return document.getElementById("nc-steps"); }
  function styleToggle(){
    if(!window.NCSkin) return;
    const seg=$("n1-learn3"); seg.style.border="1px solid "+NCSkin.rule;
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.classList.contains("active");
      b.style.cursor="pointer"; b.style.border="none"; b.style.padding="6px 14px";
      b.style.font="13px "+(NCSkin.sans||"sans-serif");
      b.style.background = on ? NCSkin.accent : (NCSkin.paper2||"transparent");
      b.style.color = on ? (NCSkin.paper||"#fff") : NCSkin.ink;
    });
    const pb=$("n1-play");
    if(pb){ pb.style.border="1px solid "+NCSkin.rule; pb.style.background=NCSkin.paper2||"transparent"; pb.style.color=NCSkin.ink; }
  }
  function stopPlay(){
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    playing=false; animStart=null;
    const pb=$("n1-play"); if(pb) pb.textContent="\u25B6 Play";
    if(last) draw(last,1);
  }
  function startPlay(){
    if(raf||!last) return; playing=true;
    const pb=$("n1-play"); if(pb) pb.textContent="\u23F8 Pause";
    function frame(ts){
      if(animStart===null) animStart=ts;
      let t=(ts-animStart)/DURATION; if(t>=1) t=1;
      draw(last,t);
      if(t<1){ raf=requestAnimationFrame(frame); }
      else { raf=null; playing=false; const b=$("n1-play"); if(b)b.textContent="\u25B6 Play"; }
    }
    raf=requestAnimationFrame(frame);
  }
  function togglePlay(){ if(playing) stopPlay(); else startPlay(); }

  function setMode(m){
    mode=m; stopPlay();
    const seg=$("n1-learn3");
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.getAttribute("data-mode")===m;
      b.classList.toggle("active",on); b.setAttribute("aria-pressed",String(on));
    });
    const sp=stepsPanel(), animCtl=$("n1-anim-controls");
    if(sp) sp.style.display=(m==="steps")?"":"none";
    if(m==="steps" && sp){ sp.hidden=false; sp.style.display="";
      const wbtn=document.getElementById("nc-steps-working"); if(wbtn) wbtn.click(); }
    animCtl.style.display=(m==="anim")?"":"none";
    if(m==="anim") $("n1-anim-note").textContent=animNote();
    draw(last,1); styleToggle();
  }

  $("n1-learn3").querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>setMode(b.getAttribute("data-mode")));
  });
  $("n1-play").addEventListener("click", togglePlay);

  ["n1-state","n1-force"].forEach(id=>{
    $(id).addEventListener("change", ()=>{ if(mode==="anim") setMode("anim"); update(); });
  });

  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", styleToggle);
  window.addEventListener("nc-theme-change", ()=>{ if(last) renderLaw(last); });
  window.addEventListener("nc-theme-change", ()=>{ if(last) draw(last,1); });

  styleFields();
  update().then(()=>{
    const innerToggle=document.querySelector("#nc-steps .nc-steps-toggle");
    if(innerToggle) innerToggle.style.display="none";
    setMode("direct");
  });
})();
</script>
