<div class="viz-panel" data-slug="{{ calc.slug }}">

  <div class="viz-inputs" style="align-items:flex-start;gap:30px;flex-wrap:wrap">
    <label>
      <span style="display:block;white-space:nowrap">Solve for</span>
      <span class="nc-field" style="display:block">
        <select id="ar-solve" style="width:160px">
          <option value="force" selected>Buoyant force</option>
          <option value="fluid_density">Fluid density</option>
          <option value="volume">Displaced volume</option>
        </select>
      </span>
    </label>
    <label id="ar-l-density">
      <span style="display:block;white-space:nowrap">Fluid density &rho; (kg/m&sup3;)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="ar-density" value="1000" step="any" style="width:120px">
      </span>
    </label>
    <label id="ar-l-volume">
      <span style="display:block;white-space:nowrap">Displaced volume V (m&sup3;)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="ar-volume" value="0.001" step="any" style="width:120px">
      </span>
    </label>
    <label id="ar-l-force" style="display:none">
      <span style="display:block;white-space:nowrap">Buoyant force F&#8348; (N)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="ar-force" value="9.81" step="any" style="width:120px">
      </span>
    </label>
  </div>

  <canvas id="ar-canvas" width="640" height="340"
          style="display:block;width:100%;height:auto;max-width:560px;margin:8px auto 0"></canvas>
  <p class="viz-caption" id="ar-cap"
     style="font-size:.9rem;margin-top:.5rem;opacity:.85;text-align:center"></p>

  <p class="viz-law" id="ar-law"
     style="font-size:.86rem;margin-top:.4rem;line-height:1.5;text-align:center"></p>

  <div class="viz-out" id="viz-out" style="margin-top:10px"></div>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="ar-disc"
     style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<div class="nc-learn3" id="ar-learn3" role="group" aria-label="Answer detail"
     style="display:inline-flex;border-radius:8px;overflow:hidden;margin:12px 0 6px">
  <button type="button" data-mode="direct" class="active" aria-pressed="true">Direct answer</button>
  <button type="button" data-mode="steps" aria-pressed="false">Step-by-step working</button>
  <button type="button" data-mode="anim" aria-pressed="false">Animation</button>
</div>

<div id="ar-anim-controls" style="display:none;margin:2px 0 6px">
  <button type="button" id="ar-play" style="cursor:pointer;border-radius:6px;padding:4px 12px">&#9654; Play</button>
  <p id="ar-anim-note" style="font-size:.82rem;margin:6px 0 0;opacity:.8;max-width:560px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $("ar-canvas"), ctx = cv.getContext("2d");
  const SLUG = "{{ calc.slug }}";
  let last = null;
  const WATER = "#3a86c8";

  function S(){ return window.NCSkin || {}; }
  function fmt(x){
    if(x===null||x===undefined||isNaN(x)) return "";
    if(Math.abs(x-Math.round(x))<1e-9) return String(Math.round(x));
    return (Math.round(x*10000)/10000).toString();
  }

  function renderLaw(d){
    const el=$("ar-law"); if(!el) return;
    if(!d || !d.law_statement){ el.innerHTML=""; return; }
    const sk=window.NCSkin||{};
    let html='<b>What this law states:</b> '+d.law_statement;
    if(d.law_source_url && d.law_source_name){
      html+=' <a href="'+d.law_source_url+'" target="_blank" rel="noopener">'+d.law_source_name+'</a>';
    }
    el.innerHTML=html;
    el.style.color=sk.inkSoft||"";
    el.querySelectorAll("b").forEach(b=>{ b.style.color=sk.ink||""; });
    el.querySelectorAll("a").forEach(a=>{ a.style.color=sk.accent||""; });
  }

  function styleFields(){
    const panel = document.querySelector('.viz-panel[data-slug="'+SLUG+'"]');
    if(!panel||!window.NCSkin) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const n=$("ar-anim-note"); if(n) n.style.color=NCSkin.inkSoft;
    const d=$("ar-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function syncFields(){
    const sf=$("ar-solve").value;
    $("ar-l-density").style.display = (sf==="force"||sf==="volume") ? "" : "none";
    $("ar-l-volume").style.display  = (sf==="force"||sf==="fluid_density") ? "" : "none";
    $("ar-l-force").style.display   = (sf==="fluid_density"||sf==="volume") ? "" : "none";
  }

  async function update(){
    const body={ solve_for:$("ar-solve").value,
      fluid_density:parseFloat($("ar-density").value),
      volume:parseFloat($("ar-volume").value),
      force:parseFloat($("ar-force").value) };
    let data;
    try{
      const r=await fetch("/api/compute/"+SLUG,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      data=await r.json();
    }catch(e){ $("viz-out").textContent="compute error"; return; }
    try{ if(window.NCSteps) NCSteps.render(data.steps||[]); }catch(e){}
    if(data.disclaimer) $("ar-disc").textContent="\u26A0 "+data.disclaimer;
    renderLaw(data);
    if(data.error){
      $("viz-out").innerHTML="<b>"+data.error+"</b>";
      last=null; ctx.clearRect(0,0,cv.width,cv.height); return;
    }
    $("viz-out").innerHTML=`<div style="line-height:1.7"><b>${data.result}</b></div>`;
    try{ if(window.__ncExplain) __ncExplain(data.explanation); }catch(e){}
    last=data; draw(last, 1);
  }

  // draw(d, sweep): coloured tank of water; the object lowers in (sweep 0->1),
  // the water level RISES by the displaced amount, with the original level marked.
  function draw(d, sweep){
    if(!window.NCSkin || !d){ ctx.clearRect(0,0,cv.width,cv.height); return; }
    if(typeof sweep!=="number") sweep=1;
    const sk=S();
    const W=cv.width,H=cv.height;
    const ink=sk.ink||"#222", soft=sk.inkSoft||"#888", acc=sk.accent||"#b34a23",
          yes=sk.yes||"#2f7a52", rule=sk.rule||"#ddd";
    ctx.clearRect(0,0,W,H);
    const frac=Math.max(0,Math.min(1,sweep));
    const rho=(typeof d.fluid_density==="number")?d.fluid_density:0;
    const V=(typeof d.volume==="number")?d.volume:0;
    const Fb=(typeof d.force==="number")?d.force:0;

    // tank
    const tx=W*0.5-140, ty=46, tw=280, tankBottom=H-46, th=tankBottom-ty;
    ctx.strokeStyle=ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx,tankBottom);
    ctx.lineTo(tx+tw,tankBottom); ctx.lineTo(tx+tw,ty); ctx.stroke();

    // object geometry
    const objW=Math.max(40,Math.min(130, 40+V*40000));
    const objH=objW*0.7;
    const objX=W*0.5-objW/2;

    // original water level
    const baseWaterTop=ty+90;
    // displaced volume shown as a rise; cap the rise visually
    const tankInnerW=tw-4;
    const riseMax=70;
    // submerged fraction of the object (0 at start, full by end)
    // object vertical position: starts just above water, lowers in
    const objStartY=baseWaterTop-objH-6;
    const objEndY=baseWaterTop+ (tankBottom-baseWaterTop)*0.40;
    const objY=objStartY+(objEndY-objStartY)*frac;
    // submerged depth (how much of the object is below the ORIGINAL waterline)
    // approximate displaced area -> water level rise
    const displacedArea=objW*Math.max(0,Math.min(objH, (objY+objH)-baseWaterTop));
    const rise=Math.min(riseMax, (displacedArea/tankInnerW));
    const waterTop=baseWaterTop-rise;

    // water fill (coloured)
    ctx.fillStyle=WATER;
    ctx.globalAlpha=0.55;
    ctx.fillRect(tx+2,waterTop,tankInnerW,tankBottom-waterTop-1);
    ctx.globalAlpha=1;
    // water surface line
    ctx.strokeStyle=WATER; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(tx+2,waterTop); ctx.lineTo(tx+tw-2,waterTop); ctx.stroke();

    // original level (dashed) to show the rise
    ctx.strokeStyle=soft; ctx.lineWidth=1; ctx.setLineDash([5,4]);
    ctx.beginPath(); ctx.moveTo(tx+2,baseWaterTop); ctx.lineTo(tx+tw-2,baseWaterTop); ctx.stroke();
    ctx.setLineDash([]);
    if(rise>2){
      ctx.fillStyle=soft; ctx.font="11px "+(sk.sans||"sans-serif"); ctx.textAlign="left";
      ctx.fillText("original level", tx+6, baseWaterTop-4);
      ctx.fillStyle=WATER;
      ctx.fillText("risen by displaced water", tx+6, waterTop-4);
    }

    // object
    ctx.fillStyle=sk.paper3||"#ccb"; ctx.strokeStyle=ink; ctx.lineWidth=1.5;
    ctx.fillRect(objX,objY,objW,objH); ctx.strokeRect(objX,objY,objW,objH);

    // upward buoyant arrow
    const alen=Math.max(28,Math.min(110, Math.abs(Fb)*6));
    ctx.strokeStyle=yes; ctx.fillStyle=yes; ctx.lineWidth=3;
    const ax=W*0.5;
    ctx.beginPath(); ctx.moveTo(ax,objY); ctx.lineTo(ax,objY-alen); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(ax,objY-alen); ctx.lineTo(ax-6,objY-alen+10); ctx.lineTo(ax+6,objY-alen+10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle=yes; ctx.font="13px "+(sk.mono||"monospace"); ctx.textAlign="left";
    ctx.fillText("buoyant force "+fmt(Fb)+" N", ax+10, objY-alen+10);

    // labels
    ctx.fillStyle=ink; ctx.font="13px "+(sk.sans||"sans-serif"); ctx.textAlign="left";
    ctx.fillText("fluid \u03C1 = "+fmt(rho)+" kg/m\u00B3", tx+tw+12, ty+50);
    ctx.fillText("displaced V = "+fmt(V)+" m\u00B3", tx+tw+12, ty+70);

    ctx.fillStyle=acc; ctx.font="14px "+(sk.mono||"monospace"); ctx.textAlign="left";
    ctx.fillText("F\u1D47 = \u03C1 V g", 14, 24);
    ctx.fillStyle=ink;
    ctx.fillText("F\u1D47 = "+fmt(Fb)+" N", 14, 44);
    ctx.fillStyle=soft;
    ctx.fillText("g = "+fmt(d.g||9.81)+" m/s\u00B2", 14, 62);

    $("ar-cap").textContent="the object pushes water aside; the level rises and the water pushes back up";
  }

  let mode="direct", raf=null, playing=false, animStart=null;
  const DURATION=2800;
  const ANIM_NOTE="As the object lowers into the water it pushes water aside, so the level "+
    "rises (shown against the dashed original level). The fluid pushes back up with a force "+
    "equal to the weight of the water displaced.";

  function stepsPanel(){ return document.getElementById("nc-steps"); }
  function styleToggle(){
    if(!window.NCSkin) return;
    const seg=$("ar-learn3"); seg.style.border="1px solid "+NCSkin.rule;
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.classList.contains("active");
      b.style.cursor="pointer"; b.style.border="none"; b.style.padding="6px 14px";
      b.style.font="13px "+(NCSkin.sans||"sans-serif");
      b.style.background = on ? NCSkin.accent : (NCSkin.paper2||"transparent");
      b.style.color = on ? (NCSkin.paper||"#fff") : NCSkin.ink;
    });
    const pb=$("ar-play");
    if(pb){ pb.style.border="1px solid "+NCSkin.rule; pb.style.background=NCSkin.paper2||"transparent"; pb.style.color=NCSkin.ink; }
  }
  function stopPlay(){
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    playing=false; animStart=null;
    const pb=$("ar-play"); if(pb) pb.textContent="\u25B6 Play";
    if(last) draw(last,1);
  }
  function startPlay(){
    if(raf||!last) return; playing=true;
    const pb=$("ar-play"); if(pb) pb.textContent="\u23F8 Pause";
    function frame(ts){
      if(animStart===null) animStart=ts;
      let t=(ts-animStart)/DURATION; if(t>=1) t=1;
      draw(last,t);
      if(t<1){ raf=requestAnimationFrame(frame); }
      else { raf=null; playing=false; const b=$("ar-play"); if(b)b.textContent="\u25B6 Play"; }
    }
    raf=requestAnimationFrame(frame);
  }
  function togglePlay(){ if(playing) stopPlay(); else startPlay(); }

  function setMode(m){
    mode=m; stopPlay();
    const seg=$("ar-learn3");
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.getAttribute("data-mode")===m;
      b.classList.toggle("active",on); b.setAttribute("aria-pressed",String(on));
    });
    const sp=stepsPanel(), animCtl=$("ar-anim-controls");
    if(sp) sp.style.display=(m==="steps")?"":"none";
    if(m==="steps" && sp){ sp.hidden=false; sp.style.display="";
      const wbtn=document.getElementById("nc-steps-working"); if(wbtn) wbtn.click(); }
    animCtl.style.display=(m==="anim")?"":"none";
    if(m==="anim") $("ar-anim-note").textContent=ANIM_NOTE;
    draw(last,1); styleToggle();
  }

  $("ar-learn3").querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>setMode(b.getAttribute("data-mode")));
  });
  $("ar-play").addEventListener("click", togglePlay);

  $("ar-solve").addEventListener("change", ()=>{ syncFields(); if(mode==="anim") setMode("anim"); update(); });
  ["ar-density","ar-volume","ar-force"].forEach(id=>{
    const el=$(id); if(el) el.addEventListener("input", ()=>{ if(mode==="anim") setMode("anim"); update(); });
  });

  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", styleToggle);
  window.addEventListener("nc-theme-change", ()=>{ if(last) renderLaw(last); });
  window.addEventListener("nc-theme-change", ()=>{ if(last) draw(last,1); });

  syncFields(); styleFields();
  update().then(()=>{
    const innerToggle=document.querySelector("#nc-steps .nc-steps-toggle");
    if(innerToggle) innerToggle.style.display="none";
    setMode("direct");
  });
})();
</script>
