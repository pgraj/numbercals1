<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>Distance to tree (m)
      <span class="nc-field"><input id="th-d" type="number" value="25" step="any" min="1"></span></label>
    <label>Angle of elevation (°)
      <span class="nc-field"><input id="th-a" type="number" value="32" step="any" min="1" max="89"></span></label>
    <label>Drag the angle
      <span class="nc-field"><input id="th-range" type="range" value="32" min="5" max="85" step="1" style="width:200px"></span></label>
    <label>Eye height (m)
      <span class="nc-field"><input id="th-eye" type="number" value="1.6" step="any" min="0"></span></label>
  </div>

  <div class="viz-out" id="th-out"></div>

  <canvas id="th-diagram" width="680" height="420"
          style="display:block;width:100%;height:auto;max-width:600px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="th-cap" style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>

  <p class="viz-disclaimer" id="th-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
/* Explanation cards — standard NumberCals pattern (theme-aware). */
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
/* Compute + scene + NCLearn wiring for rw-tree-height. */
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const P = "th";
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      if(el.type==="range") return;
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$(P+"-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function buildBody(){
    return { distance:$("th-d").value, angle_deg:$("th-a").value, eye_height:$("th-eye").value };
  }

  async function update(){
    const body = buildBody();
    let data;
    try { const r=await fetch("/api/compute/"+slug,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $(P+"-out").textContent="compute error"; return; }
    try { if(window.NCSteps) window.NCSteps.render(data.steps||[]); } catch(e){}
    if (data.disclaimer) $(P+"-disc").textContent="\u26a0 "+data.disclaimer;
    if (data.error){ $(P+"-out").innerHTML="<b>"+data.error+"</b>"; try{window.__ncExplain([]);}catch(e){} drawScene(null); last=null; mountLearn(null); return; }
    $(P+"-out").innerHTML = "<b>Tree height \u2248 "+data.result+" m</b>  \u00b7  "+fmt(data.above_eye)+" m above eye + "+fmt(data.eye_height)+" m";
    try{ window.__ncExplain(data.explanation);}catch(e){}
    last=data; drawScene(data); mountLearn(data);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({ slug:slug, panel:panel, data:data, drawFrame:(data?drawFrame:undefined) });
  }

  function fmt(x){ if(x===null||x===undefined) return ""; return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*10000)/10000).toString(); }

  /* The scene: ground line, surveyor at left, tree at right, line of sight
     sweeping up to the treetop, the angle arc, and labelled height/distance. */
  function drawScene(d){ drawAt(d, 1); }
  function drawAt(d, sweep){
    const cv=$(P+"-diagram"); if(!cv) return; const ctx=cv.getContext("2d"); const s=window.NCSkin||{};
    const ink=s.ink||"#222", accent=s.accent||"#b5651d", yes=s.yes||"#3a7d44", soft=s.inkSoft||"#777", rule=s.rule||"#ccc", paper2=s.paper2||"#eee";
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H); const cap=$(P+"-cap");
    if(!d){ if(cap) cap.textContent=""; return; }

    const dist=d.distance, ang=d.angle_deg, eye=d.eye_height, above=d.above_eye, total=d.total_height;
    const groundY=H-60, leftX=70, rightX=W-90;
    const span=rightX-leftX;
    // vertical scale: fit the full tree height into the canvas height budget
    const budget=groundY-50;
    const vscale=Math.min(budget/Math.max(total,1), span/Math.max(dist,1));
    const eyeY=groundY - eye*vscale;
    const topY=groundY - total*vscale;          // treetop
    const topYsweep=groundY - (eye + above*sweep)*vscale;

    // ground
    ctx.strokeStyle=soft; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(40,groundY); ctx.lineTo(W-40,groundY); ctx.stroke();
    // surveyor (a simple stick + eye dot) at leftX
    ctx.strokeStyle=ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(leftX,groundY); ctx.lineTo(leftX,eyeY); ctx.stroke();
    ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(leftX,eyeY,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=soft; ctx.font="12px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText("eye "+fmt(eye)+" m", leftX, groundY+18);
    // tree: trunk + canopy at rightX
    ctx.strokeStyle=ink; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(rightX,groundY); ctx.lineTo(rightX,topY); ctx.stroke();
    ctx.globalAlpha=0.9; ctx.fillStyle=yes;
    ctx.beginPath(); ctx.arc(rightX,topY+14,22,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(rightX-16,topY+30,16,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(rightX+16,topY+30,16,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    // horizontal eye line
    ctx.strokeStyle=rule; ctx.setLineDash([4,4]); ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(leftX,eyeY); ctx.lineTo(rightX,eyeY); ctx.stroke(); ctx.setLineDash([]);
    // line of sight (sweeps up)
    ctx.strokeStyle=accent; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(leftX,eyeY); ctx.lineTo(rightX,topYsweep); ctx.stroke();
    // angle arc at the eye
    ctx.strokeStyle=yes; ctx.lineWidth=2; const a0=0, a1=-Math.atan2(eyeY-topYsweep, rightX-leftX);
    ctx.beginPath(); ctx.arc(leftX,eyeY,34, a0, a1, true); ctx.stroke();
    ctx.fillStyle=yes; ctx.font="bold 13px "+(s.mono||"monospace"); ctx.textAlign="left";
    ctx.fillText(fmt(ang*sweep)+"\u00b0", leftX+40, eyeY-10);
    // distance label
    ctx.fillStyle=soft; ctx.font="12px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText("distance = "+fmt(dist)+" m", (leftX+rightX)/2, eyeY+16);
    // height bracket on the tree (above eye)
    ctx.strokeStyle=accent; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(rightX+28,eyeY); ctx.lineTo(rightX+28,topYsweep); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=accent; ctx.save(); ctx.translate(rightX+42,(eyeY+topYsweep)/2); ctx.rotate(-Math.PI/2);
    ctx.textAlign="center"; ctx.fillText(fmt(above*sweep)+" m", 0,0); ctx.restore();
    // total readout
    ctx.fillStyle=ink; ctx.font="bold 14px "+(s.mono||"monospace"); ctx.textAlign="left";
    ctx.fillText("tree \u2248 "+fmt(total)+" m", 16, 26);
    if(cap) cap.textContent="Line of sight up to the treetop makes a right triangle: distance (adjacent), height above eye (opposite), angle of elevation between them.";
  }

  function drawFrame(ctx, t, d){ if(!d) return; drawAt(d, (t<0.75? t/0.75 : 1)); }

  // wiring: number inputs + the slider mirror the angle
  ["th-d","th-a","th-eye"].forEach(id=>{ const el=$(id); el.addEventListener("input",update); el.addEventListener("change",update); });
  (function(){
    const rng=$("th-range"), num=$("th-a");
    rng.addEventListener("input",()=>{ num.value=rng.value; update(); });
    num.addEventListener("input",()=>{ const v=parseFloat(num.value); if(!isNaN(v)&&v>=5&&v<=85) rng.value=v; });
  })();
  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawScene(last); });
  styleFields(); update();
})();
</script>
