<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>Mode
      <span class="nc-field"><select id="pi-mode"><option value="verify" selected>Verify at an angle</option><option value="find">Find one ratio from the other</option></select></span></label>
    <label id="pi-lab-ang">Angle &theta; (degrees)
      <span class="nc-field"><input id="pi-ang" type="number" value="37" step="any"></span></label>
    <label id="pi-lab-ratio" style="display:none">Known ratio
      <span class="nc-field"><select id="pi-ratio"><option value="sin" selected>sin &theta;</option><option value="cos">cos &theta;</option></select></span></label>
    <label id="pi-lab-val" style="display:none">Its value
      <span class="nc-field"><input id="pi-val" type="number" value="0.6" step="any" min="-1" max="1"></span></label>
    <label id="pi-lab-quad" style="display:none">Quadrant
      <span class="nc-field"><select id="pi-quad"><option value="1" selected>I</option><option value="2">II</option><option value="3">III</option><option value="4">IV</option></select></span></label>
  </div>

  <div class="viz-out" id="pi-out"></div>

  <canvas id="pi-diagram" width="680" height="420"
          style="display:block;width:100%;height:auto;max-width:600px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="pi-cap" style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="pi-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const P = "pi";
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      if(el.type==="range") return;
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$(P+"-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function buildBody(){
    const mode=$("pi-mode").value;
    if(mode==="find") return { mode:"find", ratio:$("pi-ratio").value, value:$("pi-val").value, quadrant:$("pi-quad").value };
    return { mode:"verify", angle_deg:$("pi-ang").value };
  }

  async function update(){
        const _m=$("pi-mode").value, _v=(_m==="verify");
    $("pi-lab-ang").style.display=_v?"":"none";
    $("pi-lab-ratio").style.display=_v?"none":"";
    $("pi-lab-val").style.display=_v?"none":"";
    $("pi-lab-quad").style.display=_v?"none":"";
    const body = buildBody();
    let data;
    try { const r=await fetch("/api/compute/"+slug,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $(P+"-out").textContent="compute error"; return; }
    try { if(window.NCSteps) window.NCSteps.render(data.steps||[]); } catch(e){}
    if (data.disclaimer) $(P+"-disc").textContent="\u26a0 "+data.disclaimer;
    if (data.error){ $(P+"-out").innerHTML="<b>"+data.error+"</b>"; try{window.__ncExplain([]);}catch(e){} drawDiagram(null); last=null; mountLearn(null); return; }
    $(P+"-out").innerHTML = (data.mode==="find") ? ('<b>'+data.found+' \u03b8 = '+data.result+'</b>  (from '+data.known+' \u03b8 = '+fmt(data.known_value)+', quadrant '+data.quadrant+')') : ('<b>sin\u00b2\u03b8 + cos\u00b2\u03b8 = '+data.result+'</b>');
    try{ window.__ncExplain(data.explanation);}catch(e){}
    last=data; drawDiagram(data); mountLearn(data);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({ slug:slug, panel:panel, data:data, drawFrame:(data?drawFrame:undefined) });
  }

  function fmt(x){ if(x===null||x===undefined) return ""; return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*10000)/10000).toString(); }

  // Shared auto-fit: given natural-coordinate points [{x,y},...] and the canvas,
  // return a mapper m(p)->{x,y} that centres and scales them to fill the box
  // (minus margin) so NOTHING ever clips, whatever the inputs. Y is flipped so
  // positive-y is up in natural coords. Returns {map, scale}.
  function fitPts(pts, W, H, margin){
    margin = margin || 48;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    pts.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
    const spanX=Math.max(1e-6,maxX-minX), spanY=Math.max(1e-6,maxY-minY);
    const sc=Math.min((W-2*margin)/spanX, (H-2*margin)/spanY);
    const cxN=(minX+maxX)/2, cyN=(minY+maxY)/2;
    const map=(p)=>({ x: W/2 + (p.x-cxN)*sc, y: H/2 - (p.y-cyN)*sc });
    return { map, scale:sc };
  }


  function drawDiagram(d){ drawIdent(d, 1); }
  function drawIdent(d, grow){
    const cv=$(P+"-diagram"); if(!cv) return; const ctx=cv.getContext("2d"); const s=window.NCSkin||{};
    const ink=s.ink||"#222", accent=s.accent||"#b50", yes=s.yes||"#3a7", soft=s.inkSoft||"#777", rule=s.rule||"#ccc";
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H); const cap=$(P+"-cap");
    if(!d){ if(cap) cap.textContent=""; return; }
    // derive the point (cos,sin) on the unit circle
    let co, si;
    if(d.mode==="find"){
      if(d.found==="cos"){ si=d.known_value; co=d.found_value; }
      else { co=d.known_value; si=d.found_value; }
    } else { co=d.cos; si=d.sin; }
    const cx=W/2, cy=H/2+10, R=140;
    // axes + circle
    ctx.strokeStyle=rule; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx-R-18,cy); ctx.lineTo(cx+R+18,cy); ctx.moveTo(cx,cy-R-18); ctx.lineTo(cx,cy+R-(-18)); ctx.stroke();
    const px=cx+co*R*grow, py=cy-si*R*grow;
    // right triangle: cos leg (horizontal), sin leg (vertical), radius hypotenuse
    ctx.strokeStyle=accent; ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,cy); ctx.stroke(); // cos leg
    ctx.strokeStyle=yes;    ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(px,cy); ctx.lineTo(px,py); ctx.stroke(); // sin leg
    ctx.strokeStyle=ink;    ctx.lineWidth=2;   ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py); ctx.stroke(); // radius (=1)
    // right-angle marker at the foot
    ctx.strokeStyle=soft; ctx.lineWidth=1; const m=10; const sx=(co>=0?-m:m); const sy=(si>=0?-m:m);
    ctx.strokeRect(px+(co>=0?-m:0), cy+(si>=0?-m:0), m, m);
    // point
    ctx.fillStyle=ink; ctx.beginPath(); ctx.arc(px,py,5,0,Math.PI*2); ctx.fill();
    // labels
    ctx.font="13px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillStyle=accent; ctx.fillText("cos \u03b8 = "+fmt(co), (cx+px)/2, cy+(si>=0?18:-8));
    ctx.fillStyle=yes; ctx.save(); ctx.translate(px+(co>=0?16:-16),(cy+py)/2); ctx.rotate(-Math.PI/2); ctx.fillText("sin \u03b8 = "+fmt(si),0,0); ctx.restore();
    ctx.fillStyle=ink; ctx.save(); const mx=(cx+px)/2, my=(cy+py)/2; ctx.translate(mx,my-10); ctx.fillText("r = 1",0,0); ctx.restore();
    ctx.fillStyle=ink; ctx.font="bold 14px "+(s.mono||"monospace"); ctx.textAlign="left";
    const s2=co*co+si*si;
    ctx.fillText("cos\u00b2\u03b8 + sin\u00b2\u03b8 = "+fmt(co*co)+" + "+fmt(si*si)+" = "+fmt(s2), 16, 26);
    if(cap) cap.textContent="The point (cos \u03b8, sin \u03b8) sits distance 1 from the centre, so Pythagoras on the shaded right triangle gives cos\u00b2\u03b8 + sin\u00b2\u03b8 = 1.";
  }


  function drawFrame(ctx,t,d){ if(!d) return; drawIdent(d, (t<0.7? t/0.7 : 1)); }

  ["pi-mode","pi-ang","pi-ratio","pi-val","pi-quad"].forEach(id=>{ const el=$(id); if(!el) return; el.addEventListener("input",update); el.addEventListener("change",update); });
  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawDiagram(last); });
  styleFields();  update();
})();
</script>
