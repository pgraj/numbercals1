<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>Solve for
      <span class="nc-field">
        <select id="pt-solve">
          <option value="c" selected>Hypotenuse c</option>
          <option value="a">Leg a</option>
          <option value="b">Leg b</option>
        </select>
      </span>
    </label>
    <label id="pt-lab-a">Leg a
      <span class="nc-field"><input id="pt-a" type="number" value="3" step="any"></span>
    </label>
    <label id="pt-lab-b">Leg b
      <span class="nc-field"><input id="pt-b" type="number" value="4" step="any"></span>
    </label>
    <label id="pt-lab-c">Hypotenuse c
      <span class="nc-field"><input id="pt-c" type="number" value="5" step="any"></span>
    </label>
  </div>

  <div class="viz-out" id="pt-out"></div>

  <canvas id="pt-diagram" width="640" height="300"
          style="display:block;width:100%;height:auto;max-width:520px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="pt-cap"
     style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>

  <p class="viz-disclaimer" id="pt-disc"
     style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
/* Explanation cards — standard NumberCals pattern (theme-aware). */
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
/* Compute + NCLearn wiring for trig-pythagoras. */
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$("pt-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function syncInputs(){
    // Show only the two inputs that are needed for the chosen unknown.
    const solve = $("pt-solve").value;
    $("pt-lab-a").style.display = (solve === "a") ? "none" : "";
    $("pt-lab-b").style.display = (solve === "b") ? "none" : "";
    $("pt-lab-c").style.display = (solve === "c") ? "none" : "";
  }

  async function update(){
    syncInputs();
    const body = {
      a: $("pt-a").value, b: $("pt-b").value, c: $("pt-c").value,
      solve_for: $("pt-solve").value
    };
    let data;
    try {
      const r = await fetch("/api/compute/"+slug, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(body)
      });
      data = await r.json();
    } catch(e){ $("pt-out").textContent="compute error"; return; }

    try { if(window.NCSteps) window.NCSteps.render(data.steps || []); } catch(e){}
    if (data.disclaimer) $("pt-disc").textContent = "⚠ " + data.disclaimer;

    if (data.error){
      $("pt-out").innerHTML = "<b>"+data.error+"</b>";
      try{ if(window.__ncExplain) window.__ncExplain([]); }catch(e){}
      drawDiagram(null);
      last = null;
      // Still mount so the Steps toggle exists; no animation without valid data.
      mountLearn(null);
      return;
    }

    $("pt-out").innerHTML = "<b>"+data.result_label+" = "+data.result+"</b>";
    try{ if(window.__ncExplain) window.__ncExplain(data.explanation); }catch(e){}
    drawDiagram(data);
    last = data;
    mountLearn(data);
  }

  /* Static labelled diagram: right angle at B, legs AB and BC, hypotenuse AC.
     Always visible (independent of the Steps/Animation toggle). Theme-aware. */
  function drawDiagram(d){
    const cv = $("pt-diagram"); if(!cv) return;
    const ctx = cv.getContext("2d");
    const s = window.NCSkin || {};
    const ink = s.ink || "#222", accent = s.accent || "#b5651d";
    const yes = s.yes || "#3a7d44", soft = s.inkSoft || "#777", rule = s.rule || "#ccc";
    const W = cv.width, H = cv.height;
    ctx.clearRect(0,0,W,H);
    const cap = $("pt-cap");
    if(!d){ if(cap) cap.textContent = ""; return; }

    const a = d.a, b = d.b, c = d.c;
    // Right angle at B. Place B at lower-left; A above B (leg AB = b),
    // C to the right of B (leg BC = a). Hypotenuse AC is then the slope.
    const pad = 64;
    const maxW = W - pad*2, maxH = H - pad*2;
    const u = Math.min(maxW / Math.max(a,1), maxH / Math.max(b,1));
    const Bx = pad, By = H - pad;          // right-angle corner
    const Cx = Bx + a*u, Cy = By;          // along +x, leg BC = a
    const Ax = Bx, Ay = By - b*u;          // along -y, leg AB = b

    // Triangle fill (subtle) + outline.
    ctx.beginPath();
    ctx.moveTo(Ax,Ay); ctx.lineTo(Bx,By); ctx.lineTo(Cx,Cy); ctx.closePath();
    ctx.globalAlpha = 0.10; ctx.fillStyle = accent; ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = 1.5;
    // Legs in ink, hypotenuse highlighted.
    seg(ctx, Ax,Ay, Bx,By, ink);          // AB (leg b)
    seg(ctx, Bx,By, Cx,Cy, ink);          // BC (leg a)
    seg(ctx, Ax,Ay, Cx,Cy, yes);          // AC (hypotenuse)

    // Right-angle square at B.
    ctx.strokeStyle = soft; ctx.lineWidth = 1;
    const m = 13;
    ctx.strokeRect(Bx, By - m, m, m);

    // Vertex dots + labels A, B, C.
    ctx.font = "bold 15px " + (s.serif || s.sans || "serif");
    label(ctx, Ax, Ay, "A", -6, -10, ink);
    label(ctx, Bx, By, "B", -16, 18, ink);
    label(ctx, Cx, Cy, "C", 8, 18, ink);

    // Side names + lengths.
    ctx.font = "13px " + (s.sans || "sans-serif");
    ctx.fillStyle = soft;
    // AB (left, vertical) = b
    ctx.save(); ctx.translate(Ax - 14, (Ay+By)/2); ctx.rotate(-Math.PI/2);
    ctx.textAlign = "center"; ctx.fillText("AB = "+fmt(b), 0, 0); ctx.restore();
    // BC (bottom, horizontal) = a
    ctx.textAlign = "center";
    ctx.fillText("BC = "+fmt(a), (Bx+Cx)/2, By + 22);
    // AC (hypotenuse) = c, highlighted
    ctx.fillStyle = yes;
    ctx.save();
    const mx = (Ax+Cx)/2, my = (Ay+Cy)/2;
    const ang = Math.atan2(Cy-Ay, Cx-Ax);
    ctx.translate(mx, my); ctx.rotate(ang);
    ctx.textAlign = "center"; ctx.fillText("AC = "+fmt(c)+"  (hypotenuse)", 0, -8);
    ctx.restore();

    if(cap) cap.textContent =
      "AC is the hypotenuse (opposite the right angle at B); AB and BC are the two legs.";
  }
  function seg(ctx, x1,y1,x2,y2, col){
    ctx.strokeStyle = col; ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  function label(ctx, x,y, t, dx,dy, col){
    ctx.fillStyle = col; ctx.beginPath();
    ctx.arc(x,y,3,0,Math.PI*2); ctx.fill();
    ctx.textAlign = "center"; ctx.fillText(t, x+dx, y+dy);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({
      slug: slug,
      panel: panel,
      data: data,
      // Animation only meaningful with valid a,b,c.
      drawFrame: (data ? drawFrame : undefined)
    });
  }

  /* Animation: draw the right triangle, then grow the two small squares
     (on legs a,b) and the large square (on hypotenuse c). Over the loop the
     two small squares "fill" and a tally shows a^2 + b^2 matching c^2. */
  function drawFrame(ctx, t, d){
    const s = window.NCSkin || {};
    const ink = s.ink || "#222", accent = s.accent || "#b5651d";
    const yes = s.yes || "#3a7d44", soft = s.inkSoft || "#777", rule = s.rule || "#ccc";
    const W = 640, H = 320;
    if (!d) return;
    const a = d.a, b = d.b, c = d.c;
    // Scale so the triangle + its three squares fit the canvas.
    const span = Math.max(a, b) + Math.max(a, b); // room for squares on legs
    const unit = Math.min((W*0.5)/(a + a), (H*0.5)/(b + b), 26/Math.max(1, Math.max(a,b)/4));
    const u = Math.max(6, Math.min(38, 150/Math.max(a,b,1)));
    // Triangle vertices (right angle at origin Pt0).
    const ox = 210, oy = 210;            // right-angle corner
    const Ax = ox, Ay = oy;              // right angle
    const Bx = ox + a*u, By = oy;        // along +x (leg a)
    const Cx = ox, Cy = oy - b*u;        // along -y (leg b)

    // Square on leg a (below the base).
    ctx.lineWidth = 1.5;
    drawSquare(ctx, ox, oy, a*u, "down", accent, fade(0.05, 0.45, t), rule);
    // Square on leg b (to the left).
    drawSquare(ctx, ox, oy, b*u, "left", accent, fade(0.45, 0.85, t), rule);
    // Square on hypotenuse — drawn outward from the hypotenuse.
    drawHypSquare(ctx, Bx, By, Cx, Cy, yes, fade(0.55, 1.0, t), rule);

    // Triangle on top.
    ctx.strokeStyle = ink; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(Ax, Ay); ctx.lineTo(Bx, By); ctx.lineTo(Cx, Cy); ctx.closePath();
    ctx.stroke();
    // Right-angle marker.
    ctx.strokeStyle = soft; ctx.lineWidth = 1;
    ctx.strokeRect(ox, oy - 12, 12, 12);

    // Labels.
    ctx.fillStyle = ink; ctx.font = "13px " + (s.sans || "sans-serif");
    ctx.textAlign = "center";
    ctx.fillText("a = " + fmt(a), (Ax+Bx)/2, oy + 18);
    ctx.save(); ctx.translate(ox - 16, (Ay+Cy)/2); ctx.rotate(-Math.PI/2);
    ctx.fillText("b = " + fmt(b), 0, 0); ctx.restore();
    ctx.fillStyle = (d.solved === "c") ? yes : ink;
    ctx.fillText("c = " + fmt(c), (Bx+Cx)/2 + 18, (By+Cy)/2 - 8);

    // Running tally of the identity.
    ctx.textAlign = "left"; ctx.font = "14px " + (s.mono || "monospace");
    ctx.fillStyle = soft;
    ctx.fillText(fmt(a)+"² + "+fmt(b)+"² = "+fmt(a*a)+" + "+fmt(b*b), 24, 28);
    ctx.fillStyle = yes;
    ctx.fillText("= "+fmt(a*a + b*b)+" = c²   (c = "+fmt(c)+")", 24, 50);
  }

  function fade(start, end, t){
    if (t <= start) return 0;
    if (t >= end) return 1;
    return (t - start) / (end - start);
  }
  function drawSquare(ctx, ox, oy, side, dir, stroke, fill, rule){
    let x = ox, y = oy;
    if (dir === "down") { y = oy; ctx.save(); ctx.beginPath();
      ctx.rect(ox, oy, side, side); }
    else if (dir === "left") { ctx.save(); ctx.beginPath();
      ctx.rect(ox - side, oy - side, side, side); }
    ctx.strokeStyle = rule; ctx.lineWidth = 1; ctx.stroke();
    ctx.globalAlpha = 0.28 * fill;
    ctx.fillStyle = stroke; ctx.fill();
    ctx.globalAlpha = 1; ctx.restore();
  }
  function drawHypSquare(ctx, x1, y1, x2, y2, stroke, fill, rule){
    // Build a square outward on the hypotenuse from (x1,y1)->(x2,y2).
    const dx = x2 - x1, dy = y2 - y1;
    // Outward normal (away from the right-angle corner).
    const nx = dy, ny = -dx;
    const p1 = {x:x1, y:y1}, p2 = {x:x2, y:y2};
    const p3 = {x:x2 + nx, y:y2 + ny}, p4 = {x:x1 + nx, y:y1 + ny};
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath();
    ctx.strokeStyle = rule; ctx.lineWidth = 1; ctx.stroke();
    ctx.globalAlpha = 0.30 * fill; ctx.fillStyle = stroke; ctx.fill();
    ctx.globalAlpha = 1; ctx.restore();
  }
  function fmt(x){
    if (Math.abs(x - Math.round(x)) < 1e-9) return String(Math.round(x));
    return (Math.round(x*10000)/10000).toString();
  }

  ["pt-a","pt-b","pt-c","pt-solve"].forEach(id=>{
    const el=$(id);
    el.addEventListener("input", update);
    el.addEventListener("change", update);
  });
  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", function(){ if(last) drawDiagram(last); });
  styleFields(); syncInputs(); update();
})();
</script>
