<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>Shedding frequency f (Hz)
      <span class="nc-field"><input id="dn-f" type="number" value="20" step="any"></span>
    </label>
    <label>Characteristic length L (m)
      <span class="nc-field"><input id="dn-L" type="number" value="0.1" step="any"></span>
    </label>
    <label>Flow velocity v (m/s)
      <span class="nc-field"><input id="dn-v" type="number" value="10" step="any"></span>
    </label>
  </div>
  <div class="viz-out" id="viz-out"></div>
  <canvas id="dn-chart" width="640" height="170"
          style="margin-top:14px;width:100%;height:auto;max-width:640px"></canvas>
  <p class="viz-caption" id="dn-cap" style="font-size:.9rem;margin-top:.5rem;opacity:.85"></p>
  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="dn-disc"
     style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>
<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $("dn-chart"), ctx = cv.getContext("2d");
  const IDS = ["f", "L", "v"];
  let last = null;
  function styleFields(){
    const panel = document.querySelector('.viz-panel[data-slug="{{ calc.slug }}"]');
    if(!panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$("dn-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }
  function regimeColour(i,n){ const h = 140 - i*(132/Math.max(1,n-1)); return `hsl(${h} 60% 52%)`; }
  async function update(){
    const body = {};
    IDS.forEach(p => body[p] = +$("dn-"+p).value);
    let data;
    try { const r=await fetch("/api/compute/{{ calc.slug }}",{method:"POST",
            headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
          data=await r.json(); }
    catch(e){ $("viz-out").textContent="compute error"; return; }
    try { if (window.NCSteps) window.NCSteps.render(data.steps || []); } catch(e){}
    if (data.disclaimer) $("dn-disc").textContent = "⚠ " + data.disclaimer;
    if (data.error){ $("viz-out").innerHTML="<b>"+data.error+"</b>"; ctx.clearRect(0,0,cv.width,cv.height); last=null; return; }
    const r=data.result;
    const shown=(Math.abs(r)>=1e6||Math.abs(r)<1e-4)? r.toExponential(4):(Math.round(r*1e4)/1e4);
    $("viz-out").innerHTML = `${data.symbol} = <b>${shown}</b> · <span style="color:${NCSkin.accent}">${data.regime}</span>`;
    try{ if(window.__ncExplain) window.__ncExplain(data.explanation); }catch(e){}
    last=data; draw(data);
  }

  function draw(d){
    ctx.clearRect(0,0,cv.width,cv.height);
    const W=cv.width,H=cv.height,padL=20,padR=20,trackY=H-52;
    const regs=d.regimes||[]; const n=regs.length;
    const bounds=[]; regs.forEach(r=>{ if(r.lo!=null)bounds.push(r.lo); if(r.hi!=null)bounds.push(r.hi); });
    const hi=Math.max(d.value*1.4,(bounds.length?Math.max.apply(null,bounds):1)*1.4,0.5);
    const x=v=>padL+(Math.max(0,Math.min(hi,v))/hi)*(W-padL-padR);
    regs.forEach((r,i)=>{
      const a=r.lo==null?0:r.lo,b=r.hi==null?hi:r.hi;
      ctx.fillStyle=regimeColour(i,n); ctx.fillRect(x(a),trackY-7,Math.max(1,x(b)-x(a)),14);
      ctx.fillStyle=NCSkin.ink; ctx.font="10px "+(NCSkin.sans||"sans-serif"); ctx.textAlign="center";
      ctx.save(); ctx.translate((x(a)+x(b))/2,trackY+14); ctx.rotate(-Math.PI/12);
      ctx.fillText(r.label, 0, 6); ctx.restore();
    });
    const xx=x(d.value);
    ctx.beginPath(); ctx.arc(xx,trackY,9,0,2*Math.PI); ctx.fillStyle=NCSkin.accent; ctx.fill();
    ctx.fillStyle=NCSkin.ink; ctx.textAlign="center";
    ctx.fillText(d.symbol+" "+(Math.round(d.value*1e4)/1e4), xx, trackY-16);
    ctx.textAlign="left"; ctx.fillStyle=NCSkin.inkSoft; ctx.font="11px "+(NCSkin.sans||"sans-serif");
    ctx.fillText("vortex-shedding risk scale", padL, 14);
  }

  IDS.forEach(p=>{ const el=$("dn-"+p); el.addEventListener("input",update); el.addEventListener("change",update); });
  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) draw(last); });
  styleFields(); update();
})();
</script>
