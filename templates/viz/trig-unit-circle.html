<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div style="margin-bottom:10px">{% include "_angle_unit.html" %}</div>
  <div class="viz-inputs">
    <label><span style="display:block;white-space:nowrap">Angle &theta; <span id="uc-unit-lbl" style="opacity:.7">(deg)</span></span>
      <span class="nc-field" style="display:block"><input id="uc-deg" type="number" value="60" step="any"></span>
    </label>
    <label>Drag
      <span class="nc-field"><input id="uc-range" type="range" value="60" min="0" max="360" step="1" style="width:200px"></span>
    </label>
  </div>

  <div class="viz-out" id="uc-out"></div>

  <canvas id="uc-diagram" width="640" height="360"
          style="display:block;width:100%;height:auto;max-width:560px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="uc-cap" style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="uc-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script src="/static/ncangle.js"></script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      if(el.type==="range") return;
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$("uc-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function unit(){ return (window.NCAngle ? NCAngle.current() : "deg"); }

  async function update(){
    const body = { angle_deg: $("uc-deg").value, angle_unit: unit() };
    let data;
    try { const r=await fetch("/api/compute/"+slug,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $("uc-out").textContent="compute error"; return; }
    try { if(window.NCSteps) window.NCSteps.render(data.steps||[]); } catch(e){}
    if (data.disclaimer) $("uc-disc").textContent="\u26a0 "+data.disclaimer;
    if (data.error){ $("uc-out").innerHTML="<b>"+data.error+"</b>"; try{window.__ncExplain([]);}catch(e){} drawAt(null,0); last=null; mountLearn(null); return; }
    $("uc-out").innerHTML="<b>(cos θ, sin θ) = "+data.result+"</b>  ·  "+data.quadrant;
    try{ window.__ncExplain(data.explanation);}catch(e){}
    last=data; drawAt(data, data.angle_norm); mountLearn(data);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({ slug:slug, panel:panel, data:data, drawFrame:(data?drawFrame:undefined) });
  }

  // Geometry: circle centred left-of-middle so labels have room on the right.
  function drawAt(d, angDeg){
    const cv=$("uc-diagram"); if(!cv) return;
    const ctx=cv.getContext("2d"); const s=window.NCSkin||{};
    const ink=s.ink||"#222", accent=s.accent||"#b5651d", yes=s.yes||"#3a7d44",
          soft=s.inkSoft||"#777", rule=s.rule||"#ccc";
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H);
    const cx=240, cy=H/2, R=140;
    // axes
    ctx.strokeStyle=rule; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cx-R-20,cy); ctx.lineTo(cx+R+20,cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx,cy-R-20); ctx.lineTo(cx,cy+R+20); ctx.stroke();
    // circle
    ctx.strokeStyle=soft; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
    const cap=$("uc-cap");
    if(!d){ if(cap) cap.textContent=""; return; }
    const th=angDeg*Math.PI/180;
    const px=cx+Math.cos(th)*R, py=cy-Math.sin(th)*R;
    // sin projection (vertical, green) and cos projection (horizontal, accent)
    ctx.strokeStyle=accent; ctx.lineWidth=2;            // cos: from origin along x to foot
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,cy); ctx.stroke();
    ctx.strokeStyle=yes; ctx.lineWidth=2;               // sin: from foot up to point
    ctx.beginPath(); ctx.moveTo(px,cy); ctx.lineTo(px,py); ctx.stroke();
    // radius (hypotenuse) to the point
    ctx.strokeStyle=ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px,py); ctx.stroke();
    // angle arc
    ctx.strokeStyle=ink; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(cx,cy,26,0,-th,true); ctx.stroke();
    // moving point
    ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(px,py,5,0,Math.PI*2); ctx.fill();
    // labels
    ctx.font="13px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillStyle=accent; ctx.fillText("cos θ = "+fmt(d.cos), (cx+px)/2, cy+(Math.sin(th)>=0?16:-8));
    ctx.fillStyle=yes; ctx.save(); ctx.translate(px+(Math.cos(th)>=0?14:-14),(cy+py)/2); ctx.rotate(-Math.PI/2); ctx.fillText("sin θ = "+fmt(d.sin),0,0); ctx.restore();
    ctx.fillStyle=ink; ctx.font="bold 13px "+(s.sans||"sans-serif"); ctx.textAlign="left";
    var angLbl = (unit()==="rad") ? (fmt(angDeg*Math.PI/180)+" rad") : (fmt(angDeg)+"\u00b0");
    ctx.fillText("\u03b8="+angLbl, cx+30, cy-6);
    // readout panel on the right
    let rx=430, ry=cy-90;
    ctx.textAlign="left"; ctx.font="14px "+(s.mono||"monospace");
    ctx.fillStyle=accent; ctx.fillText("cos θ = "+fmt(d.cos), rx, ry);
    ctx.fillStyle=yes; ctx.fillText("sin θ = "+fmt(d.sin), rx, ry+24);
    ctx.fillStyle=soft; ctx.fillText("tan θ = "+(d.tan===null||d.tan===undefined?"undefined":fmt(d.tan)), rx, ry+48);
    ctx.fillStyle=ink; ctx.font="13px "+(s.sans||"sans-serif"); ctx.fillText("point ("+fmt(d.cos)+", "+fmt(d.sin)+")", rx, ry+78);
    if(cap) cap.textContent="The radius is the hypotenuse (length 1); the horizontal leg is cos θ, the vertical leg is sin θ.";
  }

  // Animation: sweep the point all the way around the circle.
  function drawFrame(ctx, t, d){
    if(!d) return;
    drawAt(d, t*360);
  }

  function fmt(x){ if(x===null||x===undefined) return ""; return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*10000)/10000).toString(); }

  // The range slider always works in degrees (0–360). The number field shows
  // the chosen unit, so convert between them as needed.
  function fieldToDeg(){
    const v = +$("uc-deg").value || 0;
    return (unit()==="rad") ? v*180/Math.PI : v;
  }
  function syncDeg(){ const d=Math.max(0,Math.min(360,Math.round(fieldToDeg()))); $("uc-range").value=d; }
  function syncRange(){
    const d = +$("uc-range").value;
    $("uc-deg").value = (unit()==="rad") ? +(d*Math.PI/180).toFixed(4) : d;
  }

  function syncUnitLabel(){
    $("uc-unit-lbl").textContent = (unit()==="rad") ? "(rad)" : "(deg)";
  }

  $("uc-deg").addEventListener("input", ()=>{ syncDeg(); update(); });
  $("uc-range").addEventListener("input", ()=>{ syncRange(); update(); });

  if(window.NCAngle){
    NCAngle.onChange(function(newUnit){
      const v = parseFloat($("uc-deg").value);
      if(!isNaN(v)){
        if(newUnit==="rad") $("uc-deg").value = +(v*Math.PI/180).toFixed(4);  // was deg
        else                $("uc-deg").value = +(v*180/Math.PI).toFixed(4);  // was rad
      }
      syncUnitLabel(); update();
    });
  }

  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawAt(last, last.angle_norm); });
  styleFields(); syncUnitLabel(); syncDeg(); update();
})();
</script>
