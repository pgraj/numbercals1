{# Linear ax + b = 0. Slope triangle + root marker + caption. Feeds steps panel. #}
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>a<input id="in-a" type="number" value="2" step="0.5"></label>
    <label>b<input id="in-b" type="number" value="-6" step="0.5"></label>
  </div>
  <div class="viz-out" id="viz-out"></div>
  <canvas id="lin-chart" width="640" height="380" style="margin-top:14px;max-width:100%"></canvas>
  <p class="viz-caption" id="lin-caption" style="font-size:.9rem;line-height:1.5;margin-top:.5rem;opacity:.85"></p>
</div>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $("lin-chart"), ctx = cv.getContext("2d");

  async function update(){
    const body = { a:+$("in-a").value, b:+$("in-b").value };
    let data;
    try {
      const r = await fetch("/api/compute/{{ calc.slug }}", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(body)});
      data = await r.json();
    } catch(e){ $("viz-out").textContent = "compute error"; return; }

    if (window.NCSteps) window.NCSteps.render(data.steps || []);

    if (data.error){ $("viz-out").innerHTML = "<b>"+data.error+"</b>"; $("lin-caption").textContent=""; ctx.clearRect(0,0,cv.width,cv.height); return; }
    const a=$("in-a").value, b=$("in-b").value;
    $("viz-out").innerHTML = `${a}x + (${b}) = 0 &nbsp;→&nbsp; x = <b>${data.root}</b>`;
    $("lin-caption").innerHTML =
      `The root <b>${data.root}</b> is where the line crosses the x-axis (y = 0). ` +
      `The slope <b>${a}</b> is the rise-over-run triangle: for every step right, ` +
      `y changes by ${a}.`;
    draw(data);
  }

  function draw(d){
    ctx.clearRect(0,0,cv.width,cv.height);
    const pad=44, W=cv.width-2*pad, H=cv.height-2*pad;
    const pts=d.series; if(!pts||pts.length<2) return;
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    const xMin=Math.min(...xs), xMax=Math.max(...xs);
    let yMin=Math.min(...ys,0), yMax=Math.max(...ys,0);
    if(yMin===yMax){ yMin-=1; yMax+=1; }
    const X=x=>pad+((x-xMin)/(xMax-xMin))*W;
    const Y=y=>pad+H-((y-yMin)/(yMax-yMin))*H;

    ctx.strokeStyle=NCSkin.rule; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(pad,Y(0)); ctx.lineTo(pad+W,Y(0)); ctx.stroke();
    if(xMin<0 && xMax>0){ ctx.beginPath(); ctx.moveTo(X(0),pad); ctx.lineTo(X(0),pad+H); ctx.stroke(); }

    ctx.strokeStyle=NCSkin.accent; ctx.lineWidth=2.5; ctx.beginPath();
    pts.forEach((p,i)=> i?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));
    ctx.stroke();

    const a=d.slope, rx=d.root;
    ctx.strokeStyle=NCSkin.inkSoft; ctx.lineWidth=1.5; ctx.setLineDash([4,3]);
    ctx.beginPath();
    ctx.moveTo(X(rx),Y(0)); ctx.lineTo(X(rx+1),Y(0)); ctx.lineTo(X(rx+1),Y(a)); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=NCSkin.inkSoft; ctx.font="11px "+(NCSkin.mono||"monospace");
    ctx.fillText("run 1", (X(rx)+X(rx+1))/2-12, Y(0)+14);
    ctx.fillText("rise "+a, X(rx+1)+4, (Y(0)+Y(a))/2);

    ctx.fillStyle=NCSkin.yes;
    ctx.beginPath(); ctx.arc(X(rx),Y(0),6,0,2*Math.PI); ctx.fill();
    ctx.fillStyle=NCSkin.ink; ctx.font="13px "+(NCSkin.mono||"monospace");
    ctx.fillText("x = "+rx, X(rx)+9, Y(0)-9);
  }

  ["in-a","in-b"].forEach(id=>$(id).addEventListener("input", update));
  window.addEventListener("nc-theme-change", update);
  update();
})();
</script>
