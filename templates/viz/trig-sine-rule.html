<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div style="margin-bottom:10px">{% include "_angle_unit.html" %}</div>
  <div class="viz-inputs">
    <label>Find
      <span class="nc-field"><select id="sr-mode"><option value="side" selected>A side</option><option value="angle">An angle</option></select></span></label>
    <label>Known side
      <span class="nc-field"><input id="sr-ks" type="number" value="7" step="any"></span></label>
    <label><span style="display:block;white-space:nowrap">Its opposite angle <span class="sr-unit-lbl" style="opacity:.7">(deg)</span></span>
      <span class="nc-field" style="display:block"><input id="sr-ka" type="number" value="30" step="any"></span></label>
    <label id="sr-oa-l"><span style="display:block;white-space:nowrap">Angle opposite wanted side <span class="sr-unit-lbl" style="opacity:.7">(deg)</span></span>
      <span class="nc-field" style="display:block"><input id="sr-oa" type="number" value="45" step="any"></span></label>
    <label id="sr-os-l">Other side
      <span class="nc-field"><input id="sr-os" type="number" value="5" step="any"></span></label>
  </div>

  <div class="viz-out" id="sr-out"></div>

  <canvas id="sr-diagram" width="680" height="420"
          style="display:block;width:100%;height:auto;max-width:600px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="sr-cap" style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="sr-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script src="/static/ncangle.js"></script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const P = "sr";
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      if(el.type==="range") return;
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$(P+"-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function unit(){ return (window.NCAngle ? NCAngle.current() : "deg"); }

  function buildBody(){
    return { mode:$("sr-mode").value, known_side:$("sr-ks").value, known_angle:$("sr-ka").value, other_angle:$("sr-oa").value, other_side:$("sr-os").value, angle_unit:unit() };
  }

  async function update(){
    
    const body = buildBody();
    let data;
    try { const r=await fetch("/api/compute/"+slug,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $(P+"-out").textContent="compute error"; return; }
    try { if(window.NCSteps) window.NCSteps.render(data.steps||[]); } catch(e){}
    if (data.disclaimer) $(P+"-disc").textContent="\u26a0 "+data.disclaimer;
    if (data.error){ $(P+"-out").innerHTML="<b>"+data.error+"</b>"; try{window.__ncExplain([]);}catch(e){} drawDiagram(null); last=null; mountLearn(null); return; }
    $(P+"-out").innerHTML = (data.mode==='side'? ('<b>b = '+data.result+'</b>') : ('<b>B = '+data.result+'</b>'+(data.alt_angle!==undefined?('  (or '+fmt(data.alt_angle)+'\u00b0)'):'')));
    try{ window.__ncExplain(data.explanation);}catch(e){}
    last=data; drawDiagram(data); mountLearn(data);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({ slug:slug, panel:panel, data:data, drawFrame:(data?drawFrame:undefined) });
  }

  function fmt(x){ if(x===null||x===undefined) return ""; return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*10000)/10000).toString(); }

  // Shared auto-fit: given natural-coordinate points [{x,y},...] and the canvas,
  // return a mapper m(p)->{x,y} that centres and scales them to fill the box
  // (minus margin) so NOTHING ever clips, whatever the inputs. Y is flipped so
  // positive-y is up in natural coords. Returns {map, scale}.
  function fitPts(pts, W, H, margin){
    margin = margin || 48;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    pts.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
    const spanX=Math.max(1e-6,maxX-minX), spanY=Math.max(1e-6,maxY-minY);
    const sc=Math.min((W-2*margin)/spanX, (H-2*margin)/spanY);
    const cxN=(minX+maxX)/2, cyN=(minY+maxY)/2;
    const map=(p)=>({ x: W/2 + (p.x-cxN)*sc, y: H/2 - (p.y-cyN)*sc });
    return { map, scale:sc };
  }


  function drawTri(d){
    const cv=$(P+"-diagram"); if(!cv) return; const ctx=cv.getContext("2d"); const s=window.NCSkin||{};
    const ink=s.ink||"#222", accent=s.accent||"#b50", yes=s.yes||"#3a7", soft=s.inkSoft||"#777";
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H); const cap=$(P+"-cap");
    if(!d){ if(cap) cap.textContent=""; return; }
    let A=d.A, B=(d.B!==undefined?d.B:45); const C=180-A-B;
    if(C<=0){ if(cap) cap.textContent="Angle sum invalid."; return; }
    // natural triangle: base c=1 along x; left vertex angle A, right vertex angle B.
    const Ar=A*Math.PI/180, Br=B*Math.PI/180;
    const c=1, apexX = c*Math.tan(Br)/(Math.tan(Ar)+Math.tan(Br));
    const apexY = apexX*Math.tan(Ar);
    const Vl={x:0,y:0}, Vr={x:c,y:0}, Ap={x:apexX,y:apexY};
    const fit=fitPts([Vl,Vr,Ap],W,H,56); const mL=fit.map(Vl), mR=fit.map(Vr), mA=fit.map(Ap);
    ctx.strokeStyle=ink; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(mL.x,mL.y); ctx.lineTo(mR.x,mR.y); ctx.lineTo(mA.x,mA.y); ctx.closePath(); ctx.stroke();
    ctx.fillStyle=accent; ctx.font="13px "+(s.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText("A="+fmt(A)+"\u00b0", mL.x+24, mL.y-6);
    ctx.fillText("B="+fmt(B)+"\u00b0", mR.x-24, mR.y-6);
    ctx.fillStyle=ink; ctx.fillText("C="+fmt(C)+"\u00b0", mA.x, mA.y-8);
    ctx.fillStyle=soft; ctx.fillText("a (opp A)", (mR.x+mA.x)/2+20, (mR.y+mA.y)/2);
    ctx.fillStyle=yes; ctx.fillText("b (opp B)", (mL.x+mA.x)/2-20, (mL.y+mA.y)/2);
    if(cap) cap.textContent="Each side pairs with the angle opposite it; the sine rule keeps those ratios equal. Auto-scaled to fit.";
  }
  function drawDiagram(d){ drawTri(d); }


  function drawFrame(ctx,t,d){ if(!d) return; drawTri(d); }

  function syncUnitLabel(){
    const t = (unit()==="rad") ? "(rad)" : "(deg)";
    document.querySelectorAll(".sr-unit-lbl").forEach(el=>{ el.textContent = t; });
  }

  function syncMode(){ const m=$("sr-mode").value; $("sr-oa-l").style.display=(m==="side")?"":"none"; $("sr-os-l").style.display=(m==="angle")?"":"none"; }
  ["sr-mode","sr-ks","sr-ka","sr-oa","sr-os"].forEach(id=>{ const el=$(id); el.addEventListener("input",()=>{syncMode();update();}); el.addEventListener("change",()=>{syncMode();update();}); });

  if(window.NCAngle){
    NCAngle.onChange(function(newUnit){
      ["sr-ka","sr-oa"].forEach(id=>{
        const v = parseFloat($(id).value);
        if(!isNaN(v)){
          if(newUnit==="rad") $(id).value = +(v*Math.PI/180).toFixed(4);
          else                $(id).value = +(v*180/Math.PI).toFixed(4);
        }
      });
      syncUnitLabel(); update();
    });
  }

  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawDiagram(last); });
  styleFields(); syncMode(); syncUnitLabel(); update();
})();
</script>
