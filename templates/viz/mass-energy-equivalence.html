<div class="viz-panel" data-slug="{{ calc.slug }}">

  <div class="viz-inputs" style="align-items:flex-start;gap:40px;flex-wrap:wrap">
    <label>
      <span style="display:block;white-space:nowrap">Solve for</span>
      <span class="nc-field" style="display:block">
        <select id="mc-solve" style="width:140px">
          <option value="energy" selected>Energy</option>
          <option value="mass">Mass</option>
        </select>
      </span>
    </label>
    <label id="mc-l-mass">
      <span style="display:block;white-space:nowrap">Mass m (kg)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="mc-mass" value="0.001" step="any" style="width:140px">
      </span>
    </label>
    <label id="mc-l-energy" style="display:none">
      <span style="display:block;white-space:nowrap">Energy E (J)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="mc-energy" value="8.98755e13" step="any" style="width:160px">
      </span>
    </label>
  </div>

  <canvas id="mc-canvas" width="640" height="320"
          style="display:block;width:100%;height:auto;max-width:560px;margin:8px auto 0"></canvas>
  <p class="viz-caption" id="mc-cap"
     style="font-size:.9rem;margin-top:.5rem;opacity:.85;text-align:center"></p>

  <p class="viz-law" id="mc-law"
     style="font-size:.86rem;margin-top:.4rem;line-height:1.5;text-align:center"></p>

  <div class="viz-out" id="viz-out" style="margin-top:10px"></div>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="mc-disc"
     style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<div class="nc-learn3" id="mc-learn3" role="group" aria-label="Answer detail"
     style="display:inline-flex;border-radius:8px;overflow:hidden;margin:12px 0 6px">
  <button type="button" data-mode="direct" class="active" aria-pressed="true">Direct answer</button>
  <button type="button" data-mode="steps" aria-pressed="false">Step-by-step working</button>
  <button type="button" data-mode="anim" aria-pressed="false">Animation</button>
</div>

<div id="mc-anim-controls" style="display:none;margin:2px 0 6px">
  <button type="button" id="mc-play" style="cursor:pointer;border-radius:6px;padding:4px 12px">&#9654; Play</button>
  <p id="mc-anim-note" style="font-size:.82rem;margin:6px 0 0;opacity:.8;max-width:560px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $("mc-canvas"), ctx = cv.getContext("2d");
  const SLUG = "{{ calc.slug }}";
  let last = null;

  function S(){ return window.NCSkin || {}; }
  function fmt(x){
    if(x===null||x===undefined||isNaN(x)) return "";
    if(Math.abs(x)>=1e-3 && Math.abs(x)<1e7){
      if(Math.abs(x-Math.round(x))<1e-9) return String(Math.round(x));
      return (Math.round(x*10000)/10000).toString();
    }
    if(x===0) return "0";
    const exp=Math.floor(Math.log10(Math.abs(x)));
    const mant=x/Math.pow(10,exp);
    return (Math.round(mant*1000)/1000)+"\u00d710^"+exp;
  }

  function renderLaw(d){
    const el=$("mc-law"); if(!el) return;
    if(!d || !d.law_statement){ el.innerHTML=""; return; }
    const sk=window.NCSkin||{};
    let html='<b>What this states:</b> '+d.law_statement;
    if(d.law_source_url && d.law_source_name){
      html+=' <a href="'+d.law_source_url+'" target="_blank" rel="noopener">'+d.law_source_name+'</a>';
    }
    el.innerHTML=html;
    el.style.color=sk.inkSoft||"";
    el.querySelectorAll("b").forEach(b=>{ b.style.color=sk.ink||""; });
    el.querySelectorAll("a").forEach(a=>{ a.style.color=sk.accent||""; });
  }

  function styleFields(){
    const panel = document.querySelector('.viz-panel[data-slug="'+SLUG+'"]');
    if(!panel||!window.NCSkin) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const n=$("mc-anim-note"); if(n) n.style.color=NCSkin.inkSoft;
    const d=$("mc-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function syncFields(){
    const sf=$("mc-solve").value;
    $("mc-l-mass").style.display   = (sf==="energy") ? "" : "none";
    $("mc-l-energy").style.display = (sf==="mass") ? "" : "none";
  }

  async function update(){
    const sf=$("mc-solve").value;
    const body={ solve_for:sf,
      mass:parseFloat($("mc-mass").value),
      energy:parseFloat($("mc-energy").value) };
    let data;
    try{
      const r=await fetch("/api/compute/"+SLUG,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      data=await r.json();
    }catch(e){ $("viz-out").textContent="compute error"; return; }
    try{ if(window.NCSteps) NCSteps.render(data.steps||[]); }catch(e){}
    if(data.disclaimer) $("mc-disc").textContent="\u26A0 "+data.disclaimer;
    renderLaw(data);
    if(data.error){
      $("viz-out").innerHTML="<b>"+data.error+"</b>";
      last=null; ctx.clearRect(0,0,cv.width,cv.height); return;
    }
    $("viz-out").innerHTML=`<div style="line-height:1.7"><b>${data.result}</b></div>`;
    try{ if(window.__ncExplain) __ncExplain(data.explanation); }catch(e){}
    last=data; draw(last, 1);
  }

  // draw(d, t): t in [0,1] morphs a small mass dot into an expanding energy burst.
  function draw(d, t){
    if(!window.NCSkin || !d){ ctx.clearRect(0,0,cv.width,cv.height); return; }
    if(typeof t!=="number") t=1;
    const sk=S();
    const W=cv.width,H=cv.height;
    const ink=sk.ink||"#222", soft=sk.inkSoft||"#888", acc=sk.accent||"#b34a23",
          rule=sk.rule||"#ddd";
    ctx.clearRect(0,0,W,H);

    const cx=W*0.5, cy=H*0.52;

    // top-left readout: the equation + the value being shown
    ctx.fillStyle=acc; ctx.font="15px "+(sk.mono||"monospace"); ctx.textAlign="left";
    ctx.fillText("E = m c\u00B2", 14, 26);
    ctx.fillStyle=ink; ctx.font="13px "+(sk.mono||"monospace");
    ctx.fillText("c = 299,792,458 m/s", 14, 46);

    // mass dot on the left, energy burst on the right, with an arrow between
    const massX=cx-150, burstX=cx+90;

    // --- mass (a small solid dot; size hints at mass, lightly) ---
    const m=(typeof d.mass==="number")?d.mass:0;
    const mr=Math.max(7,Math.min(26,10+Math.log10(Math.abs(m)+1e-12)*3+12));
    // shrink the mass as t grows (it converts away)
    const curMr=mr*(1-0.7*t);
    ctx.beginPath(); ctx.arc(massX,cy,Math.max(2,curMr),0,Math.PI*2);
    ctx.fillStyle=ink; ctx.fill();
    ctx.fillStyle=soft; ctx.font="12px "+(sk.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText("mass", massX, cy+mr+18);
    ctx.fillStyle=ink; ctx.fillText(fmt(m)+" kg", massX, cy+mr+34);

    // --- arrow ---
    ctx.strokeStyle=soft; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(massX+mr+10,cy); ctx.lineTo(burstX-70,cy); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(burstX-70,cy); ctx.lineTo(burstX-80,cy-5); ctx.lineTo(burstX-80,cy+5);
    ctx.closePath(); ctx.fillStyle=soft; ctx.fill();
    ctx.fillStyle=soft; ctx.font="12px "+(sk.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText("\u00d7 c\u00B2", (massX+mr+10+burstX-70)/2, cy-12);

    // --- energy burst: radiating rays + glow, intensity scales with t ---
    const rays=16, maxLen=70+60*t;
    ctx.save();
    ctx.translate(burstX,cy);
    for(let i=0;i<rays;i++){
      const a=(i/rays)*Math.PI*2 + t*0.6;
      const len=maxLen*(0.6+0.4*Math.sin(i*1.7+t*6));
      ctx.strokeStyle=acc;
      ctx.globalAlpha=0.25+0.6*t;
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*len,Math.sin(a)*len); ctx.stroke();
    }
    ctx.globalAlpha=1;
    // core
    const coreR=6+18*t;
    const grad=ctx.createRadialGradient(0,0,1,0,0,coreR);
    grad.addColorStop(0,acc); grad.addColorStop(1,(sk.paper2||"#eee"));
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(0,0,coreR,0,Math.PI*2); ctx.fill();
    ctx.restore();

    ctx.fillStyle=acc; ctx.font="12px "+(sk.sans||"sans-serif"); ctx.textAlign="center";
    ctx.fillText("energy", burstX, cy+maxLen+0.0+22);
    ctx.fillStyle=ink;
    const eVal=(typeof d.energy==="number")?d.energy:0;
    ctx.fillText(fmt(eVal)+" J", burstX, cy+maxLen+38);

    $("mc-cap").textContent="a little mass converts into an enormous amount of energy";
  }

  let mode="direct", raf=null, playing=false, animStart=null;
  const DURATION=2600;
  const ANIM_NOTE="The mass on the left converts into the burst of energy on the right. "+
    "Because the energy is mass multiplied by the speed of light squared, even a tiny mass "+
    "releases an enormous amount of energy.";

  function stepsPanel(){ return document.getElementById("nc-steps"); }
  function styleToggle(){
    if(!window.NCSkin) return;
    const seg=$("mc-learn3"); seg.style.border="1px solid "+NCSkin.rule;
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.classList.contains("active");
      b.style.cursor="pointer"; b.style.border="none"; b.style.padding="6px 14px";
      b.style.font="13px "+(NCSkin.sans||"sans-serif");
      b.style.background = on ? NCSkin.accent : (NCSkin.paper2||"transparent");
      b.style.color = on ? (NCSkin.paper||"#fff") : NCSkin.ink;
    });
    const pb=$("mc-play");
    if(pb){ pb.style.border="1px solid "+NCSkin.rule; pb.style.background=NCSkin.paper2||"transparent"; pb.style.color=NCSkin.ink; }
  }
  function stopPlay(){
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    playing=false; animStart=null;
    const pb=$("mc-play"); if(pb) pb.textContent="\u25B6 Play";
    if(last) draw(last,1);
  }
  function startPlay(){
    if(raf||!last) return; playing=true;
    const pb=$("mc-play"); if(pb) pb.textContent="\u23F8 Pause";
    function frame(ts){
      if(animStart===null) animStart=ts;
      let t=(ts-animStart)/DURATION; if(t>=1) t=1;
      draw(last,t);
      if(t<1){ raf=requestAnimationFrame(frame); }
      else { raf=null; playing=false; const b=$("mc-play"); if(b)b.textContent="\u25B6 Play"; }
    }
    raf=requestAnimationFrame(frame);
  }
  function togglePlay(){ if(playing) stopPlay(); else startPlay(); }

  function setMode(m){
    mode=m; stopPlay();
    const seg=$("mc-learn3");
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.getAttribute("data-mode")===m;
      b.classList.toggle("active",on); b.setAttribute("aria-pressed",String(on));
    });
    const sp=stepsPanel(), animCtl=$("mc-anim-controls");
    if(sp) sp.style.display=(m==="steps")?"":"none";
    if(m==="steps" && sp){ sp.hidden=false; sp.style.display="";
      const wbtn=document.getElementById("nc-steps-working"); if(wbtn) wbtn.click(); }
    animCtl.style.display=(m==="anim")?"":"none";
    if(m==="anim") $("mc-anim-note").textContent=ANIM_NOTE;
    draw(last,1); styleToggle();
  }

  $("mc-learn3").querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>setMode(b.getAttribute("data-mode")));
  });
  $("mc-play").addEventListener("click", togglePlay);

  $("mc-solve").addEventListener("change", ()=>{ syncFields(); if(mode==="anim") setMode("anim"); update(); });
  ["mc-mass","mc-energy"].forEach(id=>{
    const el=$(id); if(el) el.addEventListener("input", ()=>{ if(mode==="anim") setMode("anim"); update(); });
  });

  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", styleToggle);
  window.addEventListener("nc-theme-change", ()=>{ if(last) renderLaw(last); });
  window.addEventListener("nc-theme-change", ()=>{ if(last) draw(last,1); });

  syncFields(); styleFields();
  update().then(()=>{
    const innerToggle=document.querySelector("#nc-steps .nc-steps-toggle");
    if(innerToggle) innerToggle.style.display="none";
    setMode("direct");
  });
})();
</script>
