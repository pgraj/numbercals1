<link rel="stylesheet" href="/static/nclearn.css">
<div class="viz-panel" data-slug="{{ calc.slug }}">
  <div class="viz-inputs">
    <label>Angle x (degrees)
      <span class="nc-field"><input id="cg-deg" type="number" value="60" step="any"></span></label>
    <label>Drag
      <span class="nc-field"><input id="cg-range" type="range" value="60" min="0" max="360" step="1" style="width:200px"></span></label>
  </div>

  <div class="viz-out" id="cg-out"></div>

  <canvas id="cg-diagram" width="680" height="420"
          style="display:block;width:100%;height:auto;max-width:600px;margin:10px auto 0"></canvas>
  <p class="viz-caption" id="cg-cap" style="font-size:.85rem;text-align:center;margin-top:.4rem;opacity:.85"></p>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="cg-disc" style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const slug = "{{ calc.slug }}";
  const P = "cg";
  const panel = document.querySelector('.viz-panel[data-slug="'+slug+'"]');
  let last = null;

  function styleFields(){
    if(!window.NCSkin || !panel) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      if(el.type==="range") return;
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const d=$(P+"-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function buildBody(){
    return { angle_deg:$("cg-deg").value };
  }

  async function update(){
    
    const body = buildBody();
    let data;
    try { const r=await fetch("/api/compute/"+slug,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}); data=await r.json(); }
    catch(e){ $(P+"-out").textContent="compute error"; return; }
    try { if(window.NCSteps) window.NCSteps.render(data.steps||[]); } catch(e){}
    if (data.disclaimer) $(P+"-disc").textContent="\u26a0 "+data.disclaimer;
    if (data.error){ $(P+"-out").innerHTML="<b>"+data.error+"</b>"; try{window.__ncExplain([]);}catch(e){} drawDiagram(null); last=null; mountLearn(null); return; }
    $(P+"-out").innerHTML = '<b>cos '+fmt(data.x)+'\u00b0 = '+data.result+'</b>';
    try{ window.__ncExplain(data.explanation);}catch(e){}
    last=data; drawDiagram(data); mountLearn(data);
  }

  function mountLearn(data){
    if(!window.NCLearn) return;
    NCLearn.mount({ slug:slug, panel:panel, data:data, drawFrame:(data?drawFrame:undefined) });
  }

  function fmt(x){ if(x===null||x===undefined) return ""; return (Math.abs(x-Math.round(x))<1e-9)?String(Math.round(x)):(Math.round(x*10000)/10000).toString(); }

  // Shared auto-fit: given natural-coordinate points [{x,y},...] and the canvas,
  // return a mapper m(p)->{x,y} that centres and scales them to fill the box
  // (minus margin) so NOTHING ever clips, whatever the inputs. Y is flipped so
  // positive-y is up in natural coords. Returns {map, scale}.
  function fitPts(pts, W, H, margin){
    margin = margin || 48;
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    pts.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
    const spanX=Math.max(1e-6,maxX-minX), spanY=Math.max(1e-6,maxY-minY);
    const sc=Math.min((W-2*margin)/spanX, (H-2*margin)/spanY);
    const cxN=(minX+maxX)/2, cyN=(minY+maxY)/2;
    const map=(p)=>({ x: W/2 + (p.x-cxN)*sc, y: H/2 - (p.y-cyN)*sc });
    return { map, scale:sc };
  }


  function drawDiagram(d){ drawAt(d, d? d.x : 0); }
  function drawAt(d, angDeg){
    const cv=$(P+"-diagram"); if(!cv) return; const ctx=cv.getContext("2d"); const s=window.NCSkin||{};
    const ink=s.ink||"#222", accent=s.accent||"#b50", yes=s.yes||"#3a7", soft=s.inkSoft||"#777", rule=s.rule||"#ccc", paper2=s.paper2||"#eee";
    const W=cv.width,H=cv.height; ctx.clearRect(0,0,W,H); const cy=H/2,R=110,ccx=130,gx0=300,gx1=W-20,gw=gx1-gx0;
    ctx.strokeStyle=rule; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(ccx-R-15,cy); ctx.lineTo(ccx+R+15,cy); ctx.stroke(); ctx.beginPath(); ctx.moveTo(ccx,cy-R-15); ctx.lineTo(ccx,cy+R+15); ctx.stroke();
    ctx.strokeStyle=soft; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(ccx,cy,R,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle=rule; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(gx0,cy); ctx.lineTo(gx1,cy); ctx.stroke(); ctx.beginPath(); ctx.moveTo(gx0,cy-R-15); ctx.lineTo(gx0,cy+R+15); ctx.stroke();
    ctx.strokeStyle=paper2; for(let a=90;a<=360;a+=90){ const gx=gx0+(a/360)*gw; ctx.beginPath(); ctx.moveTo(gx,cy-R-12); ctx.lineTo(gx,cy+R+12); ctx.stroke(); }
    ctx.fillStyle=soft; ctx.font="10px "+(s.sans||"sans-serif"); ctx.textAlign="center"; [0,90,180,270,360].forEach(a=>{ const gx=gx0+(a/360)*gw; ctx.fillText(a+"\u00b0",gx,cy+R+28); });
    const cap=$(P+"-cap"); if(!d){ if(cap) cap.textContent=""; return; }
    // cosine = x-coord; plot horizontally-projected. curve up to angDeg
    ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.beginPath();
    for(let a=0;a<=angDeg;a+=2){ const gx=gx0+(a/360)*gw, gy=cy-Math.cos(a*Math.PI/180)*R; if(a===0)ctx.moveTo(gx,gy); else ctx.lineTo(gx,gy);} ctx.stroke();
    ctx.strokeStyle=rule; ctx.lineWidth=1; ctx.beginPath(); for(let a=angDeg;a<=360;a+=2){ const gx=gx0+(a/360)*gw, gy=cy-Math.cos(a*Math.PI/180)*R; if(a===angDeg)ctx.moveTo(gx,gy); else ctx.lineTo(gx,gy);} ctx.stroke();
    const th=angDeg*Math.PI/180, px=ccx+Math.cos(th)*R, py=cy-Math.sin(th)*R;
    ctx.strokeStyle=ink; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ccx,cy); ctx.lineTo(px,py); ctx.stroke();
    ctx.strokeStyle=accent; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ccx,cy); ctx.lineTo(px,cy); ctx.stroke(); // cos leg (horizontal)
    ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(px,py,5,0,Math.PI*2); ctx.fill();
    const cgx=gx0+(angDeg/360)*gw, cgy=cy-Math.cos(th)*R;
    ctx.setLineDash([4,4]); ctx.strokeStyle=accent; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(px,cy); ctx.lineTo(cgx,cgy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=accent; ctx.beginPath(); ctx.arc(cgx,cgy,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=ink; ctx.font="bold 13px "+(s.mono||"monospace"); ctx.textAlign="left"; ctx.fillText("x="+fmt(angDeg)+"\u00b0, y="+fmt(d.y), gx0+6, cy-R-2);
    if(cap) cap.textContent="The horizontal reach of the point (its x-coordinate) is the cosine \u2014 drag or play to trace it. Angles run anticlockwise from the right (0\u00b0 \u2192 90\u00b0 top \u2192 180\u00b0 left), the standard convention; cosine starts at 1 because the point starts at the far right.";
  }


  function drawFrame(ctx,t,d){ if(!d) return; drawAt(d, 360 - t*360); }

  function syncD(){ const v=Math.max(0,Math.min(360,Math.round(+$("cg-deg").value||0))); $("cg-range").value=v; }
  function syncR(){ $("cg-deg").value=$("cg-range").value; }
  $("cg-deg").addEventListener("input",()=>{syncD();update();}); $("cg-range").addEventListener("input",()=>{syncR();update();});
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawAt(last,last.x); });
  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", ()=>{ if(last) drawDiagram(last); });
  styleFields(); syncD(); update();
})();
</script>
