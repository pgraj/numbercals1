<div class="viz-panel" data-slug="{{ calc.slug }}">

  <div class="viz-inputs" style="align-items:flex-start;gap:34px;flex-wrap:wrap">
    <label>
      <span style="display:block;white-space:nowrap">Solve for</span>
      <span class="nc-field" style="display:block">
        <select id="de-solve" style="width:130px">
          <option value="density" selected>Density</option>
          <option value="mass">Mass</option>
          <option value="volume">Volume</option>
        </select>
      </span>
    </label>
    <label>
      <span style="display:block;white-space:nowrap">Material</span>
      <span class="nc-field" style="display:block">
        <select id="de-material" style="width:150px">
          <option value="custom" selected>Custom (type density)</option>
          <option value="cotton">Cotton (~80)</option>
          <option value="wood">Wood (~650)</option>
          <option value="water">Water (~1000)</option>
          <option value="aluminium">Aluminium (~2705)</option>
          <option value="iron">Iron (~7860)</option>
          <option value="gold">Gold (~19320)</option>
        </select>
      </span>
    </label>
    <label id="de-l-mass">
      <span style="display:block;white-space:nowrap">Mass m (kg)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="de-mass" value="2" step="any" style="width:120px">
      </span>
    </label>
    <label id="de-l-volume">
      <span style="display:block;white-space:nowrap">Volume V (m&sup3;)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="de-volume" value="0.001" step="any" style="width:120px">
      </span>
    </label>
    <label id="de-l-density" style="display:none">
      <span style="display:block;white-space:nowrap">Density &rho; (kg/m&sup3;)</span>
      <span class="nc-field" style="display:block">
        <input type="number" id="de-density" value="2000" step="any" style="width:120px">
      </span>
    </label>
  </div>

  <canvas id="de-canvas" width="640" height="300"
          style="display:block;width:100%;height:auto;max-width:560px;margin:8px auto 0"></canvas>
  <p class="viz-caption" id="de-cap"
     style="font-size:.9rem;margin-top:.5rem;opacity:.85;text-align:center"></p>

  <p class="viz-law" id="de-law"
     style="font-size:.86rem;margin-top:.4rem;line-height:1.5;text-align:center"></p>

  <div class="viz-out" id="viz-out" style="margin-top:10px"></div>
  <div id="de-lift" style="margin-top:8px;font-size:.9rem"></div>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:16px"></div>
  <p class="viz-disclaimer" id="de-disc"
     style="font-size:.82rem;margin-top:.75rem;padding:8px 10px;border-radius:6px"></p>
</div>

<div class="nc-learn3" id="de-learn3" role="group" aria-label="Answer detail"
     style="display:inline-flex;border-radius:8px;overflow:hidden;margin:12px 0 6px">
  <button type="button" data-mode="direct" class="active" aria-pressed="true">Direct answer</button>
  <button type="button" data-mode="steps" aria-pressed="false">Step-by-step working</button>
  <button type="button" data-mode="anim" aria-pressed="false">Animation</button>
</div>

<div id="de-anim-controls" style="display:none;margin:2px 0 6px">
  <button type="button" id="de-play" style="cursor:pointer;border-radius:6px;padding:4px 12px">&#9654; Play</button>
  <p id="de-anim-note" style="font-size:.82rem;margin:6px 0 0;opacity:.8;max-width:560px"></p>
</div>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const cv = $("de-canvas"), ctx = cv.getContext("2d");
  const SLUG = "{{ calc.slug }}";
  let last = null;

  function S(){ return window.NCSkin || {}; }
  function fmt(x){
    if(x===null||x===undefined||isNaN(x)) return "";
    if(Math.abs(x-Math.round(x))<1e-9) return String(Math.round(x));
    return (Math.round(x*10000)/10000).toString();
  }

  function renderLaw(d){
    const el=$("de-law"); if(!el) return;
    if(!d || !d.law_statement){ el.innerHTML=""; return; }
    const sk=window.NCSkin||{};
    let html='<b>What this means:</b> '+d.law_statement;
    if(d.law_source_url && d.law_source_name){
      html+=' <a href="'+d.law_source_url+'" target="_blank" rel="noopener">'+d.law_source_name+'</a>';
    }
    el.innerHTML=html;
    el.style.color=sk.inkSoft||"";
    el.querySelectorAll("b").forEach(b=>{ b.style.color=sk.ink||""; });
    el.querySelectorAll("a").forEach(a=>{ a.style.color=sk.accent||""; });
  }

  function renderLift(d){
    const el=$("de-lift"); if(!el) return;
    if(!d || d.error || d.can_lift===null || d.can_lift===undefined){ el.innerHTML=""; return; }
    const sk=window.NCSkin||{};
    const ok=d.can_lift;
    let html='<b>'+(ok?"\u2713 Safe to lift: ":"\u26A0 Too heavy to lift alone: ")+'</b>'+(d.lift_note||"");
    if(d.lift_source_url && d.lift_source_name){
      html+=' <a href="'+d.lift_source_url+'" target="_blank" rel="noopener">'+d.lift_source_name+'</a>';
    }
    el.innerHTML=html;
    el.style.color=sk.inkSoft||"";
    el.querySelectorAll("b").forEach(b=>{ b.style.color= ok ? (sk.yes||"") : (sk.accent||""); });
    el.querySelectorAll("a").forEach(a=>{ a.style.color=sk.accent||""; });
  }

  function styleFields(){
    const panel = document.querySelector('.viz-panel[data-slug="'+SLUG+'"]');
    if(!panel||!window.NCSkin) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{
      el.style.background=bg; el.style.color=NCSkin.ink;
      el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px";
    });
    panel.querySelectorAll("label").forEach(el=>{ el.style.color=NCSkin.ink; });
    const n=$("de-anim-note"); if(n) n.style.color=NCSkin.inkSoft;
    const d=$("de-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
  }

  function syncFields(){
    const sf=$("de-solve").value;
    const mat=$("de-material").value;
    $("de-l-mass").style.display    = (sf==="density"||sf==="volume") ? "" : "none";
    $("de-l-volume").style.display  = (sf==="density"||sf==="mass") ? "" : "none";
    // density input only shown when solving mass/volume AND material is custom
    const showDensity = (sf==="mass"||sf==="volume") && mat==="custom";
    $("de-l-density").style.display = showDensity ? "" : "none";
  }

  async function update(){
    const body={ solve_for:$("de-solve").value,
      material:$("de-material").value,
      mass:parseFloat($("de-mass").value),
      volume:parseFloat($("de-volume").value),
      density:parseFloat($("de-density").value) };
    let data;
    try{
      const r=await fetch("/api/compute/"+SLUG,{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      data=await r.json();
    }catch(e){ $("viz-out").textContent="compute error"; return; }
    try{ if(window.NCSteps) NCSteps.render(data.steps||[]); }catch(e){}
    if(data.disclaimer) $("de-disc").textContent="\u26A0 "+data.disclaimer;
    renderLaw(data);
    if(data.error){
      $("viz-out").innerHTML="<b>"+data.error+"</b>"; $("de-lift").innerHTML="";
      last=null; ctx.clearRect(0,0,cv.width,cv.height); return;
    }
    $("viz-out").innerHTML=`<div style="line-height:1.7"><b>${data.result}</b></div>`;
    renderLift(data);
    try{ if(window.__ncExplain) __ncExplain(data.explanation); }catch(e){}
    last=data; draw(last, 1);
  }

  function draw(d, sweep){
    if(!window.NCSkin || !d){ ctx.clearRect(0,0,cv.width,cv.height); return; }
    if(typeof sweep!=="number") sweep=1;
    const sk=S();
    const W=cv.width,H=cv.height;
    const ink=sk.ink||"#222", soft=sk.inkSoft||"#888", acc=sk.accent||"#b34a23",
          yes=sk.yes||"#2f7a52", rule=sk.rule||"#ddd";
    ctx.clearRect(0,0,W,H);
    const frac=Math.max(0,Math.min(1,sweep));
    const rho=(typeof d.density==="number")?d.density:0;
    const m=(typeof d.mass==="number")?d.mass:0;
    const V=(typeof d.volume==="number")?d.volume:0;

    const bx=W*0.5-110, by=50, bw=220, bh=150;
    ctx.strokeStyle=ink; ctx.lineWidth=2;
    ctx.strokeRect(bx,by,bw,bh);

    let n=Math.round(Math.max(4, Math.min(180, (rho/1000)*60)));
    const shown=Math.round(n*frac);
    ctx.fillStyle=acc;
    let idx=0;
    const cols=Math.max(2,Math.ceil(Math.sqrt(n*(bw/bh))));
    const rows=Math.max(1,Math.ceil(n/cols));
    const dx=bw/(cols+1), dy=bh/(rows+1);
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        if(idx>=n) break;
        if(idx<shown){
          ctx.beginPath(); ctx.arc(bx+dx*(c+1),by+dy*(r+1),3.0,0,Math.PI*2); ctx.fill();
        }
        idx++;
      }
    }

    ctx.fillStyle=ink; ctx.font="13px "+(sk.sans||"sans-serif"); ctx.textAlign="center";
    const matLbl=(d.material_label&&d.material!=="custom")?d.material_label+"  \u00B7  ":"";
    ctx.fillText(matLbl+"mass "+fmt(m)+" kg  \u00B7  volume "+fmt(V)+" m\u00B3", W*0.5, by+bh+22);

    ctx.fillStyle=acc; ctx.font="14px "+(sk.mono||"monospace"); ctx.textAlign="left";
    ctx.fillText("\u03C1 = m / V", 14, 24);
    ctx.fillStyle=ink;
    ctx.fillText("\u03C1 = "+fmt(rho)+" kg/m\u00B3", 14, 44);
    ctx.fillStyle=soft;
    ctx.fillText(rho>1000?"denser than water \u2192 sinks":(rho<1000&&rho>0?"less dense than water \u2192 floats":"vs water \u2248 1000"), 14, 62);
    if(typeof d.weight_n==="number"){
      ctx.fillStyle = d.can_lift ? yes : acc;
      ctx.fillText("weight \u2248 "+fmt(d.weight_n)+" N", 14, 82);
    }

    $("de-cap").textContent="more mass packed into the same space means higher density";
  }

  let mode="direct", raf=null, playing=false, animStart=null;
  const DURATION=2200;
  const ANIM_NOTE="The dots show how tightly mass is packed into the volume. Denser materials "+
    "pack more in \u2014 and denser than water (1000 kg/m\u00B3) means it sinks.";

  function stepsPanel(){ return document.getElementById("nc-steps"); }
  function styleToggle(){
    if(!window.NCSkin) return;
    const seg=$("de-learn3"); seg.style.border="1px solid "+NCSkin.rule;
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.classList.contains("active");
      b.style.cursor="pointer"; b.style.border="none"; b.style.padding="6px 14px";
      b.style.font="13px "+(NCSkin.sans||"sans-serif");
      b.style.background = on ? NCSkin.accent : (NCSkin.paper2||"transparent");
      b.style.color = on ? (NCSkin.paper||"#fff") : NCSkin.ink;
    });
    const pb=$("de-play");
    if(pb){ pb.style.border="1px solid "+NCSkin.rule; pb.style.background=NCSkin.paper2||"transparent"; pb.style.color=NCSkin.ink; }
  }
  function stopPlay(){
    if(raf){ cancelAnimationFrame(raf); raf=null; }
    playing=false; animStart=null;
    const pb=$("de-play"); if(pb) pb.textContent="\u25B6 Play";
    if(last) draw(last,1);
  }
  function startPlay(){
    if(raf||!last) return; playing=true;
    const pb=$("de-play"); if(pb) pb.textContent="\u23F8 Pause";
    function frame(ts){
      if(animStart===null) animStart=ts;
      let t=(ts-animStart)/DURATION; if(t>=1) t=1;
      draw(last,t);
      if(t<1){ raf=requestAnimationFrame(frame); }
      else { raf=null; playing=false; const b=$("de-play"); if(b)b.textContent="\u25B6 Play"; }
    }
    raf=requestAnimationFrame(frame);
  }
  function togglePlay(){ if(playing) stopPlay(); else startPlay(); }

  function setMode(m){
    mode=m; stopPlay();
    const seg=$("de-learn3");
    seg.querySelectorAll("button").forEach(b=>{
      const on=b.getAttribute("data-mode")===m;
      b.classList.toggle("active",on); b.setAttribute("aria-pressed",String(on));
    });
    const sp=stepsPanel(), animCtl=$("de-anim-controls");
    if(sp) sp.style.display=(m==="steps")?"":"none";
    if(m==="steps" && sp){ sp.hidden=false; sp.style.display="";
      const wbtn=document.getElementById("nc-steps-working"); if(wbtn) wbtn.click(); }
    animCtl.style.display=(m==="anim")?"":"none";
    if(m==="anim") $("de-anim-note").textContent=ANIM_NOTE;
    draw(last,1); styleToggle();
  }

  $("de-learn3").querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>setMode(b.getAttribute("data-mode")));
  });
  $("de-play").addEventListener("click", togglePlay);

  $("de-solve").addEventListener("change", ()=>{ syncFields(); if(mode==="anim") setMode("anim"); update(); });
  $("de-material").addEventListener("change", ()=>{ syncFields(); if(mode==="anim") setMode("anim"); update(); });
  ["de-mass","de-volume","de-density"].forEach(id=>{
    const el=$(id); if(el) el.addEventListener("input", ()=>{ if(mode==="anim") setMode("anim"); update(); });
  });

  window.addEventListener("nc-theme-change", styleFields);
  window.addEventListener("nc-theme-change", styleToggle);
  window.addEventListener("nc-theme-change", ()=>{ if(last){ renderLaw(last); renderLift(last); } });
  window.addEventListener("nc-theme-change", ()=>{ if(last) draw(last,1); });

  syncFields(); styleFields();
  update().then(()=>{
    const innerToggle=document.querySelector("#nc-steps .nc-steps-toggle");
    if(innerToggle) innerToggle.style.display="none";
    setMode("direct");
  });
})();
</script>
