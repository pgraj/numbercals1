<div class="viz-panel" data-slug="{{ calc.slug }}">

  <div class="viz-inputs" style="display:flex;align-items:flex-start;gap:22px;flex-wrap:wrap;margin-bottom:6px">
    <label id="bepa-cash_invested-l" style="display:block">
      <span style="display:block;white-space:nowrap;font-size:.86rem;opacity:.85">Cash invested</span>
      <span class="nc-field" style="display:block"><input type="number" id="bepa-cash_invested" data-k="cash_invested" value="150000" step="any" style="width:130px"></span>
    </label>
    <label id="bepa-annual_cashflow-l" style="display:block">
      <span style="display:block;white-space:nowrap;font-size:.86rem;opacity:.85">Annual cashflow</span>
      <span class="nc-field" style="display:block"><input type="number" id="bepa-annual_cashflow" data-k="annual_cashflow" value="4000" step="any" style="width:130px"></span>
    </label>
    <label id="bepa-annual_capital_growth-l" style="display:block">
      <span style="display:block;white-space:nowrap;font-size:.86rem;opacity:.85">Annual capital growth</span>
      <span class="nc-field" style="display:block"><input type="number" id="bepa-annual_capital_growth" data-k="annual_capital_growth" value="24000" step="any" style="width:130px"></span>
    </label>
  </div>

  <div class="nc-learn2" id="bepa-learn2" role="group" aria-label="Answer detail"
       style="display:inline-flex;border:1px solid var(--rule,#ddd);border-radius:8px;overflow:hidden;margin:10px 0 8px">
    <button type="button" data-mode="direct" class="active" aria-pressed="true" style="cursor:pointer;border:0;padding:5px 14px;font-size:.86rem;background:transparent">Direct answer</button>
    <button type="button" data-mode="steps" aria-pressed="false" style="cursor:pointer;border:0;padding:5px 14px;font-size:.86rem;background:transparent">Step-by-step working</button>
  </div>

  <canvas id="bepa-canvas" width="640" height="300"
          style="display:block;width:100%;height:auto;max-width:560px;margin:4px auto 0"></canvas>
  <p class="viz-caption" id="bepa-cap" style="font-size:.88rem;margin-top:.5rem;opacity:.85;text-align:center"></p>

  <div class="viz-out" id="bepa-out" style="margin-top:10px"></div>
  <div class="viz-steps" id="bepa-steps" style="margin-top:10px;display:none"></div>

  <div class="viz-explain" id="nc-explain-box" style="margin-top:14px"></div>
  <p class="viz-disclaimer" id="bepa-disc" style="font-size:.82rem;margin-top:.7rem;padding:8px 10px;border-radius:6px"></p>
</div>

<script>
/* per-calc diagram library (shared, idempotent) */
if(!window.NCDiagrams){
/* NumberCals per-calc diagram library.
   Each entry: function(ctx, W, H, d, sk) -> draws a shape-appropriate picture using
   compute-result fields in `d` and theme colours in `sk`. Pure canvas 2D. */
(function(){
  function C(sk,k,f){ return (sk&&sk[k])||f; }
  function clear(ctx,W,H){ ctx.clearRect(0,0,W,H); }
  function txt(ctx,s,x,y,col,font,align){ ctx.fillStyle=col; ctx.font=font; ctx.textAlign=align||"center"; ctx.fillText(s,x,y); }
  function nf(x){ if(x==null||isNaN(x))return ""; if(Math.abs(x)>=1e6||(x!==0&&Math.abs(x)<1e-3))return Number(x).toPrecision(4);
    if(Math.abs(x-Math.round(x))<1e-9)return String(Math.round(x)); return (Math.round(x*1000)/1000).toString(); }

  // ---- shared helpers ----
  function ink(sk){return C(sk,"ink","#2b2b2b");}
  function acc(sk){return C(sk,"accent","#b4532a");}
  function soft(sk){return C(sk,"inkSoft","#8a8a8a");}
  function fill(sk){return C(sk,"accent","#b4532a");}
  function paper2(sk){return C(sk,"paper2","#f1ece2");}
  function mono(sk){return C(sk,"mono","monospace");}
  function sans(sk){return C(sk,"sans","sans-serif");}

  function dimLabel(ctx,x,y,s,sk){ txt(ctx,s,x,y,soft(sk),"12px "+mono(sk)); }

  const D={};

  /* ===================== 2D GEOMETRY ===================== */
  D["square-area"]=function(ctx,W,H,d,sk){
    const s=d.side||1, side=Math.min(W,H)*0.5, cx=W/2, cy=H/2;
    const x=cx-side/2, y=cy-side/2;
    ctx.fillStyle=paper2(sk); ctx.fillRect(x,y,side,side);
    ctx.strokeStyle=acc(sk); ctx.lineWidth=2; ctx.strokeRect(x,y,side,side);
    ctx.strokeStyle=soft(sk); ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(x,y+side); ctx.lineTo(x+side,y); ctx.stroke(); ctx.setLineDash([]);
    dimLabel(ctx,cx,y+side+18,"side = "+nf(s),sk);
    dimLabel(ctx,x+side*0.72,y+side*0.36,"d="+nf(d.diagonal),sk);
    txt(ctx,"Area "+nf(d.area),cx,y-10,ink(sk),"bold 14px "+sans(sk));
  };
  D["rectangle-area"]=function(ctx,W,H,d,sk){
    const l=d.length||(d.area? Math.sqrt(d.area):1), w=d.width||1;
    const maxW=W*0.6, maxH=H*0.5, ar=(l&&w)?l/w:1.6;
    let bw=maxW, bh=bw/ar; if(bh>maxH){bh=maxH;bw=bh*ar;}
    const x=W/2-bw/2, y=H/2-bh/2;
    ctx.fillStyle=paper2(sk); ctx.fillRect(x,y,bw,bh);
    ctx.strokeStyle=acc(sk); ctx.lineWidth=2; ctx.strokeRect(x,y,bw,bh);
    ctx.strokeStyle=soft(sk); ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(x,y+bh); ctx.lineTo(x+bw,y); ctx.stroke(); ctx.setLineDash([]);
    dimLabel(ctx,x+bw/2,y+bh+18,"length = "+nf(d.length),sk);
    ctx.save(); ctx.translate(x-12,y+bh/2); ctx.rotate(-Math.PI/2); dimLabel(ctx,0,0,"width = "+nf(d.width),sk); ctx.restore();
    txt(ctx,"Area "+nf(d.area),x+bw/2,y-10,ink(sk),"bold 14px "+sans(sk));
  };
  D["triangle-area"]=function(ctx,W,H,d,sk){
    const cx=W/2, baseY=H*0.72, bw=Math.min(W*0.55,260), apexX=cx-bw*0.12, apexY=H*0.26;
    const x0=cx-bw/2, x1=cx+bw/2;
    ctx.beginPath(); ctx.moveTo(x0,baseY); ctx.lineTo(x1,baseY); ctx.lineTo(apexX,apexY); ctx.closePath();
    ctx.fillStyle=paper2(sk); ctx.fill(); ctx.strokeStyle=acc(sk); ctx.lineWidth=2; ctx.stroke();
    // height line
    ctx.strokeStyle=soft(sk); ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(apexX,apexY); ctx.lineTo(apexX,baseY); ctx.stroke(); ctx.setLineDash([]);
    dimLabel(ctx,cx,baseY+18,(d.method==="heron"?"3 sides (Heron)":"base"),sk);
    txt(ctx,"Area "+nf(d.area),cx,apexY-8,ink(sk),"bold 14px "+sans(sk));
  };
  D["circle-area"]=function(ctx,W,H,d,sk){
    const cx=W/2, cy=H/2, R=Math.min(W,H)*0.32;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,2*Math.PI); ctx.fillStyle=paper2(sk); ctx.fill();
    ctx.strokeStyle=acc(sk); ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle=soft(sk); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+R,cy); ctx.stroke();
    ctx.fillStyle=ink(sk); ctx.beginPath(); ctx.arc(cx,cy,2.5,0,2*Math.PI); ctx.fill();
    dimLabel(ctx,cx+R/2,cy-6,"r = "+nf(d.radius),sk);
    txt(ctx,"Area "+nf(d.area),cx,cy-R-10,ink(sk),"bold 14px "+sans(sk));
    txt(ctx,"C = "+nf(d.circumference),cx,cy+R+20,soft(sk),"12px "+mono(sk));
  };
  D["parallelogram-area"]=function(ctx,W,H,d,sk){
    const cx=W/2, baseY=H*0.66, bw=Math.min(W*0.5,230), sk_=bw*0.28, bh=H*0.34;
    const x0=cx-bw/2, x1=cx+bw/2;
    ctx.beginPath(); ctx.moveTo(x0,baseY); ctx.lineTo(x1,baseY); ctx.lineTo(x1+sk_,baseY-bh); ctx.lineTo(x0+sk_,baseY-bh); ctx.closePath();
    ctx.fillStyle=paper2(sk); ctx.fill(); ctx.strokeStyle=acc(sk); ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle=soft(sk); ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(x0+sk_,baseY-bh); ctx.lineTo(x0+sk_,baseY); ctx.stroke(); ctx.setLineDash([]);
    dimLabel(ctx,cx,baseY+18,"base",sk); dimLabel(ctx,x0+sk_-16,baseY-bh/2,"h",sk);
    txt(ctx,"Area "+nf(d.area),cx,baseY-bh-10,ink(sk),"bold 14px "+sans(sk));
  };
  D["trapezoid-area"]=function(ctx,W,H,d,sk){
    const cx=W/2, baseY=H*0.66, bw=Math.min(W*0.6,260), tw=bw*0.5, bh=H*0.34;
    ctx.beginPath(); ctx.moveTo(cx-bw/2,baseY); ctx.lineTo(cx+bw/2,baseY); ctx.lineTo(cx+tw/2,baseY-bh); ctx.lineTo(cx-tw/2,baseY-bh); ctx.closePath();
    ctx.fillStyle=paper2(sk); ctx.fill(); ctx.strokeStyle=acc(sk); ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle=soft(sk); ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(cx-tw/2,baseY-bh); ctx.lineTo(cx-tw/2,baseY); ctx.stroke(); ctx.setLineDash([]);
    dimLabel(ctx,cx,baseY+18,"a (bottom)",sk); dimLabel(ctx,cx,baseY-bh-8,"b (top)",sk);
    txt(ctx,"Area "+nf(d.area),cx+bw/2-20,baseY-bh-22,ink(sk),"bold 13px "+sans(sk));
  };
  D["rhombus-area"]=function(ctx,W,H,d,sk){
    const cx=W/2, cy=H/2, hw=Math.min(W*0.3,150), hh=Math.min(H*0.34,110);
    ctx.beginPath(); ctx.moveTo(cx,cy-hh); ctx.lineTo(cx+hw,cy); ctx.lineTo(cx,cy+hh); ctx.lineTo(cx-hw,cy); ctx.closePath();
    ctx.fillStyle=paper2(sk); ctx.fill(); ctx.strokeStyle=acc(sk); ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle=soft(sk); ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(cx-hw,cy); ctx.lineTo(cx+hw,cy); ctx.moveTo(cx,cy-hh); ctx.lineTo(cx,cy+hh); ctx.stroke(); ctx.setLineDash([]);
    dimLabel(ctx,cx+hw/2,cy-6,"d\u2082",sk); dimLabel(ctx,cx+10,cy-hh/2,"d\u2081",sk);
    txt(ctx,"Area "+nf(d.area),cx,cy-hh-10,ink(sk),"bold 14px "+sans(sk));
  };
  D["ellipse-area"]=function(ctx,W,H,d,sk){
    const cx=W/2, cy=H/2, ra=Math.min(W*0.34,170), rb=Math.min(H*0.3,95);
    ctx.beginPath(); ctx.ellipse(cx,cy,ra,rb,0,0,2*Math.PI); ctx.fillStyle=paper2(sk); ctx.fill();
    ctx.strokeStyle=acc(sk); ctx.lineWidth=2; ctx.stroke();
    ctx.strokeStyle=soft(sk); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+ra,cy); ctx.moveTo(cx,cy); ctx.lineTo(cx,cy-rb); ctx.stroke();
    dimLabel(ctx,cx+ra/2,cy-6,"a",sk); dimLabel(ctx,cx+10,cy-rb/2,"b",sk);
    txt(ctx,"Area "+nf(d.area),cx,cy-rb-10,ink(sk),"bold 14px "+sans(sk));
  };
  D["regular-polygon"]=function(ctx,W,H,d,sk){
    const n=Math.max(3,Math.round(d.sides||6)), cx=W/2, cy=H/2+6, R=Math.min(W,H)*0.32;
    ctx.beginPath();
    for(let i=0;i<n;i++){ const a=-Math.PI/2 + i*2*Math.PI/n; const px=cx+R*Math.cos(a), py=cy+R*Math.sin(a); i?ctx.lineTo(px,py):ctx.moveTo(px,py); }
    ctx.closePath(); ctx.fillStyle=paper2(sk); ctx.fill(); ctx.strokeStyle=acc(sk); ctx.lineWidth=2; ctx.stroke();
    txt(ctx,n+"-gon",cx,cy+4,soft(sk),"12px "+mono(sk));
    txt(ctx,"Area "+nf(d.area),cx,cy-R-10,ink(sk),"bold 14px "+sans(sk));
    txt(ctx,"interior "+nf(d.interior_angle)+"\u00b0",cx,cy+R+20,soft(sk),"12px "+mono(sk));
  };

  /* ===================== 3D GEOMETRY ===================== */
  function iso(ctx,pts,faceCol,edgeCol){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); ctx.fillStyle=faceCol; ctx.fill(); ctx.strokeStyle=edgeCol; ctx.lineWidth=1.6; ctx.stroke(); }
  function shade(sk,amt){ // lighten/darken accent by mixing toward paper/ink
    return amt>0 ? C(sk,"paper2","#eee") : C(sk,"accent","#b4532a"); }

  D["cube-volume"]=function(ctx,W,H,d,sk){
    const cx=W/2, cy=H/2+10, s=Math.min(W,H)*0.34, dx=s*0.42, dy=-s*0.32;
    const a=acc(sk), p2=paper2(sk), p3=C(sk,"paper3","#e6ded0");
    const F=[[cx-s/2,cy-s/2],[cx+s/2,cy-s/2],[cx+s/2,cy+s/2],[cx-s/2,cy+s/2]];
    const top=[F[0],F[1],[F[1][0]+dx,F[1][1]+dy],[F[0][0]+dx,F[0][1]+dy]];
    const side=[F[1],F[2],[F[2][0]+dx,F[2][1]+dy],[F[1][0]+dx,F[1][1]+dy]];
    iso(ctx,top,p3,a); iso(ctx,side,p2,a); iso(ctx,F,p2,a);
    txt(ctx,"Vol "+nf(d.volume),cx,cy+s/2+24,ink(sk),"bold 14px "+sans(sk));
    dimLabel(ctx,cx,cy+s/2+6,"edge "+nf(d.edge||(d.volume?Math.cbrt(d.volume):"")),sk);
  };
  D["cuboid-volume"]=function(ctx,W,H,d,sk){
    const cx=W/2, cy=H/2+10; const a=acc(sk), p2=paper2(sk), p3=C(sk,"paper3","#e6ded0");
    const bw=Math.min(W*0.4,180), bh=Math.min(H*0.34,110), dx=bw*0.34, dy=-bh*0.4;
    const F=[[cx-bw/2,cy-bh/2],[cx+bw/2,cy-bh/2],[cx+bw/2,cy+bh/2],[cx-bw/2,cy+bh/2]];
    const top=[F[0],F[1],[F[1][0]+dx,F[1][1]+dy],[F[0][0]+dx,F[0][1]+dy]];
    const side=[F[1],F[2],[F[2][0]+dx,F[2][1]+dy],[F[1][0]+dx,F[1][1]+dy]];
    iso(ctx,top,p3,a); iso(ctx,side,p2,a); iso(ctx,F,p2,a);
    dimLabel(ctx,cx,cy+bh/2+18,"l\u00d7w\u00d7h",sk);
    txt(ctx,"Vol "+nf(d.volume),cx,cy-bh/2-14,ink(sk),"bold 14px "+sans(sk));
  };
  D["sphere-volume"]=function(ctx,W,H,d,sk){
    const cx=W/2, cy=H/2, R=Math.min(W,H)*0.3;
    ctx.beginPath(); ctx.arc(cx,cy,R,0,2*Math.PI); ctx.fillStyle=acc(sk); ctx.fill();
    try{ const g=ctx.createRadialGradient(cx-R*0.35,cy-R*0.35,R*0.1,cx,cy,R);
      g.addColorStop(0,C(sk,"paper3","#efe7da")); g.addColorStop(1,acc(sk));
      ctx.beginPath(); ctx.arc(cx,cy,R,0,2*Math.PI); ctx.fillStyle=g; ctx.fill(); }catch(e){}
    ctx.strokeStyle=acc(sk); ctx.lineWidth=2; ctx.stroke();
    // equator ellipse for 3D feel
    ctx.strokeStyle=soft(sk); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.ellipse(cx,cy,R,R*0.32,0,0,2*Math.PI); ctx.stroke(); ctx.setLineDash([]);
    dimLabel(ctx,cx+R*0.5,cy-6,"r="+nf(d.radius),sk);
    txt(ctx,"Vol "+nf(d.volume),cx,cy-R-10,ink(sk),"bold 14px "+sans(sk));
    txt(ctx,"SA "+nf(d.surface_area),cx,cy+R+20,soft(sk),"12px "+mono(sk));
  };
  D["cylinder-volume"]=function(ctx,W,H,d,sk){
    const cx=W/2, cy=H/2, rx=Math.min(W*0.18,90), ry=rx*0.34, hh=Math.min(H*0.4,120);
    const top=cy-hh/2, bot=cy+hh/2; const a=acc(sk), p2=paper2(sk);
    ctx.fillStyle=p2; ctx.fillRect(cx-rx,top,2*rx,hh);
    ctx.strokeStyle=a; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(cx-rx,top); ctx.lineTo(cx-rx,bot); ctx.moveTo(cx+rx,top); ctx.lineTo(cx+rx,bot); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx,bot,rx,ry,0,0,Math.PI,false); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx,top,rx,ry,0,0,2*Math.PI); ctx.fillStyle=C(sk,"paper3","#e6ded0"); ctx.fill(); ctx.stroke();
    dimLabel(ctx,cx+rx+14,cy,"h="+nf(d.height||""),sk); dimLabel(ctx,cx,top-ry-4,"r="+nf(d.radius||""),sk);
    txt(ctx,"Vol "+nf(d.volume),cx,bot+ry+20,ink(sk),"bold 14px "+sans(sk));
  };
  D["cone-volume"]=function(ctx,W,H,d,sk){
    const cx=W/2, rx=Math.min(W*0.2,100), ry=rx*0.32, apexY=H*0.24, baseY=H*0.72;
    const a=acc(sk), p2=paper2(sk);
    // cone body
    ctx.beginPath(); ctx.moveTo(cx,apexY); ctx.lineTo(cx-rx,baseY); 
    ctx.ellipse(cx,baseY,rx,ry,0,Math.PI,0,true); ctx.lineTo(cx,apexY); ctx.closePath();
    ctx.fillStyle=p2; ctx.fill(); ctx.strokeStyle=a; ctx.lineWidth=2; ctx.stroke();
    // base ellipse front
    ctx.beginPath(); ctx.ellipse(cx,baseY,rx,ry,0,0,Math.PI,false); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(cx,baseY,rx,ry,0,0,2*Math.PI); ctx.setLineDash([3,3]); ctx.strokeStyle=soft(sk); ctx.stroke(); ctx.setLineDash([]);
    // height
    ctx.strokeStyle=soft(sk); ctx.setLineDash([4,3]); ctx.beginPath(); ctx.moveTo(cx,apexY); ctx.lineTo(cx,baseY); ctx.stroke(); ctx.setLineDash([]);
    dimLabel(ctx,cx+12,(apexY+baseY)/2,"h="+nf(d.height||""),sk); dimLabel(ctx,cx-rx/2,baseY+ry+12,"r="+nf(d.radius||""),sk);
    txt(ctx,"Vol "+nf(d.volume)+"  slant "+nf(d.slant_height),cx,apexY-8,ink(sk),"bold 13px "+sans(sk));
  };
  D["square-pyramid-volume"]=function(ctx,W,H,d,sk){
    const cx=W/2, apexY=H*0.24, baseY=H*0.7, bw=Math.min(W*0.42,200), dx=bw*0.28, dy=-bw*0.12;
    const a=acc(sk), p2=paper2(sk), p3=C(sk,"paper3","#e6ded0");
    const fl=[cx-bw/2,baseY], fr=[cx+bw/2,baseY], br=[cx+bw/2+dx,baseY+dy], bl=[cx-bw/2+dx,baseY+dy], apex=[cx+dx/2,apexY];
    iso(ctx,[bl,br,apex],p3,a); // back-right face (light)
    iso(ctx,[fl,fr,apex],p2,a); // front face
    iso(ctx,[fr,br,apex],p2,a); // right face
    ctx.strokeStyle=soft(sk); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(bl[0],bl[1]); ctx.lineTo(apex[0],apex[1]); ctx.stroke(); ctx.setLineDash([]);
    dimLabel(ctx,cx,baseY+22,"base a, height h",sk);
    txt(ctx,"Vol "+nf(d.volume),cx,apexY-8,ink(sk),"bold 14px "+sans(sk));
  };
  D["torus-volume"]=function(ctx,W,H,d,sk){
    const cx=W/2, cy=H/2, Ro=Math.min(W,H)*0.34, tube=Ro*0.34;
    const a=acc(sk);
    ctx.strokeStyle=a; ctx.lineWidth=2;
    ctx.beginPath(); ctx.ellipse(cx,cy,Ro,Ro*0.5,0,0,2*Math.PI); ctx.stroke();              // outer
    ctx.beginPath(); ctx.ellipse(cx,cy,Ro-tube,(Ro-tube)*0.5,0,0,2*Math.PI); ctx.strokeStyle=soft(sk); ctx.stroke(); // inner hole
    // tube shading band
    ctx.strokeStyle=a; ctx.lineWidth=tube*0.9; ctx.globalAlpha=0.25;
    ctx.beginPath(); ctx.ellipse(cx,cy,Ro-tube/2,(Ro-tube/2)*0.5,0,0,2*Math.PI); ctx.stroke(); ctx.globalAlpha=1; ctx.lineWidth=2;
    dimLabel(ctx,cx,cy,"R, r",sk);
    txt(ctx,"Vol "+nf(d.volume),cx,cy-Ro*0.5-10,ink(sk),"bold 14px "+sans(sk));
  };

  window.NCDiagrams=D;
})();
/* Part 2: Engineering + Business/Finance + Sports + Real Estate + Business Simulation diagrams.
   Appended onto window.NCDiagrams (created by diagrams.js). */
(function(){
  const D=window.NCDiagrams;
  function C(sk,k,f){ return (sk&&sk[k])||f; }
  function txt(ctx,s,x,y,col,font,align){ ctx.fillStyle=col; ctx.font=font; ctx.textAlign=align||"center"; ctx.fillText(s,x,y); }
  function nf(x){ if(x==null||isNaN(x))return ""; if(Math.abs(x)>=1e6||(x!==0&&Math.abs(x)<1e-3))return Number(x).toPrecision(4);
    if(Math.abs(x-Math.round(x))<1e-9)return String(Math.round(x)); return (Math.round(x*1000)/1000).toString(); }
  function ink(sk){return C(sk,"ink","#2b2b2b");} function acc(sk){return C(sk,"accent","#b4532a");}
  function soft(sk){return C(sk,"inkSoft","#8a8a8a");} function p2(sk){return C(sk,"paper2","#f1ece2");}
  function yes(sk){return C(sk,"yes","#2f7a52");} function mono(sk){return C(sk,"mono","monospace");}
  function sans(sk){return C(sk,"sans","sans-serif");}
  function axis(ctx,W,H,sk){ ctx.strokeStyle=C(sk,"rule","#ddd"); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(46,H-40); ctx.lineTo(W-30,H-40); ctx.stroke(); }

  // generic two-bar before/after
  function twoBar(ctx,W,H,sk,a,b,la,lb,title){
    axis(ctx,W,H,sk); const base=H-40, top=46, maxV=Math.max(Math.abs(a),Math.abs(b),1e-9);
    const bw=Math.min(90,(W-140)/2); const x1=W*0.35-bw/2, x2=W*0.65-bw/2;
    const ha=(Math.abs(a)/maxV)*(base-top), hb=(Math.abs(b)/maxV)*(base-top);
    ctx.fillStyle=soft(sk); ctx.fillRect(x1,base-ha,bw,ha);

  D["batting-impact"]=function(ctx,W,H,d,sk){ scoreboard(ctx,W,H,sk,nf(d.impact_score),"batting impact","SR "+nf(d.strike_rate)+" \u00b7 illustrative"); };
  D["bowling-impact"]=function(ctx,W,H,d,sk){ scoreboard(ctx,W,H,sk,nf(d.impact_rating),"bowling impact","econ "+nf(d.economy)+" \u00b7 illustrative"); };
  D["match-outcome-impact"]=function(ctx,W,H,d,sk){ dialGauge(ctx,W,H,sk,(d.chase_probability||0)/100, nf(d.chase_probability)+"%", "chase prob \u00b7 RRR "+nf(d.required_run_rate)); };
  D["player-form-impact"]=function(ctx,W,H,d,sk){ dialGauge(ctx,W,H,sk,Math.min(1,(d.form_index||0)/2), nf(d.form_index), "form index (1 = career avg)"); };
  // OTHER SPORTS
  D["tennis-momentum"]=function(ctx,W,H,d,sk){ dialGauge(ctx,W,H,sk,Math.min(1,(d.recent_win_share||0)/100), nf(d.momentum_index), "momentum \u00b7 "+nf(d.recent_win_share)+"% recent games"); };
  D["f1-pit-stop-impact"]=function(ctx,W,H,d,sk){ const v=d.net_time_s||0; axis(ctx,W,H,sk); const cx=W/2, base=H-40, top=46;
    const h=Math.min(base-top-10, Math.abs(v)*6+14); ctx.fillStyle=(v>=0)?yes(sk):acc(sk); ctx.fillRect(cx-50,base-h,100,h); ctx.strokeStyle=ink(sk); ctx.strokeRect(cx-50,base-h,100,h);
    txt(ctx,(v>=0?"+":"")+nf(v)+" s",cx,base-h-8,ink(sk),"bold 14px "+sans(sk));
    txt(ctx,(v>=0?"stop pays off":"stop costs time")+" \u00b7 "+(d.positions_delta>=0?"+":"")+nf(d.positions_delta)+" places",cx,base+18,soft(sk),"11px "+mono(sk)); };
  D["training-load-impact"]=function(ctx,W,H,d,sk){ const a=d.acwr||0;
    // ACWR gauge with sweet-spot band 0.8-1.3 of a 0..2 scale
    const x0=50,x1=W-50,y=H/2; ctx.lineWidth=16; ctx.lineCap="round";
    ctx.strokeStyle=rule(sk); ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
    function px(v){return x0+(x1-x0)*Math.min(1,v/2);}
    ctx.strokeStyle=yes(sk); ctx.beginPath(); ctx.moveTo(px(0.8),y); ctx.lineTo(px(1.3),y); ctx.stroke(); // sweet spot
    ctx.lineCap="butt"; ctx.fillStyle=ink(sk); ctx.beginPath(); ctx.arc(px(a),y,8,0,2*Math.PI); ctx.fill();
    txt(ctx,"ACWR "+nf(a),W/2,y-26,ink(sk),"bold 15px "+sans(sk));
    txt(ctx,"green = 0.8\u20131.3 sweet spot",W/2,y+30,soft(sk),"11px "+mono(sk)); };
  D["team-chemistry-impact"]=function(ctx,W,H,d,sk){ dialGauge(ctx,W,H,sk,(d.chemistry_index||0)/100, nf(d.chemistry_index)+"/100", "chemistry index \u00b7 illustrative"); };
  D["injury-recovery-impact"]=function(ctx,W,H,d,sk){ scoreboard(ctx,W,H,sk,nf(d.estimated_weeks)+" wks","est. recovery","illustrative \u2014 not medical advice"); };

  // generic fallback (kept for safety; should rarely be used)
  D.__fallback=function(ctx,W,H,d,sk){
    let val=null,key=null; const pref=["result_value","value"];
    for(const k of pref){ if(typeof d[k]==="number"){val=d[k];key=k;break;} }
    if(val===null) for(const k in d){ if(typeof d[k]==="number"&&isFinite(d[k])){val=d[k];key=k;break;} }
    scoreboard(ctx,W,H,sk, nf(val), (key||"result").replace(/_/g," "), "");
  };

  window.NCDiagrams=D;
})();
/* Part 4: Maths (Statistics + Probability) diagrams. */
(function(){
  const D=window.NCDiagrams;
  function C(sk,k,f){ return (sk&&sk[k])||f; }
  function txt(ctx,s,x,y,col,font,align){ ctx.fillStyle=col; ctx.font=font; ctx.textAlign=align||"center"; ctx.fillText(s,x,y); }
  function nf(x){ if(x==null||isNaN(x))return ""; if(Math.abs(x)>=1e6||(x!==0&&Math.abs(x)<1e-3))return Number(x).toPrecision(4);
    if(Math.abs(x-Math.round(x))<1e-9)return String(Math.round(x)); return (Math.round(x*1000)/1000).toString(); }
  function ink(sk){return C(sk,"ink","#2b2b2b");} function acc(sk){return C(sk,"accent","#b4532a");}
  function soft(sk){return C(sk,"inkSoft","#8a8a8a");} function p2(sk){return C(sk,"paper2","#f1ece2");}
  function yes(sk){return C(sk,"yes","#2f7a52");} function mono(sk){return C(sk,"mono","monospace");}
  function sans(sk){return C(sk,"sans","sans-serif");} function rule(sk){return C(sk,"rule","#ddd");}

  // number line with each data point as a dot, plus a marker line at `mark`
  function numberLine(ctx,W,H,sk,vals,mark,markLabel){
    const x0=50,x1=W-40,y=H*0.6; vals=vals||[];
    let mn=Math.min.apply(null,vals.concat([mark])), mx=Math.max.apply(null,vals.concat([mark]));
    if(mn===mx){mn-=1;mx+=1;}
    const sx=v=>x0+(x1-x0)*((v-mn)/(mx-mn));
    ctx.strokeStyle=rule(sk); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(x0,y); ctx.lineTo(x1,y); ctx.stroke();
    // ticks
    txt(ctx,nf(mn),x0,y+20,soft(sk),"10px "+mono(sk)); txt(ctx,nf(mx),x1,y+20,soft(sk),"10px "+mono(sk));
    // points
    vals.forEach(v=>{ ctx.fillStyle=acc(sk); ctx.globalAlpha=0.7; ctx.beginPath(); ctx.arc(sx(v),y,5,0,2*Math.PI); ctx.fill(); ctx.globalAlpha=1; });
    if(typeof mark==="number"){ const mxp=sx(mark);
      ctx.strokeStyle=ink(sk); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(mxp,y-34); ctx.lineTo(mxp,y+10); ctx.stroke();
      txt(ctx,markLabel+" "+nf(mark),mxp,y-40,ink(sk),"bold 13px "+sans(sk)); }
  }
  // bar chart of frequencies {label:count}
  function freqBars(ctx,W,H,sk,freq,markVals){
    const keys=Object.keys(freq); const n=keys.length||1; axisX(ctx,W,H,sk);
    const base=H-44, top=46, maxC=Math.max.apply(null,keys.map(k=>freq[k]).concat([1]));
    const gap=8, bw=Math.min(60,(W-90)/n-gap); let x=54;
    keys.forEach(k=>{ const h=(freq[k]/maxC)*(base-top); const hot=markVals&&markVals.indexOf(parseFloat(k))>=0;
      ctx.fillStyle=hot?acc(sk):soft(sk); ctx.fillRect(x,base-h,bw,h); ctx.strokeStyle=ink(sk); ctx.lineWidth=1; ctx.strokeRect(x,base-h,bw,h);
      txt(ctx,freq[k],x+bw/2,base-h-5,ink(sk),"11px "+sans(sk)); txt(ctx,k,x+bw/2,base+15,soft(sk),"10px "+mono(sk)); x+=bw+gap; });
  }
  function axisX(ctx,W,H,sk){ ctx.strokeStyle=rule(sk); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(48,H-44); ctx.lineTo(W-30,H-44); ctx.stroke(); }
  function dial(ctx,W,H,sk,frac,center,sub){ frac=Math.max(0,Math.min(1,frac)); const cx=W/2,cy=H*0.66,R=Math.min(W*0.32,H*0.42);
    ctx.lineWidth=16; ctx.lineCap="round"; ctx.strokeStyle=rule(sk); ctx.beginPath(); ctx.arc(cx,cy,R,Math.PI,2*Math.PI); ctx.stroke();
    ctx.strokeStyle=acc(sk); ctx.beginPath(); ctx.arc(cx,cy,R,Math.PI,Math.PI+Math.PI*frac); ctx.stroke(); ctx.lineCap="butt";
    txt(ctx,center,cx,cy-6,ink(sk),"bold 20px "+sans(sk)); if(sub)txt(ctx,sub,cx,cy+16,soft(sk),"11px "+mono(sk)); }
  function scoreboard(ctx,W,H,sk,value,label,note){ const cx=W/2,cy=H/2; ctx.fillStyle=p2(sk); ctx.strokeStyle=rule(sk); ctx.lineWidth=1;
    const bw=Math.min(W*0.5,240),bh=70; ctx.fillRect(cx-bw/2,cy-bh/2-6,bw,bh); ctx.strokeRect(cx-bw/2,cy-bh/2-6,bw,bh);
    txt(ctx,value,cx,cy+6,ink(sk),"bold 24px "+mono(sk)); txt(ctx,label,cx,cy-bh/2-14,ink(sk),"bold 13px "+sans(sk));
    if(note)txt(ctx,note,cx,cy+bh/2+14,soft(sk),"11px "+mono(sk)); }

  D["average"]=function(ctx,W,H,d,sk){ numberLine(ctx,W,H,sk,d.values||[],d.mean,"mean"); };
  D["median"]=function(ctx,W,H,d,sk){ numberLine(ctx,W,H,sk,d.sorted||[],d.median,"median"); };
  D["mode"]=function(ctx,W,H,d,sk){ if(d.frequencies) freqBars(ctx,W,H,sk,d.frequencies,d.modes||[]);
    txt(ctx,(d.modes&&d.modes.length?("mode "+d.modes.join(", ")):"no mode"),W/2,24,ink(sk),"bold 13px "+sans(sk)); };
  D["variance"]=function(ctx,W,H,d,sk){ numberLine(ctx,W,H,sk,[],d.mean,"mean");
    scoreboard(ctx,W,H,sk,nf(d.variance),(d.kind==="sample"?"sample":"population")+" variance","mean "+nf(d.mean)); };
  D["standard-deviation"]=function(ctx,W,H,d,sk){ scoreboard(ctx,W,H,sk,nf(d.standard_deviation),(d.kind==="sample"?"sample":"population")+" std dev","mean "+nf(d.mean)+" \u00b7 var "+nf(d.variance)); };
  D["probability"]=function(ctx,W,H,d,sk){ dial(ctx,W,H,sk,(d.probability||0), nf(d.percent)+"%", "favourable / total"); };
  D["permutation"]=function(ctx,W,H,d,sk){ scoreboard(ctx,W,H,sk,nf(d.permutations), nf(d.n)+"P"+nf(d.r), "ordered arrangements"); };
  D["combination"]=function(ctx,W,H,d,sk){ scoreboard(ctx,W,H,sk,nf(d.combinations), nf(d.n)+"C"+nf(d.r), "unordered selections"); };
  window.NCDiagrams=D;
})();

}
</script>

<script>
(function(){
  const box=document.getElementById("nc-explain-box");
  function style(){
    if(!box||!window.NCSkin) return;
    box.querySelectorAll(".nc-explain-card").forEach(c=>{c.style.background=NCSkin.paper2;c.style.border="1px solid "+NCSkin.rule;c.style.borderRadius="8px";c.style.padding="12px 14px";c.style.marginBottom="10px";});
    box.querySelectorAll(".nc-explain-h").forEach(h=>{h.style.color=NCSkin.accent;h.style.fontFamily=NCSkin.mono||"monospace";h.style.fontSize="14px";h.style.margin="0 0 6px";h.style.fontWeight="600";});
    box.querySelectorAll(".nc-explain-p").forEach(p=>{p.style.color=NCSkin.ink;p.style.fontSize="14.5px";p.style.lineHeight="1.55";p.style.margin="0";});
  }
  window.__ncExplain=function(items){
    if(!box) return;
    if(!items||!items.length){ box.innerHTML=""; return; }
    box.innerHTML=items.map(it=>`<div class="nc-explain-card"><div class="nc-explain-h">${it.heading}</div><p class="nc-explain-p">${it.body}</p></div>`).join("");
    style();
  };
  window.addEventListener("nc-theme-change", style);
})();
</script>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const PFX="bepa";
  const cv = $(PFX+"-canvas"), ctx = cv.getContext("2d");
  const SLUG = "{{ calc.slug }}";
  let last = null, mode = "direct";

  function S(){ return window.NCSkin || {}; }

  // Hide the framework's external steps panel — this viz keeps its own in-box toggle.
  function hideOuterSteps(){ const ext=document.getElementById("nc-steps"); if(ext){ ext.hidden=true; ext.style.display="none"; } }

  function styleFields(){
    const panel = document.querySelector('.viz-panel[data-slug="'+SLUG+'"]');
    if(!panel||!window.NCSkin) return;
    const bg = NCSkin.paper2 || "transparent";
    panel.querySelectorAll("input, select").forEach(el=>{ el.style.background=bg; el.style.color=NCSkin.ink; el.style.border="1px solid "+NCSkin.rule; el.style.borderRadius="6px"; el.style.padding="4px 6px"; });
    panel.querySelectorAll("label span").forEach(el=>{ if(!el.classList.contains("nc-field")) el.style.color=NCSkin.ink; });
    const d=$(PFX+"-disc"); if(d){ d.style.background=NCSkin.paper2; d.style.color=NCSkin.inkSoft; d.style.border="1px solid "+NCSkin.rule; }
    const seg=$(PFX+"-learn2");
    if(seg){ seg.querySelectorAll("button").forEach(b=>{ const on=b.classList.contains("active"); b.style.color=on?(NCSkin.paper2||"#fff"):NCSkin.ink; b.style.background=on?(NCSkin.accent||"#888"):"transparent"; }); }
  }

  function renderSteps(steps){
    const el=$(PFX+"-steps"); if(!el) return;
    if(!steps||!steps.length){ el.innerHTML="<p style='opacity:.7'>No working to show for these inputs.</p>"; return; }
    const sk=S();
    el.innerHTML=steps.map(s=>(
      '<div style="padding:8px 10px;border:1px solid '+(sk.rule||"#ddd")+';border-radius:8px;margin-bottom:8px">'
      +'<div style="font-weight:600;font-size:.9rem;color:'+(sk.accent||"#444")+'">'+(s.label||"")+'</div>'
      +'<div style="margin:3px 0;font-family:'+(sk.mono||"monospace")+';font-size:.95rem;color:'+(sk.ink||"#222")+'">'+(s.math||"")+'</div>'
      +(s.note?'<div style="font-size:.85rem;opacity:.8;color:'+(sk.ink||"#222")+'">'+s.note+'</div>':'')
      +'</div>')).join("");
    if(window.MathJax && MathJax.typesetPromise){ try{ MathJax.typesetPromise([el]); }catch(e){} }
  }

  function applyMode(){
    const out=$(PFX+"-out"), steps=$(PFX+"-steps");
    if(mode==="steps"){ if(out)out.style.display="none"; if(steps)steps.style.display="block"; }
    else { if(out)out.style.display="block"; if(steps)steps.style.display="none"; }
    const seg=$(PFX+"-learn2");
    if(seg){ seg.querySelectorAll("button").forEach(b=>{ const on=b.getAttribute("data-mode")===mode; b.classList.toggle("active",on); b.setAttribute("aria-pressed",on?"true":"false"); }); }
    styleFields();
  }

  function readBody(){
    const body={}; const panel = document.querySelector('.viz-panel[data-slug="'+SLUG+'"]');
    panel.querySelectorAll("[data-k]").forEach(el=>{ const k=el.getAttribute("data-k");
      if(el.getAttribute("data-list")){ body[k]=el.value; }
      else if(el.tagName==="SELECT"){ body[k]=el.value; }
      else { body[k]= el.value===""? null : parseFloat(el.value); } });
    return body;
  }

  function draw(d){
    if(!d){ ctx.clearRect(0,0,cv.width,cv.height); return; }
    const sk=S(); ctx.clearRect(0,0,cv.width,cv.height);
    const fn=(window.NCDiagrams&&(window.NCDiagrams[SLUG]||window.NCDiagrams.__fallback));
    try{ if(fn) fn(ctx,cv.width,cv.height,d,sk); }catch(e){ /* never break the page on a draw error */ }
  }

  async function update(){
    let data;
    try{
      const r=await fetch("/api/compute/"+SLUG,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(readBody())});
      data=await r.json();
    }catch(e){ $(PFX+"-out").textContent="compute error"; return; }
    if(data.disclaimer) $(PFX+"-disc").textContent="\u26A0 "+data.disclaimer;
    hideOuterSteps();
    if(data.error){ $(PFX+"-out").innerHTML="<b>"+data.error+"</b>"; renderSteps([]); last=null; ctx.clearRect(0,0,cv.width,cv.height); return; }
    $(PFX+"-out").innerHTML=`<div style="line-height:1.7"><b>${data.result||""}</b></div>`;
    renderSteps(data.steps||[]);
    try{ if(window.__ncExplain) __ncExplain(data.explanation); }catch(e){}
    last=data; draw(last);
  }

  const panel = document.querySelector('.viz-panel[data-slug="'+SLUG+'"]');
  panel.querySelectorAll("[data-k]").forEach(el=>{ el.addEventListener("input", update); el.addEventListener("change", update); });
  const seg=$(PFX+"-learn2");
  if(seg){ seg.querySelectorAll("button").forEach(b=>{ b.addEventListener("click",()=>{ mode=b.getAttribute("data-mode"); applyMode(); }); }); }
  window.addEventListener("nc-theme-change", ()=>{ styleFields(); draw(last); });

  hideOuterSteps(); applyMode(); styleFields(); update();
})();
</script>
