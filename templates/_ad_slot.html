{# Skin-consistent ad slot. Renders only when ADSENSE_CLIENT is configured
   in branding.py, so the design is never broken by an empty/raw ad box.
   Drop your publisher ID + slot ID in branding.py when approved. #}
{% if adsense_client %}
<aside class="ad-slot" aria-label="Advertisement">
  <span class="ad-label">advertisement</span>
  <ins class="adsbygoogle"
       style="display:block"
       data-ad-client="{{ adsense_client }}"
       data-ad-slot="{{ ad_slot or '' }}"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
</aside>
{% endif %}
